# Both platforms build on every change (project.md sec 12.4).
#
# That is the whole point of this file: a change that builds on desktop and
# breaks Android is the failure mode the entire architecture is arranged to
# prevent, and nothing but CI catches it reliably. Neither job is allowed
# to be continue-on-error for that reason -- a job whose failure is ignored
# is a job that is not checking anything.
#
# The android job first ran, and passed, on 2026-09-01 -- the last day the
# workflow ran before it was switched off while the repository was private.
name: build

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      # Submodules too: the sabotage specs' anchors include softkeys/, and
      # without it every one of them reads as naming a file that is not
      # there (first seen 2026-10-22, the workflow's first run since
      # softkeys became a submodule).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Indentation gate
        run: make style

  # sec 9.6: "Fail the build if a font doesn't qualify." Its own job rather
  # than a step of the Linux build, because it needs 300 MB of upstream
  # release archives and nothing else does -- the app builds and tests
  # without a single font present.
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyed on the fetch script, which is where the pinned versions and
      # checksums live: change a version, re-download; otherwise don't.
      - name: Cache the curated font set
        id: font-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-${{ hashFiles('tool/fetch-fonts.sh') }}

      - name: Fetch fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: make fonts

      - name: Install fontTools
        run: pip install fonttools

      - name: Validate against sec 9.1
        run: make check-fonts

  linux:
    runs-on: ubuntu-latest
    steps:
      # submodules, because libvterm IS one (sec 7) and the build compiles
      # it from source. Without this the checkout leaves vterm/ empty, the
      # object list expands to nothing, and the build dies on `ar rcs
      # build-vterm/libvterm.a` with no members -- which is what every run
      # of this job had been doing since it was written. The android job
      # below had it from the start; this one never did, and the failure
      # reads as an archiver problem rather than a checkout one.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt 6 (distro packages)
        run: |
          sudo apt-get update
          # Every -dev here answers a PKGCONFIG line in beerssh.pro, named
          # explicitly even where something else would drag it in. libssh is
          # not among them: it is the vendored libssh/ submodule, built static
          # by cmake with libssh-patch/ applied (sec 8.4), so cmake, libssl-dev
          # and zlib1g-dev are what it needs instead. libsecret-1-dev
          # arrived only because the runner image happened to carry it -- a
          # build that depends on a package nobody declared fails one image
          # update later, with a pkg-config error that names the library and
          # not the fix. qt6-base-dev covers Qt6DBus, which the desktop build
          # needs for the XDG appearance portal (sec 6.2). openssh-client is
          # not built against: it is the witness the beersshd tests drive
          # (sec 19), and without it they skip -- a green run that tested
          # nothing about the server.
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev cmake \
                                  libsixel-dev libssl-dev libsecret-1-dev \
                                  zlib1g-dev libxcb1-dev openssh-client
      - name: Build
        run: make
      - name: Headless smoke test
        run: make test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The host Qt is not optional: androiddeployqt, moc and rcc run on
      # the host even though everything else is cross-built.
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: linux
          target: desktop

      # host all_os, not linux: from Qt 6.7 the Android packages are
      # published under all_os, and asking for linux finds no version at
      # all ("No available Qt version found", 2026-10-22).
      - name: Install Qt for Android (arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: all_os
          target: android
          arch: android_arm64_v8a

      # The NDK the Qt kit was built with, which is the one its
      # mkspecs/qdevice.pri names: r27c for 6.12.0. Not the runner's
      # default or newest -- libraries cross-compiled with another NDK
      # build and then fail to dlopen on a device, which reads as a missing
      # library rather than a toolchain mismatch (the android-build skill),
      # and a build-only job would never see it. Installed when the image
      # lacks it, and exported for every step after this one.
      - name: Use the NDK the Qt kit names
        run: |
          ndk=27.2.12479018
          grep -q 'android-ndk-r27c' "$QT_ROOT_DIR/mkspecs/qdevice.pri" || {
            echo "::error::the kit no longer names r27c; update the NDK pinned here"
            grep NDK "$QT_ROOT_DIR/mkspecs/qdevice.pri"
            exit 1
          }
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "BSSH_NDK_VERSION=$ndk" >> "$GITHUB_ENV"

      # libssh and OpenSSL have to be cross-compiled; there is no such
      # thing as a system libssh in an NDK sysroot. Cached because it is
      # several minutes of work that only changes when the pinned
      # versions do -- and the NDK is one of them: keyed on the script
      # alone, a new NDK would have reused libraries the old one built.
      - name: Cache cross-compiled dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/android
          key: android-deps-${{ runner.os }}-ndk${{ env.BSSH_NDK_VERSION }}-${{ hashFiles('tool/build-deps-android.sh', 'libssh-patch/**') }}

      # ANDROID_NDK_ROOT comes from the RUNNER, and is read in the shell
      # rather than through ${{ env.* }}.
      #
      # That expression context holds what a workflow, job or step has set
      # -- not what the image exported -- so it expanded to nothing and the
      # env: block then CLOBBERED the perfectly good ANDROID_NDK_ROOT the
      # image provides. The script said "ANDROID_NDK_ROOT is not set" and
      # exited 1, which reads as a missing NDK rather than as a workflow
      # overwriting a variable with an empty string.
      #
      # Run on a cache hit too. libssh is the patched submodule (sec 8.4),
      # and the script compares the pinned commit and the patches against
      # what the cached archive was built from, rebuilding only on a
      # difference -- skipping the step on a hit would have linked an
      # archive from before a patch, or before a submodule bump the key
      # cannot see.
      - name: Cross-compile libssh + OpenSSL
        run: |
          : "${ANDROID_NDK_ROOT:=$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_ROOT
          echo "using NDK at $ANDROID_NDK_ROOT"
          tool/build-deps-android.sh arm64-v8a

      # Compiles and links libbeerssh_arm64-v8a.so. Packaging into an AAB
      # additionally needs the SDK, which the runner image provides.
      - name: Build
        run: |
          : "${ANDROID_NDK_ROOT:=$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_ROOT
          make android QT_ANDROID_ROOT="$QT_ROOT_DIR"
