# Sabotages for sec 11's refused passwords: one the server said no to is
# never offered again, a refusal is not a drop the manager dials after,
# and the prompt says why it is asking again. Reported from a phone,
# where a wrong password was retried until the manager gave up -- the
# way a server counting failures blackholes the address.
#
# Not held here: the libssh worker turning SSH_AUTH_DENIED into
# password_rejected rather than a failure, which only a real server can
# show (check-ssh); and the window declining a refused STORED password,
# which the session's own refusal stands behind.

[[sabotage]]
name = "a refused password is sent again"
file = "src/model/session.cpp"
find = "\tif (was_refused(password)) {\n\t\tm_password_refused = true;\n\t\temit needs_password();\n\t\treturn;\n\t}\n\n\tm_offered = password;"
replace = "\tm_offered = password;"
expect = "a_refused_password_is_never_offered_again"

[[sabotage]]
name = "a refusal is not remembered"
file = "src/model/session.cpp"
find = "\t\tif (!m_offered.isEmpty()) m_refused.insert(refused_key(m_offered));\n"
replace = ""
expect = "a_refused_password_is_never_offered_again"

[[sabotage]]
name = "a refused password is reconnected after"
file = "src/model/conn_manager.cpp"
find = "\tif (m_session->password_refused()) {\n\t\tcancel();\n\t\treturn;\n\t}\n"
replace = ""
expect = "a_refused_password_is_not_reconnected"

# Kept as soon as it is offered, as it used to be: a link that drops
# before the server answers leaves a password nobody has seen work, and the
# reconnect replays it.
[[sabotage]]
name = "a password is kept before the server answers it"
file = "src/model/session.cpp"
find = "\tm_offered = password;\n\tif (m_transport) m_transport->authenticate_password(password);\n"
replace = "\tm_offered = password;\n\tm_password = password;\n\tif (m_transport) m_transport->authenticate_password(password);\n"
expect = "a_password_never_answered_is_not_replayed"

[[sabotage]]
name = "the prompt does not say the password was refused"
file = "src/ui/password_prompt.cpp"
find = "\tm_note->setVisible(!note.isEmpty());\n"
replace = ""
expect = "the_password_prompt_types_with_softkeys"

[[sabotage]]
name = "the prompt keeps the system keyboard down after it closes"
file = "src/ui/password_prompt.cpp"
find = "\tQDialog::done(result);\n\tif (m_keyboard) qApp->setAutoSipEnabled(true);\n"
replace = "\tQDialog::done(result);\n"
expect = "the_password_prompt_types_with_softkeys"

# The hang-up after a refusal reported as whatever the closed socket looked
# like -- "Socket error: No such file or directory" on the phone.
[[sabotage]]
name = "a hang-up after a refusal is not said as one"
file = "src/model/session.cpp"
find = "\t\tif (m_password_refused) {\n\t\t\temit failed("
replace = "\t\tif (false) {\n\t\t\temit failed("
expect = "a_refused_password_is_not_reconnected"
