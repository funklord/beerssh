# Sabotages for the open sessions listed on the touch host list (sec 8.5,
# the holder 2026-10-22): a row per session above the hosts, a tap back to
# THAT session, and the terminal menu's way there besides Back. Held by
# the_host_list_leads_back_to_open_sessions.

# A tap goes back to "the sessions" rather than the one tapped -- what the
# single button it replaced did.
[[sabotage]]
name = "a tapped session row shows another session"
file = "src/ui/host_list.cpp"
find = "\t\t\t\temit session_picked(session);\n"
replace = "\t\t\t\temit session_picked(m_open.last());\n"
expect = "the_host_list_leads_back_to_open_sessions"

# The terminal menu's front door is named for the desktop's page on a
# phone, where it opens the sessions and hosts.
[[sabotage]]
name = "the touch front door is called Hosts and Settings"
file = "src/ui/main_window.cpp"
find = "\tQAction *front_door = menu->addAction(m_host_list ? QStringLiteral(\"&Sessions and Hosts\")\n"
replace = "\tQAction *front_door = menu->addAction(false ? QStringLiteral(\"&Sessions and Hosts\")\n"
expect = "the_host_list_leads_back_to_open_sessions"

# The first row comes back drawn as chosen after Back.
[[sabotage]]
name = "a row nobody tapped stays highlighted"
file = "src/ui/host_list.cpp"
find = "\tm_list->clearSelection();\n\tm_list->setCurrentRow(-1);\n}"
replace = "\tif (m_list->count() > 1) m_list->setCurrentRow(1);\n}"
expect = "the_host_list_leads_back_to_open_sessions"

# The page's title said twice, as a heading under it.
[[sabotage]]
name = "a Hosts heading under the page titled Hosts"
file = "src/ui/host_list.cpp"
find = "\t\t\trow->setSizeHint(QSize(0, BSSH_TOUCH_ROW_DP));\n\t\t}\n\t}"
replace = "\t\t\trow->setSizeHint(QSize(0, BSSH_TOUCH_ROW_DP));\n\t\t}\n\t\tnew QListWidgetItem(QStringLiteral(\"Hosts\"), m_list);\n\t}"
expect = "the_host_list_leads_back_to_open_sessions"
