# Sabotages for moving a live session to another process (project.md
# sec 8.4, step 4): bssh_session's export_handoff/import_handoff and the
# local shell's transport handoff. Each leaves the move answering success
# and the moved session broken, which only using it afterwards can show.
# The SSH transport's own spec needs a server: session-move-ssh.toml.

# Letting go of the shell by hanging it up, as closing a tab does: the
# moved session's shell dies the moment the old one is freed.
[[sabotage]]
name = "the giving side hangs up the shell it gave away"
file = "src/ssh/pty_session.cpp"
find = "\tif (m_master >= 0) ::close(m_master);\n\tm_master = -1;\n\tm_child = -1;\n"
replace = "\tif (m_child > 0) ::kill(pid_t(m_child), SIGHUP);\n\tif (m_master >= 0) ::close(m_master);\n\tm_master = -1;\n\tm_child = -1;\n"
expect = "a_live_local_session_moves_to_another_session"

# The imported transport never wired to the session: the connection is
# alive and what it says reaches nobody.
[[sabotage]]
name = "an imported session does not listen to its transport"
file = "src/model/session.cpp"
find = "\tsession->wire_transport();\n\tsession->send_out(held);\n"
replace = "\tsession->send_out(held);\n"
expect = "a_live_local_session_moves_to_another_session"

# A move called off, and the session left stopped: it answers nothing.
[[sabotage]]
name = "a refused move does not resume the session"
file = "src/model/session.cpp"
find = "\tif (m_transport) m_transport->resume_transport();\n"
replace = ""
expect = "a_refused_move_leaves_the_session_running"

# The giver commits as soon as the state is sent, without waiting for the
# taker's "taken": a taker that vanishes takes the session with it, and
# the giver has released a shell nobody holds.
[[sabotage]]
name = "the giver lets go before the taker has the session"
file = "src/model/handoff_point.cpp"
find = "\tconst bool taken = sent &&\n"
replace = "\tconst bool taken = true ||\n"
expect = "a_taker_that_vanishes_leaves_the_session_running"

# A session that lands on none of this process's windows -- let go over the
# status line, or over the desktop beside it -- is taken and shown nowhere:
# a running terminal no window can reach.
[[sabotage]]
name = "a session landing on no window gets none"
file = "src/ui/main_window.cpp"
find = "\telse {\n\t\tbssh_main_window *window = new bssh_main_window;\n\t\twindow->setAttribute(Qt::WA_DeleteOnClose);\n\t\twindow->show();\n\t\twindow->adopt_session(session);\n\t\twindow->move(global - QPoint(40, 20));\n\t}\n"
replace = ""
expect = "a_dropped_session_lands_in_this_process"

# The payload's path read up to its first colon, as if it were one more
# field: a runtime directory with a colon in it names a socket that is not
# there, and the drop takes nothing.
[[sabotage]]
name = "the payload's path stops at a colon"
file = "src/ui/terminal_view.cpp"
find = "\tif (path) *path = QString::fromUtf8(data.mid(at + 1));\n"
replace = "\tif (path) *path = QString::fromUtf8(data.mid(at + 1).split(':').first());\n"
expect = "a_drag_payload_names_where_to_ask"

# The new version takes the sessions and never says it is done: the old
# one, emptied, runs on with no window to close it from. The app binary is
# what the test runs, so this needs `make test`, which rebuilds it.
[[sabotage]]
name = "the new version never asks the old one to quit"
file = "src/main.cpp"
find = "\t\t\tbssh_handoff_point::request_quit(line.adopt_from);\n"
replace = ""
expect = "a_new_version_takes_every_session"

# A session taken from another process arrives with no tmux and screen
# listed: it never connects there, and the list stayed behind.
[[sabotage]]
name = "a moved session is not listed again"
file = "src/model/session.cpp"
find = "\tQTimer::singleShot(0, session, [session] { session->list_multiplexers(); });"
replace = ""
expect = "a_live_session_moves_to_another_process"

# A sweep that removes live sockets too: another window can no longer be
# offered a terminal.
[[sabotage]]
name = "the sweep removes sockets that answer"
file = "src/model/handoff_point.cpp"
find = "\t\tif (refused && ::unlink(address.sun_path) == 0) ++removed;"
replace = "\t\t(void) refused;\n\t\tif (::unlink(address.sun_path) == 0) ++removed;"
expect = "only_sockets_nobody_listens_on_are_swept"
