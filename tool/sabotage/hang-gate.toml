# The hang watchdog's gate (project.md sec 5.1, 5.6): silence past the
# threshold anywhere, foreground from the platform's lifecycle, and the
# clock restarted on resume. Each half is broken here on its own.
#
# NOT COVERED, and not coverable from the desktop suite: the wiring that
# carries Android's callbacks in -- BsshLifecycle.java, the native
# registration in platform_android.cpp, and watch_foreground being asked
# at all. None of it is compiled into the desktop test binary. What proves
# it is the device, and sec 5.1 says what to look for there.

# The gate goes back to asking whether the app is in front. A main thread
# wedged in the background then says nothing, which is how a drop on the
# Fold went unhandled for 12 minutes with no trace in the log.
[[sabotage]]
name = "the watchdog ignores a wedge in the background"
file = "src/hang_watchdog.cpp"
find = "\treturn bssh_hang_should_dump(idle_ms(now_ms), threshold_ms);"
replace = "\treturn m_foreground.load() && bssh_hang_should_dump(idle_ms(now_ms), threshold_ms);"
expect = "a_loop_silent_in_the_background_is_a_hang"

# The gate stops looking at the threshold: every moment reads as a hang.
[[sabotage]]
name = "the gate fires at once"
file = "src/hang_watchdog.cpp"
find = "\treturn idle_ms >= threshold_ms;"
replace = "\treturn true;"
expect = "the_hang_gate_fires_past_the_threshold"

# The lifecycle's answer never lands, so the log and the coming _exit()
# gate keep whatever it started with -- the old shape, where "foreground"
# was a sample that stopped being taken.
[[sabotage]]
name = "a lifecycle change is not recorded"
file = "src/hang_watchdog.cpp"
find = "\tm_foreground.store(foreground);"
replace = ""
expect = "a_loop_silent_in_the_background_is_a_hang"

# Resume does not restart the clock, so a process Android froze while
# away is charged for that time and dumped before its first beat.
[[sabotage]]
name = "a resume is charged for the time the app was away"
file = "src/hang_watchdog.cpp"
find = "\tif (foreground) m_last_beat_ms.store(now_ms);"
replace = ""
expect = "a_loop_silent_in_the_background_is_a_hang"
