# Sabotages for sec 6.4's file panel: the remote directory listed over SFTP
# on the session's own connection, files copied back never over what is
# here, and the panel that shows both.
#
# Every test here is live, so run with check-ssh as the suite:
#
#   BSSH_SABOTAGE_SUITE="make check-ssh" tool/sabotage.py tool/sabotage/file-panel.toml

# . and .. listed as entries: the panel offers them as directories.
[[sabotage]]
name = "a listing includes . and .."
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\tif (entry.name == QStringLiteral(\".\") || entry.name == QStringLiteral(\"..\")) continue;\n\t\tif (entry.kind == bssh_remote_entry_t::LINK) {"
replace = "\t\tif (entry.kind == bssh_remote_entry_t::LINK) {"
expect = "the_file_panel_lists_a_remote_directory"

# A link to a directory not said to lead to one: the panel cannot open it.
[[sabotage]]
name = "a link to a directory is not known for one"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\t\t\tentry.leads_to_directory = target->type == SSH_FILEXFER_TYPE_DIRECTORY;"
replace = "\t\t\t\tentry.leads_to_directory = false;"
expect = "the_file_panel_lists_a_remote_directory"

# A name already here taken as free: the copy back fails or replaces it.
[[sabotage]]
name = "a file copied back is given a name already taken"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\t                                    [&into](const QString &candidate) {\n\t\t\treturn QFileInfo::exists(into.filePath(candidate)) || QFileInfo(into.filePath(candidate)).isSymLink();"
replace = "\t\t                                    [&into](const QString &candidate) {\n\t\t\treturn false && QFileInfo::exists(into.filePath(candidate));"
expect = "files_come_back_from_the_remote_never_over_what_is_here"

# A link to a directory followed inside a tree being copied back.
[[sabotage]]
name = "a copy back follows a link to a directory"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\t\t\t\tif (to_directory) continue;\n"
replace = ""
expect = "files_come_back_from_the_remote_never_over_what_is_here"

# A stopped copy back leaves its half-written file.
[[sabotage]]
name = "a stopped copy back leaves its file"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\tif (job.target.isOpen()) {\n\t\tjob.target.close();\n\t\tjob.target.remove();\n\t}"
replace = "\tif (job.target.isOpen()) job.target.close();"
expect = "a_copy_back_can_be_stopped_and_leaves_nothing_half_written"

# A session moved to another process while a copy back runs on its
# connection: the copy's next read is from a stream it no longer owns.
[[sabotage]]
name = "a session is moved with a copy back running"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\tif (m_upload || m_download) {"
replace = "\tif (m_upload) {"
expect = "a_copy_back_can_be_stopped_and_leaves_nothing_half_written"

# Files before directories, or all by name: the panel's order is lost.
[[sabotage]]
name = "the panel does not put directories first"
file = "src/ui/file_panel.cpp"
find = "\t\tif (opens(a) != opens(b)) return opens(a);\n"
replace = ""
expect = "the_file_panel_browses_and_copies_both_ways"

# Files dropped on the panel arrive, and the panel goes on showing the
# directory as it was before they did.
[[sabotage]]
name = "the panel does not show what was copied into it"
file = "src/ui/file_panel.cpp"
find = "\t\tif (directory == m_path || directory.isEmpty()) open_directory(m_path);\n"
replace = ""
expect = "the_file_panel_browses_and_copies_both_ways"

# A rename not looked before: the server's posix-rename replaces the file
# already of that name.
[[sabotage]]
name = "a rename replaces what is there"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\tsftp_attributes there = sftp_lstat(sftp, to.toUtf8().constData());\n\t\tif (there) {"
replace = "\t\tsftp_attributes there = nullptr;\n\t\tif (there) {"
expect = "the_file_panel_renames_makes_and_removes"

# A link inside a tree being removed taken for the directory it leads to:
# the removal empties a directory outside the tree.
[[sabotage]]
name = "a removal follows a link out of the tree"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\t\t\tconst bool directory = attributes->type == SSH_FILEXFER_TYPE_DIRECTORY;\n\t\t\t\tsftp_attributes_free(attributes);\n\t\t\t\tif (name == QStringLiteral(\".\") || name == QStringLiteral(\"..\")) continue;\n\t\t\t\tjob.stack.append("
replace = "\t\t\t\tconst bool directory = attributes->type == SSH_FILEXFER_TYPE_DIRECTORY\n\t\t\t\t                       || attributes->type == SSH_FILEXFER_TYPE_SYMLINK;\n\t\t\t\tsftp_attributes_free(attributes);\n\t\t\t\tif (name == QStringLiteral(\".\") || name == QStringLiteral(\"..\")) continue;\n\t\t\t\tjob.stack.append("
expect = "the_file_panel_renames_makes_and_removes"

# A name with a slash taken as a name: a rename moves the file elsewhere.
[[sabotage]]
name = "a name may leave the directory shown"
file = "src/ui/file_panel.cpp"
find = "\treturn !name.isEmpty() && !name.contains(QLatin1Char('/')) && name != QStringLiteral(\".\")"
replace = "\treturn !name.isEmpty() && name != QStringLiteral(\".\")"
expect = "the_file_panel_renames_makes_and_removes"

# Several chosen for removal and only the first removed.
[[sabotage]]
name = "a removal of several stops after the first"
file = "src/ui/file_panel.cpp"
find = "\tif (ok && !m_removals.isEmpty()) {"
replace = "\tif (false) {"
expect = "the_file_panel_renames_makes_and_removes"

# A listing held until a copy back ends: browsing stops while a file
# copies, which is what most SSH tools do.
[[sabotage]]
name = "a listing waits for the copy"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\tif (!m_list) {\n\t\tif (m_list_queue.isEmpty()) return;\n"
replace = "\tif (!m_list) {\n\t\tif (m_list_queue.isEmpty()) return;\n\t\tif (m_download) {\n\t\t\tQTimer::singleShot(10, this, &bssh_libssh_worker::step_list);\n\t\t\treturn;\n\t\t}\n"
expect = "browsing_goes_on_while_a_copy_runs"

# A drag out never staged: every drop gets the sftp:// link, a second
# connection, where the holder wants the link as seldom as possible.
[[sabotage]]
name = "a drag out is never staged"
file = "src/ui/file_panel.cpp"
find = "\tif (m_staging_enabled && !m_session->download_in_progress() && !folder\n"
replace = "\tif (false && m_staging_enabled\n"
expect = "a_file_dragged_out_is_staged_before_it_is_dropped"

# A drag let go over nothing goes on copying, and leaves what it wrote.
[[sabotage]]
name = "an abandoned drag keeps copying"
file = "src/ui/file_panel.cpp"
find = "\tif (action != Qt::IgnoreAction || m_last_staged_dir.isEmpty()) return;"
replace = "\treturn;"
expect = "a_file_dragged_out_is_staged_before_it_is_dropped"

# The mount ignored: a large file is not staged though the mount could
# show it as it arrives, and a drop that comes first gets the link.
[[sabotage]]
name = "a large file is not staged though the mount could show it"
file = "src/ui/file_panel.cpp"
find = "\t    && (mountable || bytes <= m_staging_limit)) {"
replace = "\t    && (bytes <= m_staging_limit)) {"
expect = "a_file_dragged_out_is_staged_before_it_is_dropped"

# XDS answered "S" and nothing copied: the file manager waits for a file
# that never comes. Its test needs X11; check-ssh runs it under xvfb-run.
[[sabotage]]
name = "an XDS save is promised and not begun"
file = "src/ui/file_panel.cpp"
find = "\tif (m_session->download_in_progress()) return false;\n\tm_session->download(paths, folder);\n"
replace = "\tif (m_session->download_in_progress()) return false;\n"
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# The same, where the save waits for a staging to stop: the stop comes
# and the save never begins.
[[sabotage]]
name = "an XDS save waiting on a staging never begins"
file = "src/ui/file_panel.cpp"
find = "\t\t\t\tm_after_discard_dir.clear();\n\t\t\t\tm_session->download(paths, dir);\n"
replace = "\t\t\t\tm_after_discard_dir.clear();\n"
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# Dolphin's call answered and nothing copied. Its test needs a session
# bus; check-ssh starts one with dbus-run-session.
[[sabotage]]
name = "an Ark call copies nothing"
file = "src/ui/file_panel.cpp"
find = "\t\tbssh_ark_extract *extract = new bssh_ark_extract([this, paths](const QString &folder) {\n\t\t\tsave_into(paths, folder);\n"
replace = "\t\tbssh_ark_extract *extract = new bssh_ark_extract([this, paths](const QString &folder) {\n\t\t\tQ_UNUSED(folder);\n"
expect = "a_file_dragged_out_is_saved_where_dolphin_says"

# The mounted file read before it has arrived gets what is there, not a
# wait: a file manager copies a partial file and calls it done.
[[sabotage]]
name = "a mounted read does not wait for the copy"
file = "src/platform/fuse_shelf.cpp"
find = "\tif (!here && !(n.finished && n.whole)) {"
replace = "\tif (false && !here && !(n.finished && n.whole)) {"
expect = "a_file_dropped_on_a_plain_file_manager_is_read_as_it_arrives"

# Pause marked and the copy not held: bytes go on moving under a tile
# that says Paused.
[[sabotage]]
name = "a paused copy goes on copying"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\tjob.scheduled = false;\n\tif (job.paused) return;\n\n"
replace = "\tjob.scheduled = false;\n\n"
expect = "copies_queue_as_tiles_and_pause_between_pieces"

# A copy taken off the queue starts anyway when its turn comes.
[[sabotage]]
name = "a queued copy taken off runs anyway"
file = "src/model/session.cpp"
find = "\tconst transfer_t taken = *transfer;\n\tfor (int i = 0; i < m_transfers.size(); ++i)\n\t\tif (m_transfers.at(i).id == id) m_transfers.removeAt(i--);\n"
replace = "\tconst transfer_t taken = *transfer;\n"
expect = "copies_queue_as_tiles_and_pause_between_pieces"

# A second copy refused, not queued: the tile for it never comes.
[[sabotage]]
name = "a second copy waits for no turn"
file = "src/model/session.cpp"
find = "\tfor (transfer_t &transfer : m_transfers) {\n\t\tif (transfer.direction != direction || transfer.state != TRANSFER_QUEUED) continue;\n\t\tbegin_transfer(transfer);\n\t\treturn;\n\t}\n"
replace = ""
expect = "copies_queue_as_tiles_and_pause_between_pieces"

# XDS spoken on the top level, not the window Qt drags from: a real
# target (pcmanfm-qt) reads no name there and BeerSSH no answer, "E".
[[sabotage]]
name = "XDS is spoken on the top level"
file = "src/ui/file_panel.cpp"
find = "\tif (owner != XCB_WINDOW_NONE && (owner & ~mask) == (top_level & ~mask)) return owner;\n"
replace = ""
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# A folder named alone taken as a file's URL: the copy lands beside the
# folder pcmanfm-qt was showing, not in it.
[[sabotage]]
name = "an XDS answer naming a folder saves beside it"
file = "src/ui/file_panel.cpp"
find = "\tconst QString folder = named.isDir() ? named.absoluteFilePath() : named.absolutePath();"
replace = "\tconst QString folder = named.absolutePath();"
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# A whole staging the save went by stays on disk, its tile saying
# "Ready to drop" until BeerSSH quits.
[[sabotage]]
name = "a whole staging outlives the save that went by it"
file = "src/ui/file_panel.cpp"
find = "\t/* The drop went by the save, so the drag's staged copy serves no one. */\n\tput_away_finished_staging();\n"
replace = ""
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# The staging a save stopped keeps its tile, saying "Stopped".
[[sabotage]]
name = "a stopped staging keeps its tile"
file = "src/ui/file_panel.cpp"
find = "\t\tm_put_away.insert(m_staging_dir);\n"
replace = ""
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# The finish announced before the transfer ends: the save a listener
# starts on hearing it is the transfer end_transfer then ends.
[[sabotage]]
name = "a copy started on a finish is ended in its place"
file = "src/model/session.cpp"
find = "\t\tend_transfer(TRANSFER_DOWN, ok, directory, written, why);\n\t\temit download_finished(ok, directory, written, why);"
replace = "\t\temit download_finished(ok, directory, written, why);\n\t\tend_transfer(TRANSFER_DOWN, ok, directory, written, why);"
expect = "a_file_dragged_out_is_saved_where_the_file_manager_says"

# The mount's files shown read-only: a file manager copies the mode, and
# the dropped copies arrive read-only.
[[sabotage]]
name = "the mount shows its files read-only"
file = "src/platform/fuse_shelf.cpp"
find = "\tattr.mode = n.directory ? (S_IFDIR | 0755) : (S_IFREG | 0644);"
replace = "\tattr.mode = n.directory ? (S_IFDIR | 0555) : (S_IFREG | 0444);"
expect = "a_file_dropped_on_a_plain_file_manager_is_read_as_it_arrives"

# Play offered for anything: a text file handed to a media player.
