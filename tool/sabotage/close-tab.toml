# Sabotages for closing a tab: what the window is left showing, and what
# it is left pointing at.
#
# The defect was a comment describing what the line beneath it did not do.
# detach_session() cleared m_current and THEN called forget() with it, so
# it always forgot nullptr -- and it is forget()'s only caller in the
# tree, so forget() had never removed anything.

# The forget() ORDERING has no entry here, and the reason is worth
# recording. Two fixes cover this path from opposite ends: the session
# closing handler forgets the session unconditionally, and
# detach_session() forgets the one it is letting go. Either alone is
# enough for a closing tab, so breaking one leaves the suite green and a
# sabotage entry for it would report MISSED however correct the code is.
#
# Both are kept because they are correct separately: the unconditional
# one is the only thing covering a session closed while ANOTHER pane is
# focused, and the ordering one is the only thing covering a
# detach_session() reached for some other reason. The split case pins the
# first properly, and cannot be written until split_with works -- it is
# broken for an unrelated reason and a test for it produced one pane
# instead of two.

# Promoting a successor. The tab bar is rebuilt under a QSignalBlocker,
# so currentChanged never fires and show_session() is never reached --
# closing the tab you were looking at left the window BLANK with a live
# session still in the list.
[[sabotage]]
name = "no successor is promoted when the current tab closes"
file = "src/ui/main_window.cpp"
find = "\t\tbssh_session *successor = session_at_tab(m_tabs->currentIndex());\n\t\tshow_session(successor ? successor : m_shown.first());"
replace = "\t\t(void)0;"
expect = "closing_the_visible_tab_leaves_no_view_on_a_dead_session"

# The only touch route to closing a session goes away again.
#
# Restores the state measured on 2026-09-21: every close route ran
# through the tab bar or the menu bar, sec 8.7 dissolved the first on
# touch and the second is desktop-only, so a phone could open sessions
# and never close one. The registry still closes perfectly, which is
# what kept this invisible to every test that closes through it.
[[sabotage]]
name = "the terminal menu stops offering close"
file = "src/ui/main_window.cpp"
find = "\tclose_session->setObjectName(QStringLiteral(\"terminal_close_session\"));"
replace = "\tclose_session->setObjectName(QStringLiteral(\"terminal_close_disabled\"));"
expect = "a_session_can_be_closed_without_a_tab_bar"

# And duplicate, which went the same way for the same reason.
[[sabotage]]
name = "the terminal menu stops offering duplicate"
file = "src/ui/main_window.cpp"
find = "\tduplicate->setObjectName(QStringLiteral(\"terminal_duplicate\"));"
replace = "\tduplicate->setObjectName(QStringLiteral(\"terminal_duplicate_disabled\"));"
expect = "a_session_can_be_closed_without_a_tab_bar"

# A session that is not live loses its way back.
#
# sec 8.4's restore reopens every remembered host and connects none of
# them, so this is the state a phone wakes up in. Without the entry the
# tab menu carried -- and touch has no tab menu -- a restored session is
# the dead end that entry was written to prevent.
[[sabotage]]
name = "a dead session is offered no way to connect"
file = "src/ui/main_window.cpp"
find = "\t\tconnect_now->setObjectName(QStringLiteral(\"terminal_connect\"));"
replace = "\t\tconnect_now->setObjectName(QStringLiteral(\"terminal_connect_disabled\"));"
expect = "a_session_can_be_closed_without_a_tab_bar"

# Choosing Close does nothing.
#
# Before act_on_terminal_menu existed this edit could not be caught by
# anything: the entry is still on the menu, still enabled, and the
# dispatch that ignores it ran only after QMenu::exec, where no headless
# test could reach. The registry still closes sessions perfectly.
[[sabotage]]
name = "choosing Close does not close"
file = "src/ui/main_window.cpp"
find = "\t\tif (m_current && m_registry) m_registry->close(m_current);"
replace = ""
expect = "choosing_a_menu_entry_does_what_it_says"

# Choosing Clear Scrollback does nothing.
[[sabotage]]
name = "choosing Clear Scrollback does not clear"
file = "src/ui/main_window.cpp"
find = "\tif (m_current && m_current->emulator()) m_current->emulator()->clear_scrollback();"
replace = ""
expect = "choosing_a_menu_entry_does_what_it_says"

# Choosing Reset Terminal does nothing.
[[sabotage]]
name = "choosing Reset Terminal does not reset"
file = "src/ui/main_window.cpp"
find = "\tif (m_current && m_current->emulator()) m_current->emulator()->reset_modes();"
replace = ""
expect = "choosing_a_menu_entry_does_what_it_says"

# Detaching a pane into its own window had one route on one platform.
#
# The menu bar's entry says it: "the only route a PANE has out of a
# window. Dragging one out is Alt and a drag, which works and which
# nobody discovers." A phone has neither the menu bar nor the Alt, so
# sec 8.3 put the verb on a desktop surface and sec 8.7 took that
# surface away -- the same shape as Close and Duplicate above.
[[sabotage]]
name = "the terminal menu stops offering detach"
file = "src/ui/main_window.cpp"
find = "\tdetach->setObjectName(QStringLiteral(\"terminal_detach\"));"
replace = "\tdetach->setObjectName(QStringLiteral(\"terminal_detach_disabled\"));"
expect = "a_pane_can_leave_its_window_without_a_pointer"

# And Show as Tab offered where it cannot act.
#
# show_as_tab returns early in a column -- sec 8.7's column holds every
# session and has no bar to reach a dropped one by -- so an enabled entry
# there is one that looks available and does nothing when chosen.
[[sabotage]]
name = "show as tab is offered in a column"
file = "src/ui/main_window.cpp"
find = "\t                    && m_layout->arrangement() != bssh_layout_manager::COLUMN);"
replace = "\t                    );"
expect = "a_pane_can_leave_its_window_without_a_pointer"
