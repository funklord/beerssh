# The kitty keyboard protocol above disambiguate (project.md sec 7.1, tier
# 2): event types, alternate keys, every key as an escape code, associated
# text -- and the stack rules the specification puts beside them.

[[sabotage]]
name = "releases are reported whether or not event types were asked for"
file = "src/term/emulator_vterm.cpp"
find = "\tif (!types) {\n\t\tif (type == EVENT_RELEASE) return true;"
replace = "\tif (false) {\n\t\tif (type == EVENT_RELEASE) return true;"
expect = "kitty_all_keys_as_escapes_with_text_and_alternates"

# Enter becomes CSI 13 u under event types alone, and `reset` can no longer
# be typed at a shell a program left in that mode.
[[sabotage]]
name = "Enter loses its legacy byte without report-all-keys"
file = "src/term/emulator_vterm.cpp"
find = "\t\tif (trio && !all) return type == EVENT_RELEASE;\n"
replace = ""
expect = "kitty_event_types_report_repeats_and_releases"

[[sabotage]]
name = "the shifted key is never reported"
file = "src/term/emulator_vterm.cpp"
find = "\t\talternate = ':' + QByteArray::number(uint(event.shifted));"
replace = "\t\talternate = QByteArray();"
expect = "kitty_all_keys_as_escapes_with_text_and_alternates"

# The protocol forbids control codes in the associated text; Ctrl+A's
# text is 0x01.
[[sabotage]]
name = "a control code goes into the associated text"
file = "src/term/emulator_vterm.cpp"
find = "\t\t\tif (c < 0x20 || (c >= 0x7f && c < 0xa0)) continue;\n"
replace = ""
expect = "kitty_all_keys_as_escapes_with_text_and_alternates"

[[sabotage]]
name = "a modifier's release keeps its own bit set"
file = "src/input/input_router.cpp"
find = "\tif (release.modifier_key == bssh_emulator::KITTY_LEFT_SHIFT)\n\t\trelease.modifiers &= quint8(~bssh_emulator::MOD_SHIFT);\n"
replace = ""
expect = "kitty_all_keys_as_escapes_with_text_and_alternates"

# Presses are never remembered, so no release is ever sent.
[[sabotage]]
name = "a press is not remembered for its release"
file = "src/input/input_router.cpp"
find = "\t\t\t\tm_kitty_pressed.insert(event->key(), kitty);\n"
replace = ""
expect = "kitty_release_answers_its_own_press"

# X11's repeat pairs read as the key coming up.
[[sabotage]]
name = "an autorepeat release is sent as the release"
file = "src/input/input_router.cpp"
find = "\tif (event->isAutoRepeat()) return false;\n\n\tconst auto found = m_kitty_pressed.constFind(event->key());"
replace = "\tconst auto found = m_kitty_pressed.constFind(event->key());"
expect = "kitty_event_types_report_repeats_and_releases"

[[sabotage]]
name = "input-method text sends a press with no release"
file = "src/input/input_router.cpp"
find = "\t\t\tm_emulator->send_key_event(release);\n\t\t}"
replace = "\t\t}"
expect = "kitty_release_answers_its_own_press"

# One stack for both screens: an editor's modes leak into the shell's.
[[sabotage]]
name = "the screens share one keyboard mode stack"
file = "src/term/emulator_vterm.cpp"
find = "\tQList<int> &kitty_stack_ref() { return kitty_stacks[alt_screen ? 1 : 0]; }"
replace = "\tQList<int> &kitty_stack_ref() { return kitty_stacks[0]; }"
expect = "kitty_modes_are_per_screen_and_an_emptied_stack_resets"

[[sabotage]]
name = "a pop that empties the stack keeps the flags"
file = "src/term/emulator_vterm.cpp"
find = "\t\t\t\t\tstack.last() = 0;\n"
replace = ""
expect = "kitty_modes_are_per_screen_and_an_emptied_stack_resets"

# Super reaches libvterm, which reads the unknown bit as a modifier and
# sends Super+Up as CSI 1;17A to a program that asked for nothing.
[[sabotage]]
name = "libvterm is handed the Super bit"
file = "src/term/emulator_vterm.cpp"
find = "\tconst VTermModifier mod = static_cast<VTermModifier>(modifiers & 0x07);"
replace = "\tconst VTermModifier mod = static_cast<VTermModifier>(modifiers);"
expect = "super_is_a_kitty_modifier_and_nothing_else_hears_it"

# Our 0x10 sent as it is, so Super reads as kitty's hyper.
[[sabotage]]
name = "Super is not translated to the protocol's bit"
file = "src/term/emulator_vterm.cpp"
find = "\treturn (modifiers & 0x07) | ((modifiers & bssh_emulator::MOD_SUPER) ? 0x08 : 0);"
replace = "\treturn modifiers;"
expect = "super_is_a_kitty_modifier_and_nothing_else_hears_it"

# Disambiguate alone leaves keypad Enter as a carriage return.
[[sabotage]]
name = "the keypad is left to legacy under disambiguate alone"
file = "src/input/input_router.cpp"
find = "\tif (m_emulator->wants_key_events() || keypad_kitty) {"
replace = "\tif (m_emulator->wants_key_events()) {\n\t\t(void)keypad_kitty;"
expect = "the_keypad_is_its_own_keys_under_the_kitty_protocol"

# A keypad digit treated as a non-text key: it stops typing under
# disambiguate.
[[sabotage]]
name = "a keypad digit is taken for a key that types nothing"
file = "src/input/input_router.cpp"
find = "\t\t\tout.keypad_text = typed;"
replace = "\t\t\tout.keypad_text = false;"
expect = "the_keypad_is_its_own_keys_under_the_kitty_protocol"

# The on-screen keyboard's keys go straight to libvterm: Enter, Tab and
# Backspace arrive as legacy bytes under report-all-keys, as they did on
# the Fold, 2026-10-07.
[[sabotage]]
name = "the on-screen keyboard's keys skip the kitty protocol"
file = "src/input/input_router.cpp"
find = "\tif (m_emulator->wants_key_events()) {\n\t\tbssh_emulator::key_event_t press;\n\t\tpress.key = key;"
replace = "\tif (false) {\n\t\tbssh_emulator::key_event_t press;\n\t\tpress.key = key;"
expect = "kitty_reaches_the_on_screen_keyboard_too"

# A Ctrl chord from the on-screen keyboard carries its letter as text.
[[sabotage]]
name = "a soft-keyboard Ctrl chord carries text"
file = "src/input/input_router.cpp"
find = "\t\t\tif (!(press.modifiers & bssh_emulator::MOD_CTRL)) press.text.append(codepoint);"
replace = "\t\t\tpress.text.append(codepoint);"
expect = "kitty_reaches_the_on_screen_keyboard_too"
