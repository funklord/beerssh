# Every setting a preset holds has a default for every host and a value of a
# host's own, and a preset is a template a host may follow (the holder,
# 2026-11-02).

# app.ini holds text: a default laid over unconverted reads "false" as true.
[[sabotage]]
name = "a stored default is laid over as text"
file = "src/model/settings_resolver.cpp"
find = "\t\tdefaults.insert(key, typed);\n\t}\n\treturn defaults;"
replace = "\t\tdefaults.insert(key, it.value());\n\t}\n\treturn defaults;"
expect = "every_setting_has_a_default_and_a_hosts_own"

[[sabotage]]
name = "a terminal default changed on the page is not stored"
file = "src/ui/app_settings_view.cpp"
find = "\t\t\t\t\tif (differing.contains(key)) s.set_default_setting(key, differing.value(key));\n"
replace = "\t\t\t\t\tif (differing.contains(key)) {}\n"
expect = "every_setting_has_a_default_and_a_hosts_own"

[[sabotage]]
name = "a default put back to the built-in value stays stored"
file = "src/ui/app_settings_view.cpp"
find = "\t\t\t\t\telse s.forget_default_setting(key);\n"
replace = ""
expect = "every_setting_has_a_default_and_a_hosts_own"

[[sabotage]]
name = "the dialog drops a host's own terminal settings"
file = "src/ui/session_dialog.cpp"
find = "\t\tprofile.overrides = bssh_terminal_overrides(m_store, profile, m_host_fields->values());\n"
replace = ""
expect = "every_setting_has_a_default_and_a_hosts_own"

[[sabotage]]
name = "a template chosen in the dialog is not kept"
file = "src/ui/session_dialog.cpp"
find = "\tm_current.preset_id = m_template->currentData().toInt();\n"
replace = ""
expect = "every_setting_has_a_default_and_a_hosts_own"

[[sabotage]]
name = "the touch editor drops a host's own terminal settings"
file = "src/ui/host_editor.cpp"
find = "\t\tedited.overrides = bssh_terminal_overrides(m_store, edited, m_host_fields->values());\n"
replace = ""
expect = "the_touch_editor_keeps_a_hosts_terminal_settings"

# Measured against the new template, the old one's values were pinned.
[[sabotage]]
name = "the touch editor measures a host's own against the new template"
file = "src/ui/host_editor.cpp"
find = "\tif (m_host_fields)\n\t\tedited.overrides = bssh_terminal_overrides("
replace = "\tif (m_template) edited.preset_id = m_template->currentData().toInt();\n\tif (m_host_fields)\n\t\tedited.overrides = bssh_terminal_overrides("
expect = "the_touch_editor_keeps_a_hosts_terminal_settings"

[[sabotage]]
name = "a retired shipped preset stays"
file = "src/model/profile_store.cpp"
find = "\t\tm_presets.removeAt(i);\n"
replace = ""
expect = "the_retired_shipped_presets_go_and_their_hosts_follow_none"

# A terminal default reaches no open terminal.
[[sabotage]]
name = "the app defaults ignore every stored default"
file = "src/model/settings_resolver.cpp"
find = "\tconst QJsonObject stored = bssh_app_settings().default_settings();\n"
replace = "\tconst QJsonObject stored;\n"
expect = "a_host_with_no_preset_uses_its_own_size_and_the_device_default"

# The Konsole scheme drawn in the shared palette, not the holder's own.
[[sabotage]]
name = "the Konsole scheme loses its own palette"
file = "src/term/colour_scheme.cpp"
find = "\t\tconst QRgb *palette = entry.ansi ? entry.ansi : BSSH_CLASSIC_ANSI;\n"
replace = "\t\tconst QRgb *palette = BSSH_CLASSIC_ANSI;\n"
expect = "a_scheme_owns_the_background_and_the_text_not_the_palette"

# Host Settings opens the blank new-connection door, not the host.
[[sabotage]]
name = "host settings open a blank destination"
file = "src/ui/main_window.cpp"
find = "\tm_session_dialog->set_current_profile(stored);\n\tshow_front_door();\n"
replace = "\tshow_front_door();\n"
expect = "host_settings_open_the_terminals_own_host"

# A shipped preset read from the file: every host following it held to the
# build that seeded presets.ini (a config records choices, not values).
[[sabotage]]
name = "a shipped preset is read from the file, not the build"
file = "src/model/profile_store.cpp"
find = "\t\t\t\tif (shipped.name == preset.name) preset = shipped;\n"
replace = ""
expect = "a_shipped_preset_follows_the_build_not_the_file"

[[sabotage]]
name = "a shipped preset's values are written into the file"
file = "src/model/profile_store.cpp"
find = "\t\tif (preset.is_builtin) {\n\t\t\tQJsonObject named;"
replace = "\t\tif (false) {\n\t\t\tQJsonObject named;"
expect = "a_shipped_preset_follows_the_build_not_the_file"

# The custom palette writes all nineteen again, pinning every slot nobody
# touched to the build's shipped colours.
[[sabotage]]
name = "the custom palette stores every colour"
file = "src/model/app_settings.cpp"
find = "\t\tif (chosen.contains(slot)) store(custom_slot_key(slot), QColor(colours[slot]).name());"
replace = "\t\tif (true) store(custom_slot_key(slot), QColor(colours[slot]).name());"
expect = "a_custom_palette_keeps_only_the_colours_chosen"

# Classic ANSI writes today's sixteen instead of following the palette.
[[sabotage]]
name = "Classic ANSI pins the sixteen"
file = "src/ui/colour_editor.cpp"
find = "\t\tm_chosen.remove(i);\n"
replace = "\t\tm_chosen.insert(i);\n"
expect = "a_custom_palette_keeps_only_the_colours_chosen"

# Choosing a default size writes the family too, pinning it.
[[sabotage]]
name = "a default size pins the family"
file = "src/ui/app_settings_view.cpp"
find = "\t\t\t\tif (family_moved) s.set_default_font_family(id);\n"
replace = "\t\t\t\ts.set_default_font_family(id);\n"
expect = "the_dialog_shows_a_hosts_own_size_and_follows_the_default"
