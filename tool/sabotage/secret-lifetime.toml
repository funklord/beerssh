# Sabotages for a stored password outliving the host it belonged to, and
# not outliving the one that came after.
#
# Secrets are keyed `profile:<id>:password`, so the id IS the key. Two
# guards stand between that and a lost credential, and they are here
# together because each was written for the other's failure.
#
# The cause: ids were minted as `highest + 1` over the hosts that
# currently exist, so deleting the highest-numbered host reissued its id
# -- and its key -- to the next host created. sec 11 records both
# directions of what that costs: a host inheriting a credential nobody
# gave it, and the sweep deleting a password its new owner had just
# saved. The counter only goes up now, and is persisted so a reopen
# cannot recompute it back into the collision.
#
# The guard behind it: the sweep still refuses to erase a key some live
# host owns. Kept after the cause was fixed because the orphan list is
# process-wide app settings while ids are minted per store DIRECTORY --
# two stores both hand out id 1 -- and because a hosts.ini written before
# the counter existed can carry ids a pending orphan names.

[[sabotage]]
name = "the sweep erases a key a reused id has given to another host"
file = "src/model/profile_store.cpp"
find = "\t\tif (live.contains(key)) continue;"
replace = "\t\tif (false && live.contains(key)) continue;"
expect = "a_sweep_does_not_erase_a_password_a_live_host_now_owns"

# Put the id back to "one past whatever exists" and a deleted host's id --
# and so its secret's key -- goes to the next host created.
[[sabotage]]
name = "a deleted host's id is reissued to the next one"
file = "src/model/profile_store.cpp"
find = "\t\tstored.id = m_next_id++;"
replace = "\t\tint highest = 0;\n\t\tfor (const bssh_profile_t &e : m_profiles) highest = qMax(highest, e.id);\n\t\tstored.id = highest + 1;"
expect = "an_id_is_never_reissued_to_another_host"

# The counter kept but not written down: every reopen recomputes it from
# the hosts present, which is the same collision one restart later.
[[sabotage]]
name = "the id counter is not persisted, so a reopen recomputes it"
file = "src/model/profile_store.cpp"
find = "\tfile.setValue(QStringLiteral(\"next_id\"), m_next_id);"
replace = "\t/* sabotage: counter not persisted */"
expect = "an_id_is_never_reissued_to_another_host"
