# Sabotage for a stored password outliving the host it belonged to, and
# not outliving the one that came after.
#
# Two mechanisms that are each correct alone. Ids are minted as
# `highest + 1` over the profiles that CURRENTLY exist, so deleting the
# highest-numbered host frees its id -- and secrets are keyed from the id.
# A deletion the locked store could not carry out writes the key down to
# be swept later (sec 11), and the sweep erased every key on its list.
#
# So: delete a host that had a password while the store is locked, create
# a new host which takes the freed id, save a password for it, unlock. The
# sweep erases the key, and the key is now the new host's.
#
# sec 11 records the mirror of this, where a reused id let a host INHERIT
# a credential nobody gave it. This is the same cause destroying the right
# host's secret instead of exposing the wrong one.
[[sabotage]]
name = "the sweep erases a key a reused id has given to another host"
file = "src/model/profile_store.cpp"
find = "\t\tif (live.contains(key)) continue;"
replace = "\t\tif (false && live.contains(key)) continue;"
expect = "a_sweep_does_not_erase_a_password_a_reused_id_now_owns"
