# Sabotages for sec 6.2's split keyboard and for the general remaps
# reaching the on-screen keyboards (sec 6.1). Each names the test that
# must notice.

# The landscape rule gone: a short wide screen keeps the keyboard under
# the terminal, which on the Fold's cover screen left it one row.
[[sabotage]]
name = "a short wide screen does not split the keyboard"
file = "keyboard/soft_keyboard_layout.cpp"
find = "\tif (width_dp > height_dp && height_dp < SK_SPLIT_KEYBOARD_MAX_HEIGHT_DP) {"
replace = "\tif (false) {"
expect = "a_short_wide_screen_gets_the_split_keyboard"

# The cut loses every right-hand key: the halves would look like a
# keyboard and be missing half of one.
[[sabotage]]
name = "the split loses the right half's keys"
file = "keyboard/soft_keyboard.cpp"
find = "\t\t\tadd_key(p.key, m_half_grids[1], 1 + r, p.column - right_origin);"
replace = "\t\t\tQ_UNUSED(p);"
expect = "the_split_keyboard_holds_every_key_once"

# The window never places the halves, so they stay inside the keyboard
# widget under the terminal -- split in name, the old height in practice.
[[sabotage]]
name = "the window leaves the halves under the terminal"
file = "src/ui/main_window.cpp"
find = "\tm_body->insertWidget(0, m_keyboard->half(0), 0);\n\tm_body->addWidget(m_keyboard->half(1), 0);"
replace = ""
expect = "the_split_keyboard_sits_beside_the_terminal"

# The halves ignore Hide: the keyboard goes away and its keys stay.
[[sabotage]]
name = "hiding the keyboard leaves the halves on screen"
file = "keyboard/soft_keyboard.cpp"
find = "\tconst bool shown = split && !isHidden();"
replace = "\tconst bool shown = split;"
expect = "the_split_keyboard_sits_beside_the_terminal"

# A handler that does not know the right half: Ctrl held on the left and
# a key on the right is two separate touches, and the chord never forms.
[[sabotage]]
name = "the right half is not part of the chord"
file = "keyboard/soft_keyboard.cpp"
find = "\tm_touch->watch(m_halves[1]);"
replace = ""
expect = "a_chord_spans_the_split_keyboards_halves"

# The remaps back to the physical keyboard only.
[[sabotage]]
name = "an on-screen named key ignores the remaps"
file = "src/input/input_router.cpp"
find = "\tif (key != bssh_emulator::KEY_NONE\n\t     && send_remap("
replace = "\tif (false\n\t     && send_remap("
expect = "a_key_remap_reaches_the_on_screen_keyboards"

[[sabotage]]
name = "an on-screen letter ignores the remaps"
file = "keyboard/soft_keyboard.cpp"
find = "\t\t\tif (m_target->claim_letter(char32_t(sent.unicode()))) {"
replace = "\t\t\tif (false) {"
expect = "a_key_remap_reaches_the_on_screen_keyboards"

# The digit row gone from the letters page: back to a page switch for
# every port number, and one page a row shorter than the others.
[[sabotage]]
name = "the letters page has no digit row"
file = "keyboard/soft_keyboard_layout.cpp"
find = "\tgroup.rows.append(digit_row());\n\tgroup.digit_row_first = true;\n\tgroup.rows.append(slot_run(\"AD\", 1, 11, 2));"
replace = "\tgroup.rows.append(slot_run(\"AD\", 1, 11, 2));"
expect = "every_compact_page_starts_with_the_digits"

# The numbers page's new row of shell characters gone.
[[sabotage]]
name = "the numbers page loses its shell characters"
file = "keyboard/soft_keyboard_layout.cpp"
find = "\tgroup.rows.append(literal_row(\"+<>{}:|%^!#\"));"
replace = "\tgroup.rows.append(literal_row(\"1234567890-\"));"
expect = "every_compact_page_starts_with_the_digits"

# The left thumb without a space bar again.
[[sabotage]]
name = "the split keyboard has one space bar"
file = "keyboard/soft_keyboard.cpp"
find = "\t\t\tif (!left_space && is_space(p.key)) {"
replace = "\t\t\tif (false && is_space(p.key)) {"
expect = "the_split_keyboard_holds_every_key_once"

# The right thumb without a Shift again.
[[sabotage]]
name = "the split keyboard has one Shift"
file = "keyboard/soft_keyboard.cpp"
find = "\t\tif (left_shift && !right_shift && !right[r].isEmpty() && right[r].last().key.span >= 4) {"
replace = "\t\tif (false) {"
expect = "the_split_keyboard_holds_every_key_once"

# A narrower second space bar: the left half spans fewer columns than the
# right, and its keys come out wider -- the width test, not the label test,
# is what sees this.
[[sabotage]]
name = "the split halves have different key widths"
file = "keyboard/soft_keyboard.cpp"
find = "\t\t\t\tleft[r].append({ p.key, end_of(left[r]) });"
replace = "\t\t\t\tsk_key_t narrow = p.key;\n\t\t\t\tnarrow.span = 1;\n\t\t\t\tleft[r].append({ narrow, end_of(left[r]) });"
expect = "the_split_keyboard_holds_every_key_once"

# The split keeps the digit row: five rows of 48dp keys do not fit the
# Fold's landscape height, and the status line and mode buttons go off the
# bottom of the screen.
[[sabotage]]
name = "the split keyboard keeps the digit row"
file = "keyboard/soft_keyboard.cpp"
find = "\tconst int skip = group.digit_row_first ? 1 : 0;"
replace = "\tconst int skip = 0;"
expect = "the_input_selector_joins_the_status_line_when_wide"
