# Sabotages for tabs, splits and windows being DIFFERENT states.
#
# Reported from use: "they become tabs. tabs, splits and windows are
# supposed to be different things and movable between those states by
# drag and drop". The tab bar was built from the window's session list
# outright, so a tiled session was listed in the bar directly above
# itself -- and a pane could not be picked up at all, so a terminal that
# had been tiled was stuck there.

# The split. A pane is not a tab.
[[sabotage]]
name = "a tiled session is listed in the tab bar as well"
file = "src/ui/layout_manager.cpp"
find = "\t/* Whatever it was, it leaves its old place first, and that space closes. */\n\ttake_out(m_tree, session);\n"
replace = "\t/* Whatever it was, it leaves its old place first, and that space closes. */\n"
expect = "a_tiled_session_leaves_the_tab_bar"

# What refresh_tab_bar() still does after a rebuild of the panes.
#
# This spec named the collapse test and was MISSED there, and was so
# before the pane corner as well (measured 2026-10-30 in a clean copy):
# a rebuild builds every bar afresh from the layout in make_pane_bar(),
# so the bars come back right without this call, and "the bar is not
# rebuilt" was never what removing it does. What it does do: bring each
# bar's labels up to date, and -- since sec 8.7a -- give the rebuilt
# panes' corners their stand-ins for hidden bars, which nothing else does
# after a rebuild. So the edit is the same and it is named, and caught,
# for that.
[[sabotage]]
name = "rebuilt panes' corners lose the hidden bars' buttons"
file = "src/ui/main_window.cpp"
find = "\t\trefresh_tab_bar();\n\n\t\t/*\n\t\t * A pane built after the setting was changed"
replace = "\t\t/*\n\t\t * A pane built after the setting was changed"
expect = "hidden_bars_are_reached_from_the_corner"

# The un-split, which is what makes a split escapable.
[[sabotage]]
name = "a pane dropped on the tab bar is shown instead of tabbed"
file = "src/ui/main_window.cpp"
find = "\tm_layout->add_tab(session, front, slot < 0 ? INT_MAX : slot);\n"
replace = "\tshow_session(session);\n"
expect = "a_pane_dropped_on_the_tab_bar_becomes_a_tab"

# A window with no pane shows nothing at all.
[[sabotage]]
name = "the last pane can be turned into a tab"
file = "src/ui/main_window.cpp"
find = "\tif (panes.size() < 2) return;\n"
replace = ""
expect = "each_pane_keeps_its_own_tabs"

# Moving a pane off the end of the arrangement. The guard refuses rather
# than wrapping, because a wrap makes "left" mean "far right" at exactly
# the moment somebody is looking at the leftmost pane -- and a wrap is
# what a hurried fix reaches for, since it makes the operation total.
#
# The replace here WRAPS, and the first version did not -- it swapped the
# range guard for a size check and left `to` out of range, so with two
# panes the edit reached QList::move(0, -1) and move(1, 2). Those are
# out-of-range rotates; QList asserts both indices and the suite builds
# with QT_NO_DEBUG, so the asserts are gone and the result is undefined
# rather than wrapped. It happened to leave the list unchanged, the test's
# QCOMPARE against `before` passed, and the sweep of 2026-09-07 reported
# this as the one MISSED of 165 -- reading as a hole in the tests when the
# tests were right and this line was wrong.
#
# A sabotage has to produce the DEFECT its name claims, not merely break
# the guard that prevents it. Modulo arithmetic is what a hurried fix
# actually reaches for, because it makes the operation total.
[[sabotage]]
name = "a pane moved off the end wraps around instead of stopping"
file = "src/ui/main_window.cpp"
find = "\tconst int to = from + (direction < 0 ? -1 : 1);\n\tif (to < 0 || to >= intent.size()) return;"
replace = "\tconst int to = (from + (direction < 0 ? -1 : 1) + intent.size()) % intent.size();"
expect = "a_pane_can_be_moved_along_the_arrangement"

# The gesture. Alt and the left button picks a pane up; a plain drag
# still selects text, which is the half that would make the app unusable.
[[sabotage]]
name = "a plain drag picks the pane up"
file = "src/ui/terminal_view.cpp"
find = "\tif (event->button() == Qt::LeftButton && (event->modifiers() & Qt::AltModifier)) {"
replace = "\tif (event->button() == Qt::LeftButton) {"
expect = "alt_drag_asks_for_the_pane_to_be_moved"

# And a click is not a drag.
[[sabotage]]
name = "an Alt+click with no movement starts a drag"
file = "src/ui/terminal_view.cpp"
find = "\t\tif ((event->pos() - m_pane_drag_from).manhattanLength()\n\t\t    < QApplication::startDragDistance()) {\n\t\t\tevent->accept();\n\t\t\treturn;\n\t\t}"
replace = "\t\t(void)0;"
expect = "alt_drag_asks_for_the_pane_to_be_moved"
