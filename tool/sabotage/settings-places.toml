# Sabotages for where the desktop dialog keeps its settings (2026-10-10,
# the holder's choices): brightness, contrast and theme on the Appearance
# page and only there, and one Presets page instead of three categories
# editing one preset. Brightness had been under "This device", reported
# as nowhere to be found; Terminal and Connection were slices of Presets,
# reported as doing almost the same thing.

[[sabotage]]
name = "This device shows the appearance a second time"
file = "src/ui/session_dialog.cpp"
find = "\t        bssh_app_settings_view::THIS_DEVICE, this);"
replace = "\t        bssh_app_settings_view::EVERYTHING, this);"
expect = "brightness_is_on_the_appearance_page"

[[sabotage]]
name = "the Appearance page has no device appearance"
file = "src/ui/session_dialog.cpp"
find = "\teverywhere->setObjectName(QStringLiteral(\"device_appearance\"));\n\teverywhere->set_heading(QStringLiteral(\"Every host on this device\"));\n\tlayout->addWidget(everywhere, 1);\n"
replace = "\teverywhere->setObjectName(QStringLiteral(\"device_appearance\"));\n\teverywhere->hide();\n"
expect = "brightness_is_on_the_appearance_page"

[[sabotage]]
name = "the everything-but mode lets the appearance through"
file = "src/ui/app_settings_view.cpp"
find = "\t                    || (m_section == THIS_DEVICE && section != SECTION_APPEARANCE\n"
replace = "\t                    || (m_section == THIS_DEVICE\n"
expect = "brightness_is_on_the_appearance_page"
