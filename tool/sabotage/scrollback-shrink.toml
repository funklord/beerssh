# Sabotage for the view following the history when it changes SIZE.
#
# scrollback_changed had no listener anywhere in the tree. Push and pop
# happen to damage the screen, so the bar stayed honest by accident --
# which is why this went unnoticed: the two paths that fire the signal
# most often did not need it.

[[sabotage]]
name = "the view never hears the history shrink"
file = "src/ui/terminal_view.cpp"
find = "\t\tm_scrollback_connection =\n\t\t        connect(m_emulator, &bssh_emulator::scrollback_changed, this, [this] {\n\t\t\t/*\n\t\t\t * The same three things this used to do, plus the two\n\t\t\t * it did not: the content revision and the reader's\n\t\t\t * event. A trim changes what the terminal HAS, which\n\t\t\t * is a content change whether or not a cell was\n\t\t\t * damaged.\n\t\t\t */\n\t\t\tnote_content_changed();\n\t\t});"
expect = "shrinking_the_scrollback_brings_the_view_back_with_it"
