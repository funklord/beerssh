# A keyframe in place of a replay (project.md sec 5.6): a client whose place
# went past the server's log is sent the lines it missed, then the screen as
# it is now, and stands past both. Each edit below was seen to fail its test
# 2026-11-17.

# The host never gives one, and replays from the oldest byte it holds.
[[sabotage]]
name = "the host replays rather than sending a keyframe"
file = "src/session/session_host.c"
find = "\tif (!host->keyframes || !host->screen) return 0;\n"
replace = "\treturn 0;\n"
expect = "a_client_that_takes_keyframes_is_sent_the_screen_and_the_lines_it_missed"

# A line marked where its output began rather than where the line ended, so
# a client part-way along a line is taken to hold what its newline pushes.
[[sabotage]]
name = "a history line is marked too early"
file = "src/session/screen_model.c"
find = "\t\tmodel->pushing_at = model->fed + piece;\n"
replace = "\t\tmodel->pushing_at = model->fed;\n"
expect = "the_servers_history_says_which_lines_a_client_lacks"

# Lines gone past the limit before the first sent, and nobody told.
[[sabotage]]
name = "the host never says earlier lines went"
file = "src/session/session_host.c"
find = "\thost->history_lost = !bssh_screen_model_history_after("
replace = "\thost->history_lost = 0 && !bssh_screen_model_history_after("
expect = "a_client_that_takes_keyframes_is_sent_the_screen_and_the_lines_it_missed"

# The far half of a wide character sent as a cell of its own.
[[sabotage]]
name = "a history line carries the far half of a wide character"
file = "src/session/wire.c"
find = "static int far_half(const bssh_screen_cell_t *cell) {\n\treturn cell->chars[0] == 0xFFFFFFFFu;\n"
replace = "static int far_half(const bssh_screen_cell_t *cell) {\n\treturn 0 && cell->chars[0] == 0xFFFFFFFFu;\n"
expect = "a_history_line_round_trips_with_its_styles"

# A line sent twice lands twice in the scrollback.
[[sabotage]]
name = "the client takes a history line twice"
file = "src/session/session_client.c"
find = "\tif (number < client->history_next) return 0;\n"
replace = "\t;\n"
expect = "the_client_takes_history_in_order_and_says_what_went"

# The place moves with the first part of a repaint, so a link lost part-way
# leaves a half-drawn screen standing for bytes it never drew.
[[sabotage]]
name = "the client moves its place before the repaint is whole"
file = "src/session/session_client.c"
find = "\tif (last && offset > client->next) {\n"
replace = "\tif (offset > client->next) {\n"
expect = "the_client_takes_history_in_order_and_says_what_went"

# The session never asks, and a gap is a replay again.
[[sabotage]]
name = "the session does not ask for keyframes"
file = "src/model/session.cpp"
find = "\t                             int(bssh_session_client_put_keyframes(frame, sizeof(frame)))));\n"
replace = "\t                             0));\n"
expect = "a_kept_session_puts_the_lines_it_missed_into_its_scrollback"

# History lines converted without their colours.
[[sabotage]]
name = "a history line loses its colours on the client"
file = "src/term/emulator_vterm.cpp"
find = "\t\tif (from.fg.kind == BSSH_SCREEN_COLOR_INDEXED) vterm_color_indexed(&source.fg, from.fg.index);\n"
replace = "\t\tif (0) vterm_color_indexed(&source.fg, from.fg.index);\n"
expect = "a_kept_session_puts_the_lines_it_missed_into_its_scrollback"

# A malformed line half-applied rather than refused whole.
[[sabotage]]
name = "the client takes a malformed history line"
file = "src/session/session_client.c"
find = "\tif (step < 0) return -1;\n"
replace = "\t;\n"
expect = "a_malformed_history_line_is_refused"

# Live's latest first for a backlog the log still holds
# (a_live_client_far_behind_is_sent_the_screen_not_every_byte).
[[sabotage]]
name = "a large Live backlog is replayed byte by byte"
file = "src/session/session_host.c"
find = "\t\t    && host->log.end - host->sent > KEYFRAME_BACKLOG)\n"
replace = "\t\t    && 0)\n"
expect = "a_live_client_far_behind_is_sent_the_screen_not_every_byte"

[[sabotage]]
name = "a Serial client is sent a keyframe and loses states"
file = "src/session/session_host.c"
find = "\t\tif (!host->restarted_due && !host->log.faithful && host->sent >= host->log.start\n"
replace = "\t\tif (!host->restarted_due && host->sent >= host->log.start\n"
expect = "a_live_client_far_behind_is_sent_the_screen_not_every_byte"

[[sabotage]]
name = "a backlog of a few lines is keyframed too"
file = "src/session/session_host.c"
find = "\t\t    && host->log.end - host->sent > KEYFRAME_BACKLOG)\n"
replace = "\t\t    && host->log.end - host->sent > 0)\n"
expect = "a_live_client_far_behind_is_sent_the_screen_not_every_byte"

# The mode after the attach, so a split read lets the last one decide.
[[sabotage]]
name = "the session says its mode after the attach"
file = "src/model/session.cpp"
find = "\tsend_output_mode();\n\tm_transport->send(QByteArray(reinterpret_cast<const char *>(frame),\n\t                             int(bssh_wire_put_attach(frame, sizeof(frame), m_resume_client->next,\n\t                                                      uint16_t(m_cols), uint16_t(m_rows)))));\n"
replace = "\tm_transport->send(QByteArray(reinterpret_cast<const char *>(frame),\n\t                             int(bssh_wire_put_attach(frame, sizeof(frame), m_resume_client->next,\n\t                                                      uint16_t(m_cols), uint16_t(m_rows)))));\n\tsend_output_mode();\n"
expect = "a_kept_session_puts_the_lines_it_missed_into_its_scrollback"

# A terminal resized while its link was down, then given a keyframe
# (a_resize_while_away_does_not_bring_lines_back_twice).
[[sabotage]]
name = "the history a resize while away changed is not put back"
file = "src/model/session.cpp"
find = "\t\t\tif (!session->m_away_history_kept) return;\n"
replace = "\t\t\treturn;\n"
expect = "a_resize_while_away_does_not_bring_lines_back_twice"

[[sabotage]]
name = "the history is not kept at a resize while away"
file = "src/model/session.cpp"
find = "\tm_away_history = m_emulator->scrollback();\n\tm_away_history_kept = true;\n"
replace = "\tm_away_history = m_emulator->scrollback();\n"
expect = "a_resize_while_away_does_not_bring_lines_back_twice"

[[sabotage]]
name = "lines a resize pushes are taken as already seen"
file = "src/session/screen_model.c"
find = "\tmodel->pushing_at = model->fed + 1;\n"
replace = "\tmodel->pushing_at = model->fed;\n"
expect = "a_resize_while_away_does_not_bring_lines_back_twice"

# Latest first, and a keyframe cut short and sent again.
[[sabotage]]
name = "the screen is drawn after the history"
file = "src/session/session_host.c"
find = "\t                                       host->repaint_lines, 1, NULL, 0, &taken);\n"
replace = "\t                                       host->repaint_lines, 1, host->repaint, host->repaint_len, &taken);\n"
expect = "a_client_that_takes_keyframes_is_sent_the_screen_and_the_lines_it_missed"

[[sabotage]]
name = "a keyframe sent again takes its lines twice"
file = "src/session/session_client.c"
find = "\tif (!again || from > client->history_next) client->history_next = from;\n"
replace = "\tclient->history_next = from;\n"
expect = "the_client_takes_history_in_order_and_says_what_went"

# A host's line wider than the terminal, pushed as one row.
[[sabotage]]
name = "a history line wider than the terminal is pushed whole"
file = "src/term/emulator_vterm.cpp"
find = "\t\tint end = cols > 0 ? qMin(at + cols, int(line.size())) : int(line.size());\n"
replace = "\t\tint end = int(line.size());\n"
expect = "a_history_line_wider_than_the_terminal_is_wrapped_to_it"

[[sabotage]]
name = "a wide glyph at the edge is cut in half"
file = "src/term/emulator_vterm.cpp"
find = "\t\tif (end < line.size() && end - at > 1 && line.at(end - 1).width == 2) --end;\n"
replace = "\t\t;\n"
expect = "a_history_line_wider_than_the_terminal_is_wrapped_to_it"

# A replayed backlog asking questions and ringing bells
# (a_backlog_is_drawn_but_not_answered).
[[sabotage]]
name = "a backlog's questions are answered into the live program"
file = "src/term/emulator_vterm.cpp"
find = "\tif (self->replaying()) return;\n\tself->pending_output.append(bytes, static_cast<int>(len));\n"
replace = "\tself->pending_output.append(bytes, static_cast<int>(len));\n"
expect = "a_backlog_is_drawn_but_not_answered"

[[sabotage]]
name = "a backlog's bell rings"
file = "src/term/emulator_vterm.cpp"
find = "\tif (!self->replaying()) emit self->owner->bell();\n"
replace = "\temit self->owner->bell();\n"
expect = "a_backlog_is_drawn_but_not_answered"

[[sabotage]]
name = "the session never quiets a backlog"
file = "src/model/session.cpp"
find = "\tm_resume_backlog = true;\n"
replace = "\tm_resume_backlog = false;\n"
expect = "a_backlog_is_drawn_but_not_answered"

[[sabotage]]
name = "every answer made while feeding is dropped, backlog or not"
file = "src/term/emulator_vterm.cpp"
find = "\tbool replaying() const { return quiet && in_feed; }"
replace = "\tbool replaying() const { return quiet || in_feed; }"
expect = "a_backlog_is_drawn_but_not_answered"

[[sabotage]]
name = "a backlog's questions this terminal answers itself are answered"
file = "src/term/emulator_vterm.cpp"
find = "\tif (replaying()) return;\n\tpending_output.append(bytes);\n"
replace = "\tpending_output.append(bytes);\n"
expect = "a_backlog_is_drawn_but_not_answered"

# The server answering what nobody watches, and only that
# (a_question_nobody_watches_is_answered_by_the_server).
[[sabotage]]
name = "the server never answers a question"
file = "src/session/session_host.c"
find = "\t\tbssh_screen_model_set_answering(host->screen, !watched);\n"
replace = "\t\tbssh_screen_model_set_answering(host->screen, 0);\n"
expect = "a_question_nobody_watches_is_answered_by_the_server"

[[sabotage]]
name = "the server answers what a live client answers too"
file = "src/session/session_host.c"
find = "\t\tbssh_screen_model_set_answering(host->screen, !watched);\n"
replace = "\t\tbssh_screen_model_set_answering(host->screen, 1);\n"
expect = "a_question_nobody_watches_is_answered_by_the_server"
