# The session host and its frames (project.md sec 5.6).

# A dropped client taking the program with it is the fault all this exists
# to end.
[[sabotage]]
name = "losing the client ends the program"
file = "src/session/session_host.c"
find = "\tif (host->client >= 0) close(host->client);\n"
replace = "\tif (host->client >= 0) { close(host->client); kill(host->child, SIGKILL); }\n"
expect = "a_shell_survives_losing_its_client"

# Output only while attached: the bytes that matter most are lost.
[[sabotage]]
name = "nothing is read while detached"
file = "src/session/session_host.c"
find = "\t\t\tif (log_room(host)) fds[count].events |= POLLIN;\n"
replace = "\t\t\tif (log_room(host) && host->attached) fds[count].events |= POLLIN;\n"
expect = "a_client_too_far_behind_is_told_what_was_lost"

# Skipping quietly: the client draws no gap and joins the text either side.
[[sabotage]]
name = "the client is not told what was lost"
file = "src/session/session_host.c"
find = "\t\thost->out_used = bssh_wire_put_offset(host->out, sizeof(host->out), BSSH_WIRE_LOST,\n\t\t                                      host->log.start);\n"
replace = ""
expect = "a_client_too_far_behind_is_told_what_was_lost"

# The pause: reading on with no room is Live under another name.
[[sabotage]]
name = "a faithful mode does not pause the program"
file = "src/session/session_host.c"
find = "\tif (!host->log.faithful) return CHUNK;\n"
replace = "\treturn CHUNK;\n"
expect = "a_faithful_mode_pauses_the_program_and_loses_nothing"

[[sabotage]]
name = "the mode is ignored"
file = "src/session/session_host.c"
find = "\t\tbssh_output_log_set_faithful(&host->log, mode != BSSH_WIRE_MODE_LIVE);\n"
replace = ""
expect = "a_faithful_mode_pauses_the_program_and_loses_nothing"

[[sabotage]]
name = "an ack is ignored"
file = "src/session/session_host.c"
find = "\t\tif (bssh_wire_read_offset(frame, &offset)) return -1;\n\t\tbssh_output_log_ack(&host->log, offset);\n"
replace = "\t\tif (bssh_wire_read_offset(frame, &offset)) return -1;\n"
expect = "a_faithful_mode_pauses_the_program_and_loses_nothing"

# Two clients at once: the old one holds the session for nobody.
[[sabotage]]
name = "a second client leaves the first attached"
file = "src/session/session_host.c"
find = "\tdrop_client(host);\n\thost->client = fd;\n"
replace = "\thost->client = fd;\n"
expect = "a_second_client_replaces_the_first"

[[sabotage]]
name = "the exit is not reported"
file = "src/session/session_host.c"
find = "\t\thost->out_used = bssh_wire_put_exited(host->out, sizeof(host->out), host->status);\n"
replace = ""
expect = "a_program_ending_is_reported_and_ends_the_host"

# A host nobody returns to must not stay for ever.
[[sabotage]]
name = "the linger never ends"
file = "src/session/session_host.c"
find = "\t\tif (linger_until && now_ms() >= linger_until) break;\n"
replace = ""
expect = "nobody_coming_back_ends_the_host_after_the_linger"

# A stale socket file reads as a session still there.
[[sabotage]]
name = "the socket outlives the host"
file = "src/session/session_host.c"
find = "\tclose(host->listener);\n\tunlink(options->socket_path);\n\n\tif (host->pty >= 0)"
replace = "\tclose(host->listener);\n\n\tif (host->pty >= 0)"
expect = "a_program_ending_is_reported_and_ends_the_host"

# A malformed body read as zeroes rather than refused.
[[sabotage]]
name = "a bad attach is taken anyway"
file = "src/session/session_host.c"
find = "\t\tif (bssh_wire_read_attach(frame, &offset, &columns, &rows)) return -1;\n"
replace = "\t\t(void)bssh_wire_read_attach(frame, &offset, &columns, &rows);\n"
expect = "garbage_loses_the_client_and_not_the_session"

# Garbage that looks unfinished: the reader waits on the peer for ever.
[[sabotage]]
name = "an endless length reads as unfinished"
file = "src/session/wire.c"
find = "\tif (have > 3 && (data[1] & data[2] & data[3] & 0x80)) return -1;\n"
replace = ""
expect = "a_length_past_the_limit_is_refused_at_once"

[[sabotage]]
name = "a frame past the limit is awaited"
file = "src/session/wire.c"
find = "\t\treturn need > BSSH_WIRE_FRAME_MAX ? -1 : 0;\n"
replace = "\t\treturn 0;\n"
expect = "a_length_past_the_limit_is_refused_at_once"

[[sabotage]]
name = "the writer takes a body past the limit"
file = "src/session/wire.c"
find = "\tif (len > BSSH_WIRE_BODY_MAX || capacity < 1) return 0;\n"
replace = "\tif (capacity < 1) return 0;\n"
expect = "a_length_past_the_limit_is_refused_at_once"

[[sabotage]]
name = "a second spelling of an output offset is taken"
file = "src/session/wire.c"
find = "\tif (!used || used != situ_varint_len(raw)) return -1;\n"
replace = "\tif (!used) return -1;\n"
expect = "a_varint_with_a_second_spelling_is_refused"

# Bytes either side of a hole, fed as one stream.
[[sabotage]]
name = "the client joins text across a gap"
file = "src/session/session_client.c"
find = "\t\tclient->events.gap(client->events.context, offset - client->next);\n\t\tclient->next = offset;\n\t} else if (offset < client->next) {"
replace = "\t\tclient->next = offset;\n\t} else if (offset < client->next) {"
expect = "the_client_never_joins_text_across_a_gap"

[[sabotage]]
name = "a lost frame is ignored"
file = "src/session/session_client.c"
find = "if (frame.kind == BSSH_WIRE_LOST) status = take_lost(client, &frame);"
replace = "if (frame.kind == BSSH_WIRE_LOST) status = 0;"
expect = "the_client_is_told_what_a_lost_frame_took"

# A resend drawn twice.
[[sabotage]]
name = "what was seen is drawn again"
file = "src/session/session_client.c"
find = "\t\tif (seen >= len) return 0;\n\t\tbytes += seen;\n\t\tlen -= (uint32_t)seen;\n"
replace = "\t\t(void)seen;\n"
expect = "the_client_drops_what_it_has_already_seen"

# A half frame carried over parses the new link's first bytes as its tail.
[[sabotage]]
name = "a new link keeps the old half frame"
file = "src/session/session_client.c"
find = "\tclient->in_used = 0;\n"
replace = "\t(void)client;\n"
expect = "the_client_keeps_its_place_across_a_new_link"

[[sabotage]]
name = "acknowledgements come every time"
file = "src/session/session_client.c"
find = "\tif (client->next - client->acked < every) return 0;\n"
replace = ""
expect = "the_client_acknowledges_when_due_and_not_before"

# Bytes past the first frame in one read, left behind.
[[sabotage]]
name = "only the first frame of a read is taken"
file = "src/session/session_client.c"
find = "\t\tat += used;\n\t}\n"
replace = "\t\tat += used;\n\t\tbreak;\n\t}\n"
expect = "the_client_delivers_output_split_anywhere"

# Without the hello a banner reads as a frame still arriving: the client waits
# on a host that will never speak this protocol.
[[sabotage]]
name = "a peer speaking something else is read anyway"
file = "src/session/session_client.c"
find = "\tif (memcmp(client->in, hello, have) != 0) return -1;\n"
replace = ""
expect = "the_client_refuses_a_peer_not_speaking_the_protocol"

[[sabotage]]
name = "a new link need not say hello"
file = "src/session/session_client.c"
find = "\tclient->said_hello = 0;\n"
replace = ""
expect = "the_client_refuses_a_peer_not_speaking_the_protocol"

[[sabotage]]
name = "the host says no hello"
file = "src/session/session_host.c"
find = "\thost->hello_due = 1;\n"
replace = ""
expect = "a_client_and_a_real_host_agree_from_the_first_byte"

# A client that types and goes: what reached the host was typed by somebody.
[[sabotage]]
name = "input from a client that left is thrown away"
file = "src/session/session_host.c"
find = "\t\t\tdrain_and_drop(host);\n"
replace = "\t\t\tdrop_client(host);\n"
expect = "output_written_while_detached_arrives_on_return"

# Asked of every host: a round trip and a failed exec on each connection, for
# a program few have.
[[sabotage]]
name = "every host is probed"
file = "src/model/session.cpp"
find = "\treturn m_profile.resume_session && !m_profile.local && m_profile.command.isEmpty()\n"
replace = "\treturn !m_profile.local && m_profile.command.isEmpty()\n"
expect = "a_host_not_asked_is_not_probed"

# The probe can delay a shell and must never prevent one.
[[sabotage]]
name = "no program means no shell"
file = "src/model/session.cpp"
find = "\t\tm_resume = RESUME_NONE;\n\t\topen_remote_shell();\n\t\treturn;\n"
replace = "\t\tm_resume = RESUME_NONE;\n\t\treturn;\n"
expect = "a_host_without_the_program_gets_a_plain_shell"

# A pty rewrites what crosses it, and a frame stops being a frame.
[[sabotage]]
name = "a kept session asks for a pty"
file = "src/model/session.cpp"
find = "\tm_transport->set_raw_channel(true);\n"
replace = ""
expect = "a_host_with_the_program_gets_a_kept_session"

# Typing that goes as bytes reads as garbage at the host, and loses the client.
[[sabotage]]
name = "input is not framed"
file = "src/model/session.cpp"
find = "\tif (m_resume != RESUME_ACTIVE) {\n\t\tm_transport->send(bytes);\n\t\treturn;\n\t}\n"
replace = "\tm_transport->send(bytes);\n\treturn;\n"
expect = "a_host_with_the_program_gets_a_kept_session"

[[sabotage]]
name = "a resize is not framed"
file = "src/model/session.cpp"
find = "\tif (m_resume == RESUME_ACTIVE) {\n\t\tuint8_t frame[16];\n\t\tm_transport->send(QByteArray(reinterpret_cast<const char *>(frame),\n\t\t                             int(bssh_wire_put_resize("
replace = "\tif (false) {\n\t\tuint8_t frame[16];\n\t\tm_transport->send(QByteArray(reinterpret_cast<const char *>(frame),\n\t\t                             int(bssh_wire_put_resize("
expect = "a_host_with_the_program_gets_a_kept_session"

# The same shell, still inside its editor, with its modes wiped.
[[sabotage]]
name = "a reconnect resets a kept session's modes"
file = "src/model/session.cpp"
find = "\tif (m_emulator && m_resume != RESUME_ACTIVE) m_emulator->reset_modes();\n"
replace = "\tif (m_emulator) m_emulator->reset_modes();\n"
expect = "a_reconnect_returns_to_the_same_place_with_modes_kept"

# A place in the stream lost: everything sent again, or a shell of its own.
[[sabotage]]
name = "a reconnect starts a new session name"
file = "src/model/session.cpp"
find = "\tif (m_resume_name.isEmpty())\n\t\tm_resume_name ="
replace = "\tm_resume_name ="
expect = "a_reconnect_returns_to_the_same_place_with_modes_kept"

[[sabotage]]
name = "a banner leaves the channel raw"
file = "src/model/session.cpp"
find = "\t\tm_transport->set_raw_channel(false);\n"
replace = ""
expect = "a_banner_ahead_of_the_program_falls_back_on_the_same_connection"

[[sabotage]]
name = "a banner is tried again next connection"
file = "src/model/session.cpp"
find = "\t\tm_resume = RESUME_REFUSED;\n"
replace = "\t\tm_resume = RESUME_NONE;\n"
expect = "a_banner_ahead_of_the_program_falls_back_on_the_same_connection"

# Every closed tab leaving a shell on the server, for ever.
[[sabotage]]
name = "closing does not hang up"
file = "src/model/session.cpp"
find = "\tif (m_resume == RESUME_ACTIVE && m_transport) {\n\t\tuint8_t frame[4];\n"
replace = "\tif (false) {\n\t\tuint8_t frame[4];\n"
expect = "closing_a_kept_session_hangs_it_up"

[[sabotage]]
name = "a hangup does not end the program"
file = "src/session/session_host.c"
find = "\t\tif (host->pty >= 0) kill(host->child, SIGHUP);\n"
replace = ""
expect = "a_hangup_ends_the_program_and_the_host"

# Clamped quietly: what a new shell writes is taken for what was already seen.
[[sabotage]]
name = "a new session is not said to be new"
file = "src/session/session_host.c"
find = "\t\thost->restarted_due = offset > host->log.end;\n"
replace = "\t\thost->restarted_due = 0;\n\t\tif (offset > host->log.end) offset = host->log.end;\n"
expect = "a_client_asking_past_the_end_is_told_it_is_a_new_session"

[[sabotage]]
name = "a new session keeps the old place"
file = "src/session/session_client.c"
find = "\tclient->next = offset;\n\tclient->acked = offset;\n"
replace = ""
expect = "a_client_asking_past_the_end_is_told_it_is_a_new_session"

# Modes of a shell that has gone, on the new one.
[[sabotage]]
name = "a new shell is not said on screen"
file = "src/model/session.cpp"
find = "\t\t\tsession->m_emulator->feed(QByteArrayLiteral(\"\\r\\n[a new shell: the old one has gone]\\r\\n\"));\n"
replace = ""
expect = "a_new_shell_after_a_reboot_is_shown_and_said"
