# Sabotage for a wide glyph at the edge of a reflow (vterm-patch/0012)
# and for cells nothing wrote (bssh_cell_t::UNWRITTEN), project.md sec
# 9.5c. Anchors in the vendored library are lines 0012 adds, so a
# pristine checkout can check them.

# Cut every new_cols cells again: the glyph's halves on two rows.
[[sabotage]]
name = "a wide glyph is cut at the new edge"
file = "vterm/src/screen.c"
find = "      buffer[cells[offset + take]].chars[0] == (uint32_t)-1)\n    take--;"
replace = "      0)\n    take--;"
expect = "a_wide_glyph_at_the_edge_moves_whole_and_joins_back_without_a_gap"

# The gap a wrapped wide glyph left counted as text: a space on joining.
[[sabotage]]
name = "the screen's reflow joins the gap before a wide glyph"
file = "vterm/src/screen.c"
find = "          old_buffer[(row + 1) * old_cols + 1].chars[0] == (uint32_t)-1)\n        n--;"
replace = "          0)\n        n--;"
expect = "a_wide_glyph_at_the_edge_moves_whole_and_joins_back_without_a_gap"

# The same gap, joined by the history's rewrap.
[[sabotage]]
name = "the history's rewrap joins the gap before a wide glyph"
file = "src/term/scrollback.cpp"
find = "\t\t\t\tjoined.removeLast();\n\t\t\tjoined += piece;\n"
replace = "\t\t\tjoined += piece;\n"
expect = "a_wide_glyph_at_the_edge_moves_whole_and_joins_back_without_a_gap"

# A cell nothing wrote recorded as a typed space.
[[sabotage]]
name = "unwritten cells are not marked"
file = "src/term/emulator_vterm.cpp"
find = "\tif (!source.chars[0]) cell.attrs |= bssh_cell_t::UNWRITTEN;\n"
replace = ""
expect = "a_wide_glyph_at_the_edge_moves_whole_and_joins_back_without_a_gap"

# A line handed back padded with spaces: blank rows when narrowed.
[[sabotage]]
name = "a line pulled back is padded with typed spaces"
file = "src/term/emulator_vterm.cpp"
find = "\t\tif (col >= line.size() || (source.attrs & bssh_cell_t::UNWRITTEN))\n"
replace = "\t\tif (false)\n"
expect = "a_line_pulled_back_by_a_grow_narrows_without_blank_rows"

# Copied, the gap a wrapped wide glyph left comes back as a space.
[[sabotage]]
name = "copying keeps the gap before a wrapped wide glyph"
file = "src/ui/terminal_view.cpp"
find = "\t\t\ttext.chop(unwritten_tail);\n"
replace = ""
expect = "copying_a_wide_glyph_wrapped_at_the_edge_adds_no_space"

# Past a history row's stored end, a blank that reads as typed.
[[sabotage]]
name = "a history row's missing cells read as typed spaces"
file = "src/ui/terminal_view.cpp"
find = "\t\tcell.attrs = bssh_cell_t::UNWRITTEN;\n\t\treturn cell;\n"
replace = "\t\treturn cell;\n"
expect = "copying_a_wide_glyph_wrapped_at_the_edge_adds_no_space"
