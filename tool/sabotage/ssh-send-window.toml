# Sabotage for the one write loop of three that did not bound its wait.
#
# NOTE: expect names a LIVE test. live_ssh_test QSKIPs without a server,
# so under the default `make test` this entry reports MISSED -- which is
# the runner saying the covering test did not RUN, not that none exists.
#
# The runner can prove it now, and this is the command:
#
#   BSSH_SABOTAGE_SUITE="make check-ssh" tool/sabotage.py \
#           tool/sabotage/ssh-send-window.toml
#
# Run 2026-09-07: baseline 29 passing, and the edit CAUGHT with exactly
# one failure -- a_send_to_a_remote_that_is_not_reading_still_lets_go and
# nothing else. The tree came back byte-identical and the journal empty.
#
# The suite command has to BUILD as well as run, or the edit is never
# compiled in and the verdict describes the previous binary. `make
# check-ssh` does, through its $(TEST_BIN) prerequisite; a bare
# ./tool/check-ssh.sh does not.
#
# It had been unprovable for longer than the note above admitted, and not
# for the reason that note gave. `make check-ssh` could not run AT ALL
# between 2026-08-25 and 2026-09-07: the singular-directory pass rewrote
# `build-tests` to `build-test` in the script while the Makefile that
# creates the directory kept the plural, so it answered "is not built,
# run make test" to everyone who had just done that. Neither that check
# nor check-keepalive runs under `make test` or check-ci, so nothing
# said so for thirteen days.
#
# The session is blocking and is never set otherwise, and no
# SSH_OPTIONS_TIMEOUT is set anywhere in the tree, so ssh_channel_write
# waits on the channel window for ever. The comment that used to stand in
# do_send read "blocking" as a guarantee of progress -- true of a partial
# write, silent about the wait.
#
# What it costs is the whole worker: drain() stops, so output ceases, and
# do_disconnect never runs, so Disconnect does nothing and the facade's
# destructor waits on that loop.
[[sabotage]]
# MISSED under `make test`, because the test that covers it is a LIVE
# one. a_send_to_a_remote_that_is_not_reading_still_lets_go lives in
# live_ssh_test and needs a real server, so this edit can only be proved
# under the live suite. A MISSED verdict here is the runner reporting
# that the covering test did not run, not that none exists.
name = "do_send asks for more than the channel window and blocks the worker"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\tif (window == 0) return;\n\n\t\tconst int take = int(qMin<qsizetype>(m_pending.size(), qsizetype(window)));"
replace = "\t\tif (false && window == 0) return;\n\n\t\tconst int take = int(m_pending.size());"
expect = "a_send_to_a_remote_that_is_not_reading_still_lets_go"
