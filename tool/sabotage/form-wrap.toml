# A form's labels stacking above its fields because the page is NARROW,
# and not because a finger is doing the pointing (project.md sec 8.7).
#
# Both editors asked is_touch_primary() until 2026-09-11, which answers a
# question about the input device while the layout is asking one about the
# room: an unfolded Galaxy Z Fold is touch and 840dp wide, so it got a
# layout measured for 320dp stretched across the screen. Nothing about
# that is an error -- the form lays out, every field is reachable, and the
# only symptom is a picture -- which is why it needs a guard rather than a
# crash to find it.

# The width thrown away, so the answer is a constant.
#
# `true` rather than `false` because that is what the old code returned on
# the device the fault was found on: touch, therefore stacked, at every
# width. It is also the direction only this test can catch -- see below.
#
# Seen to fail 2026-09-11, against a 549-passing baseline: `caught: 1
# failed`, and the verdict is `caught` rather than `WRONG TEST`, so the
# one that failed is the test named here.
[[sabotage]]
name = "the form stacks at every width, as keying off touch did on a Fold"
file = "src/ui/form_wrap.cpp"
find = "\treturn bssh_layout_manager::size_class_for(width_dp)\n\t        == bssh_layout_manager::COMPACT;"
replace = "\t(void) width_dp;\n\treturn true;"
expect = "a_form_stacks_on_width_not_on_touch"

# THE OTHER DIRECTION IS NOT A SECOND ENTRY, and this says so rather than
# shipping one that reports WRONG TEST.
#
# A `return false` is the old code on a desktop: two columns at every
# width, including a phone's. That is already held, and held better, by
# check_free_form_fields_own_their_row -- which asserts the GEOMETRY at
# 320dp, label and field sharing a left edge, rather than the policy. It
# was written in 4dfc76b for the fault it caught then, and it runs from
# two callers before this spec's test is reached, so a sabotage of that
# direction would be caught by a check that is not the one under test.
#
# What is left for the test named above is the wide arm, where the
# geometry check has nothing to say because it only ever looks at a phone.
