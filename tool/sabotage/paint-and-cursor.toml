# Sabotages for which rows a change repaints, and the cursor's blink
# (src/ui/terminal_view.cpp, src/term/emulator_vterm.cpp, project.md
# sec 9.5a). Each one is a way the partial repaint could go wrong without
# anything looking broken in a screenshot taken after the fact.

# Every change repaints the whole view again: correct, and the cost the
# change exists to remove.
[[sabotage]]
name = "every change repaints the whole view"
file = "src/ui/terminal_view.cpp"
find = "\tupdate(0, BSSH_GRID_INSET_PX + first * m_cell_height,\n\t       width(), (last - first + 1) * m_cell_height);\n"
replace = "\tupdate();\n"
expect = "a_keystroke_repaints_only_its_row"

# The cursor's move names only the row it reaches: the old cursor stays
# drawn on the row it left.
[[sabotage]]
name = "a cursor move does not name the row it left"
file = "src/term/emulator_vterm.cpp"
find = "\tself->notify_damaged(qMin(pos.row, oldpos.row), qMax(pos.row, oldpos.row));\n"
replace = "\tself->notify_damaged(pos.row, pos.row);\n"
expect = "damage_names_the_rows_it_touched"

# Rows held during synchronised output forgotten: the frame is released
# naming only what came after.
[[sabotage]]
name = "synchronised output forgets the rows it held"
file = "src/term/emulator_vterm.cpp"
find = "\tdamaged_first = qMin(damaged_first, first_row);\n\tdamaged_last = qMax(damaged_last, last_row);\n\n\tif (sync_output) {\n"
replace = "\tif (sync_output) {\n"
expect = "damage_names_the_rows_it_touched"

# A change that is not a run of rows announced without any: a view
# listening for rows never repaints after a reset.
[[sabotage]]
name = "a reset names no rows"
file = "src/term/emulator_vterm.cpp"
find = "\tm_private->graphics = bssh_graphics_transmission_t();\n\n\tm_private->notify_damaged();\n"
replace = "\tm_private->graphics = bssh_graphics_transmission_t();\n\n\temit damaged();\n"
expect = "damage_names_the_rows_it_touched"

# Scrolled back, the screen's rows repainted where the screen has them:
# a band of history that never changed is redrawn and the row that did
# is not.
[[sabotage]]
name = "scrolled back, a change repaints the screen's rows"
file = "src/ui/terminal_view.cpp"
find = "\tif (!m_screen || m_scroll_offset != 0 || m_cell_height <= 0) {\n"
replace = "\tif (!m_screen || m_cell_height <= 0) {\n"
expect = "a_keystroke_repaints_only_its_row"
[[sabotage]]
name = "typing does not bring the cursor back"
file = "src/ui/terminal_view.cpp"
find = "\t\tscroll_to_live();\n\t\thold_cursor_on();\n"
replace = "\t\tscroll_to_live();\n"
expect = "typing_and_output_bring_the_cursor_back_on"

[[sabotage]]
name = "output does not bring the cursor back"
file = "src/ui/terminal_view.cpp"
find = "\tnote_content_changed();\n\thold_cursor_on();\n"
replace = "\tnote_content_changed();\n"
expect = "typing_and_output_bring_the_cursor_back_on"
