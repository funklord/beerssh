# Sabotages for sec 11's startup without a keyring: the store is named when
# the settings page is first shown, never while the window is built. The
# bound on the probe itself is witnessed by `make check-startup`, which a
# unit test cannot stand in for: without a display, autolaunch fails at
# once with or without the bound.

# The store named at build time again: building the main window asks for
# it, which probes for a keyring -- 27 seconds where none answers.
[[sabotage]]
name = "the settings page names the store while it is being built"
file = "src/ui/app_settings_view.cpp"
find = "\tif (on_this_page(SECTION_PASSWORDS, m_store_detail)) form->addRow(m_store_detail);\n"
replace = "\tif (on_this_page(SECTION_PASSWORDS, m_store_detail)) form->addRow(m_store_detail);\n\tfill_store_notes();\n"
expect = "building_the_window_does_not_ask_for_the_store"

# Never filled: the page shows two empty rows where the store's name and
# what it means should be.
[[sabotage]]
name = "showing the settings page never names the store"
file = "src/ui/app_settings_view.cpp"
find = "\tQWidget::showEvent(event);\n\tfill_store_notes();"
replace = "\tQWidget::showEvent(event);"
expect = "the_settings_page_names_the_secret_backend"
