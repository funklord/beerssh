# Sabotages for sec 6.2's built-in keyboard and its three-state modifiers.
#
# Each names the test that must notice. A sabotage caught by some OTHER
# test is reported as "WRONG TEST" rather than as a pass.

# Two on-screen keyboards at once. Both carry the same modifiers over the
# same router, so this is not merely crowded: it is two Ctrl buttons giving
# two answers to what is armed, on a screen that had room for one keyboard.
[[sabotage]]
name = "the built-in keyboard joins the key row instead of replacing it"
file = "src/ui/main_window.cpp"
find = '''
	m_keyboard->setVisible(built_in && !m_keyboard_hidden_by_user);
	if (built_in) m_key_row->hide();
	else m_key_row->setVisible(m_key_row->should_be_visible());
'''
replace = '''
	m_keyboard->setVisible(built_in && !m_keyboard_hidden_by_user);
	m_key_row->setVisible(m_key_row->should_be_visible());
'''
expect = "only_one_on_screen_keyboard_is_ever_shown"

# A lock spent like an arm, which is the whole difference between the two
# states. Anything less than this -- clearing it a keystroke later, say --
# is what the test asserts over two keys rather than one.
[[sabotage]]
name = "a locked modifier is spent by the keystroke it modifies"
file = "src/input/input_router.cpp"
find = '''
void bssh_input_router::spend_sticky_modifiers() {
	set_sticky_modifiers(bssh_emulator::MOD_NONE);
}
'''
replace = '''
void bssh_input_router::spend_sticky_modifiers() {
	set_sticky_modifiers(bssh_emulator::MOD_NONE);
	set_locked_modifiers(bssh_emulator::MOD_NONE);
}
'''
expect = "a_modifier_locks_on_the_second_press_and_releases_on_the_third"

# A group one row shorter than its neighbours. On a device this resizes the
# terminal every time the side button is pressed, and reflows whatever the
# remote is drawing.
[[sabotage]]
name = "one key group is a row shorter than the others"
file = "keyboard/soft_keyboard_layout.cpp"
find = '''
	group.rows.append(common_bottom_row());
	return group;
}

/*
 * Digits, and the punctuation a command line is written in.
'''
replace = '''
	return group;
}

/*
 * Digits, and the punctuation a command line is written in.
'''
expect = "every_keyboard_group_is_the_same_shape"

# And a row that does not fill the grid. Separate from the entry above
# because they are different faults with different symptoms: a short row
# leaves its last key stretched across the gap, so the keys stop lining up
# between rows while every group still has the same height.
[[sabotage]]
name = "a row is one key short of the grid width"
file = "keyboard/soft_keyboard_layout.cpp"
find = '''
	group.rows.append(slot_run("AC", 1, 11, 2));'''
replace = '''
	group.rows.append(slot_run("AC", 1, 10, 2));'''
expect = "every_keyboard_group_is_the_same_shape"

# A key that is held stops repeating. Reported from a phone: Backspace
# deleted one character however long it was held, which makes correcting
# a mistyped path a tap per character. The partition test is what notices
# -- a cap repeats if and only if it is not checkable -- so removing the
# call on ONE board is enough to break the rule the test asserts.
[[sabotage]]
name = "the built-in keyboard's keys stop repeating when held"
file = "keyboard/soft_keyboard.cpp"
find = "\t\tconst int code = key.value;\n\t\tbssh_set_key_repeat(button);"
replace = "\t\tconst int code = key.value;"
expect = "every_key_that_sends_something_repeats"

# The other board, and it is a separate edit on purpose: the two build
# their buttons in different files, which is the drift the single helper
# exists to prevent. A sabotage of one that the other's coverage caught
# would report the rule as guarded when half of it is not.
[[sabotage]]
name = "the key row's keys stop repeating when held"
file = "keyboard/key_row.cpp"
find = "\tQAbstractButton *button = make_button(label);\n\tbssh_set_key_repeat(button);\n\tconnect(button, &QAbstractButton::clicked, this, [this, key] {"
replace = "\tQAbstractButton *button = make_button(label);\n\tconnect(button, &QAbstractButton::clicked, this, [this, key] {"
expect = "every_key_that_sends_something_repeats"


# The built-in keyboard's choice reaches the focused pane only -- the Fold,
# 2026-10-07, where the panes beside it kept the system keyboard and
# Samsung's came up under the built-in one on opening a session.
[[sabotage]]
name = "only the focused pane declines the system keyboard"
file = "src/ui/main_window.cpp"
find = "\t\t\tview->setAttribute(Qt::WA_InputMethodEnabled, !built_in);"
replace = ""
expect = "the_built_in_keyboard_declines_the_system_one_in_every_pane"

# Back remembers one page, not a trail: the Fold, 2026-10-07, where a
# section opened from the settings index made the second Back land on
# the host list instead of the session the settings were opened from.
[[sabotage]]
name = "Back remembers only the last page"
file = "src/ui/main_window.cpp"
find = "\tif (here == m_terminal_page || here == m_host_list) m_back_stack.clear();"
replace = "\tm_back_stack.clear();"
expect = "the_back_key_leaves_the_page_not_the_app"

# Back at a terminal is left for Android, which backgrounds the app -- the
# Fold, 2026-10-07, where the host list could not be reached from a live
# session at all.
[[sabotage]]
name = "Back at a terminal is left for Android"
file = "src/ui/main_window.cpp"
find = "\tif (event->key() == Qt::Key_Back && m_host_list && m_pages\n\t    && m_pages->currentWidget() == m_terminal_page) {"
replace = "\tif (false) {"
expect = "backing_out_of_a_session_reaches_the_host_list"
