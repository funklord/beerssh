# Sabotages for sec 11's per-host biometric release.
#
# The feature had a stored field, a reader at connect time, and no way to
# set it: require_biometric was persisted by the profile store and
# consulted by the window, and no control anywhere wrote it. The inverse
# of the class sec 10.1 records twice -- not a setting applied to
# nothing, but a setting nothing can apply.

# The control's presence, which is the honesty half. A checkbox
# promising a fingerprint dialog to a device with no reader -- or with a
# reader and nothing enrolled -- is a promise the app cannot keep, and
# the user who ticks it has made their own stored password unreachable.
[[sabotage]]
name = "the setting is offered where no prompt can be raised"
file = "src/ui/host_editor.cpp"
find = "\tif (bssh_platform::instance() && bssh_platform::instance()->has_biometric()) {"
replace = "\tif (true) {"
expect = "the_biometric_setting_is_absent_where_it_cannot_work"

# And the write-back. A control that displays the setting and does not
# save it is sec 10.1's override badge again: the control was there, and
# the thing it claimed to control was somewhere else.
[[sabotage]]
name = "the control is shown and never written back"
file = "src/ui/host_editor.cpp"
find = "\tif (m_biometric) edited.require_biometric = m_biometric->isChecked();"
replace = "\t(void)0;"
expect = "the_biometric_setting_is_absent_where_it_cannot_work"

# The read. Without it the box is always clear, so a host that HAS the
# lock looks unlocked -- and saving the page then removes it.
[[sabotage]]
name = "the stored setting never reaches the control"
file = "src/ui/host_editor.cpp"
find = "\tif (m_biometric) m_biometric->setChecked(profile.require_biometric);"
replace = "\t(void)0;"
expect = "the_biometric_setting_is_absent_where_it_cannot_work"
