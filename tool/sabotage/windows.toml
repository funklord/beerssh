# Sabotages for sec 8.4's multiple windows: the per-window tab set, tearing
# a tab out, and dropping one window onto another.
#
# Each names the test that claims to cover it. A sabotage caught by some
# OTHER test is reported as "WRONG TEST" rather than as a pass, because
# that means the assertion which is supposed to hold this ground does not.
#
# Last run 2026-08-14: all seven caught, each by the test it names, from a
# 366-passing baseline. The slider entry was MISSED on an earlier run (sec
# 12.3), which is what rewrote the check now holding that ground.

[[sabotage]]
name = "tabs come from the whole registry"
file = "src/ui/main_window.cpp"
find = '''
	for (bssh_session *session : m_shown) {
		if (!panes.contains(session)) m_tab_order.append(session);
	}
'''
replace = '''
	for (bssh_session *session : m_registry->sessions()) {
		if (!panes.contains(session)) m_tab_order.append(session);
	}
'''
expect = "a_window_shows_only_its_own_tabs"

[[sabotage]]
name = "the last tab may tear out"
file = "src/ui/main_window.cpp"
find = "\tif (m_shown.size() < 2) return nullptr;"
expect = "a_torn_out_tab_becomes_a_window"

[[sabotage]]
name = "a torn-out tab is not adopted"
file = "src/ui/main_window.cpp"
find = "\twindow->adopt_session(session);"
expect = "a_torn_out_tab_becomes_a_window"

[[sabotage]]
name = "a move is not announced"
file = "src/ui/main_window.cpp"
find = "\temit m_registry->session_taken(session);"
expect = "a_dropped_session_leaves_the_window_it_came_from"

# Rewritten 2026-08-07: the original find string assumed split_with() was
# the last statement before tear_out_tab, and the tiling decision has since
# grown an if/else with the room check in it. A spec that no longer matches
# stops the whole run, so this is checked rather than trusted.
[[sabotage]]
name = "a drop on the panes never tiles"
file = "src/ui/main_window.cpp"
find = "\tif (room) {\n\t\tsplit_with(session);"
replace = "\tif (room) {\n\t\tshow_session(session);"
expect = "a_drop_on_the_panes_tiles_where_there_is_room"

# The reported bug: leaving the settings closed the whole window and took
# every live session with it. Sabotaged by making Cancel unconditional,
# which is the smallest edit that reproduces it.
#
# Rewritten 2026-08-07: the original find string described the page-shaped
# version, and making the settings a window of their own replaced it. A
# spec that no longer matches stops the whole run, so every one is checked
# to match exactly once before the runner is started.
[[sabotage]]
name = "cancelling the settings closes the window"
file = "src/ui/main_window.cpp"
find = "\t\t\tif (m_shown.isEmpty()) close();"
replace = "\t\t\tclose();"
expect = "cancelling_the_settings_keeps_the_session"

# The touch floor's list of TYPES. A slider is dragged, which is harder
# than a tap and so not a smaller target -- and it was missing until the
# brightness slider stood 33dp on a phone. Removing it again must fail the
# floor check, or that check is not really covering sliders.
[[sabotage]]
name = "the touch floor forgets sliders"
file = "src/ui/touch_metrics.cpp"
find = "\treturn qobject_cast<const QSlider *>(widget) != nullptr;"
replace = "\treturn false;"
expect = "every_touch_surface_fits_a_phone"
