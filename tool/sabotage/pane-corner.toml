# Sabotages for the pane corner (project.md sec 8.7a): the grip, the mode
# drum and the tmux button over the grid's top-right corner, on the
# focused pane only, taking nothing from the grid.

# The closed drawer covers the text again, where the corner's button is
# meant to stand for it.
[[sabotage]]
name = "the closed drawer covers the text"
file = "src/ui/terminal_view.cpp"
find = "\tm_mux_drawer->setVisible(m_mux_drawer->is_open());\n"
replace = "\tm_mux_drawer->setVisible(true);\n"
expect = "the_corner_sits_on_the_grid_and_takes_none_of_it"

# Placed against the view's edge, under a right-hand scrollbar.
[[sabotage]]
name = "the corner sits under the scrollbar"
file = "src/ui/terminal_view.cpp"
find = "\tconst int right = grid_origin_x() + grid_width();\n\tm_corner->setGeometry("
replace = "\tconst int right = width();\n\tm_corner->setGeometry("
expect = "the_corner_sits_on_the_grid_and_takes_none_of_it"

# Every pane shows its corner, the inactive ones covering their text.
[[sabotage]]
name = "every pane shows its corner"
file = "src/ui/pane_container.cpp"
find = "\t\tview->set_corner_active(focused);"
replace = "\t\tview->set_corner_active(true);"
expect = "only_the_focused_pane_shows_its_corner"

# Touch gets a grip, which hands the window to Android's split-screen.
[[sabotage]]
name = "touch gets a grip"
file = "src/ui/terminal_view.cpp"
find = "\tm_corner->set_grip_shown(!touch);"
replace = "\tm_corner->set_grip_shown(true);"
expect = "touch_gets_no_grip_in_the_corner"

# The tmux button stays with nothing to open.
[[sabotage]]
name = "the tmux button outlives the drawer"
file = "src/ui/pane_corner.cpp"
find = "\tm_multiplexer->setVisible(!text.isEmpty());"
replace = "\tm_multiplexer->setVisible(true);"
expect = "the_corner_sits_on_the_grid_and_takes_none_of_it"

# Shown over a window nobody is using (the holder: "the widget doesn't
# hide when no focus").
[[sabotage]]
name = "the corner shows on an inactive window"
file = "src/ui/terminal_view.cpp"
find = "\tconst bool window_active = touch || (window() && window()->isActiveWindow());"
replace = "\tconst bool window_active = true;"
expect = "the_corner_hides_with_its_window_and_is_faint_until_pointed_at"

# Solid over the text whether or not anything points at it.
[[sabotage]]
name = "the idle corner is solid"
file = "src/ui/pane_corner.cpp"
find = "\tm_opacity->setOpacity(m_faint_when_idle && !m_hovered ? IDLE_OPACITY : 1.0);"
replace = "\tm_opacity->setOpacity(1.0);"
expect = "the_corner_hides_with_its_window_and_is_faint_until_pointed_at"

# Three modes turn as a drum again, all on screen and rotating anyway.
[[sabotage]]
name = "three modes rotate"
file = "src/ui/input_selector.cpp"
find = "\tif (n <= 3) return modes.at(qBound(0, row, n - 1));"
replace = ""
expect = "the_input_selector_defaults_by_platform_and_reports_changes"

# The tab bar shows although the setting hides it.
[[sabotage]]
name = "a hidden tab bar shows"
file = "src/ui/main_window.cpp"
find = "\tbar->setVisible(tabs.size() > 1 && !m_tabs_hidden);"
replace = "\tbar->setVisible(tabs.size() > 1);"
expect = "hidden_bars_are_reached_from_the_corner"

# Hidden, and no stand-in: the pane's other tabs are unreachable.
[[sabotage]]
name = "the corner never counts the tabs"
file = "src/ui/main_window.cpp"
find = "\t\tview->set_corner_tabs(m_tabs_hidden && tabs > 1 ? QStringLiteral(\"tabs %1\").arg(tabs)"
replace = "\t\tview->set_corner_tabs(false && tabs > 1 ? QStringLiteral(\"tabs %1\").arg(tabs)"
expect = "hidden_bars_are_reached_from_the_corner"

# The setting is stored and nothing hides the bar.
[[sabotage]]
name = "the menu bar ignores its setting"
file = "src/ui/main_window.cpp"
find = "\tm_menu_bar->setVisible(shown);\n\tif (m_menu_bar_action)"
replace = "\tif (m_menu_bar_action)"
expect = "hidden_bars_are_reached_from_the_corner"

# The corner's menus with no way back to the bar.
[[sabotage]]
name = "the corner's menus lose the way back"
file = "src/ui/main_window.cpp"
find = "\t\tmenu.addAction(m_menu_bar_action);"
replace = "\t\t;"
expect = "hidden_bars_are_reached_from_the_corner"

# A band offered on a pane that already shows a bar: the drop that should
# split it makes it a tab instead.
[[sabotage]]
name = "a band is a tab zone on a pane with a bar"
file = "src/ui/main_window.cpp"
find = "\t\tconst bool bar_shown = !m_tabs_hidden && m_layout->bar_tabs(target).size() > 1;"
replace = "\t\tconst bool bar_shown = false;"
expect = "a_terminal_dropped_on_a_side_band_makes_a_tab_bar_there"

# A band drop that tabs the session and leaves the bar where it was.
[[sabotage]]
name = "a band drop does not move the bar"
file = "src/ui/main_window.cpp"
find = "\t\tbssh_app_settings().set_tab_position(side);\n\t\tapply_tab_position(int(side));\n\t\tdrop_session_as_tab(session, target, INT_MAX);"
replace = "\t\tdrop_session_as_tab(session, target, INT_MAX);"
expect = "a_terminal_dropped_on_a_side_band_makes_a_tab_bar_there"

# The handle moves the bar but nothing shows where it will go.
[[sabotage]]
name = "the bar side is not previewed"
file = "src/ui/main_window.cpp"
find = "\t\tview->show_drop_zone(inside && view == own ? BSSH_DROP_TAB_BASE + panes_edge_for(side) : -1);"
replace = "\t\tview->show_drop_zone(-1);"
expect = "the_tab_bar_is_dragged_to_another_side"

# No band at all: the edge zone reaches the pane's very edge again.
[[sabotage]]
name = "there is no band at the edge"
file = "src/ui/terminal_view.cpp"
find = "\treturn distance < band ? BSSH_DROP_TAB_BASE + edge : edge;"
replace = "\treturn edge;"
expect = "the_bar_side_and_the_tab_bands_are_where_the_pointer_is"

# Turned or shrunk, the column leaves the focused pane -- and the mode
# drum on it -- off screen.
[[sabotage]]
name = "a relayout leaves the focused pane off screen"
file = "src/ui/pane_container.cpp"
find = "\tQMetaObject::invokeMethod(this, [this] { bring_focus_into_view(); }, Qt::QueuedConnection);"
replace = ""
expect = "the_focused_pane_stays_on_screen_in_a_column"

# Panned away, focus stays on a pane nobody can see.
[[sabotage]]
name = "focus stays on a pane panned out of view"
file = "src/ui/pane_container.cpp"
find = "\tif (best >= 0 && best < m_sessions.size()) focus_session(m_sessions.at(best));"
replace = ""
expect = "the_focused_pane_stays_on_screen_in_a_column"

# A short pane loses its corner again, and a phone its only mode control.
[[sabotage]]
name = "a short pane has no drum"
file = "src/ui/terminal_view.cpp"
find = "\tif (!fits_in(m_corner->sizeHint())) m_corner->set_drum_rows(1);"
replace = ""
expect = "a_short_pane_gets_a_one_row_drum_not_none"

# The note is kept and never drawn: a dead terminal looks alive.
[[sabotage]]
name = "the status note is not drawn"
file = "src/ui/terminal_view.cpp"
find = "\tpaint_notes(painter);\n"
replace = ""
expect = "a_status_note_leaves_the_terminal_working"

# The state never reaches the pane: connecting, lost, all silent.
[[sabotage]]
name = "a session's state is not written over its pane"
file = "src/ui/main_window.cpp"
find = "\t\t\tif (state != bssh_ssh_session::FAILED || m_notes.value(session).isEmpty())\n\t\t\t\tset_session_note(session, note);"
replace = "\t\t\t(void) note;"
expect = "a_sessions_trouble_is_written_over_its_pane"

# The status line back on by default.
[[sabotage]]
name = "the status line shows by default"
file = "src/model/app_settings.cpp"
find = "\t                            QStringLiteral(\"off\")).toString();"
replace = "\t                            QStringLiteral(\"session\")).toString();"
expect = "a_sessions_trouble_is_written_over_its_pane"
# A hidden status line still counted when a window is sized in cells.
[[sabotage]]
name = "a hidden status line takes a row from a window sized in cells"
file = "src/ui/main_window.cpp"
find = "\tif (m_status_label && m_status_line != bssh_app_settings::STATUS_LINE_OFF)\n\t\twanted.rheight()"
replace = "\tif (m_status_label)\n\t\twanted.rheight()"
expect = "a_window_can_be_sized_in_cells"

# The hover never reaches the windows: another process's drag shows
# nothing here, which is what the holder saw.
[[sabotage]]
name = "a hover from another process is dropped"
file = "src/model/handoff_point.cpp"
find = "\t\t\temit hovered(global, active);"
replace = "\t\t\t(void) global; (void) active;"
expect = "a_hover_says_where_and_then_that_it_left"

# The zone is not drawn for an arrival.
[[sabotage]]
name = "an arrival's zone is not lit"
file = "src/ui/main_window.cpp"
find = "\tif (view) view->show_drop_zone(spot.window->arrival_zone_for(spot.target, spot.edge));"
replace = ""
expect = "another_processs_drag_is_previewed_here"

# Ended, and the zone stays lit.
[[sabotage]]
name = "an ended arrival stays lit"
file = "src/ui/main_window.cpp"
find = "\t\tif (g_arrival_lit) g_arrival_lit->show_drop_zone(-1);\n\t\tif (g_arrival_row) {"
replace = "\t\tif (g_arrival_row) {"
expect = "another_processs_drag_is_previewed_here"

# The menu button back under the drum and the tmux button, rather than at
# the top under the grip where the holder put it: the layout as it was.
[[sabotage]]
name = "the menu button sits under the drum"
file = "src/ui/pane_corner.cpp"
find = """
	if (!m_menu->isHidden()) {
		const int high = m_menu->sizeHint().height();
		m_menu->setGeometry(PAD, y, inner, high);
		y += high;
	}
	const int drum = m_selector->sizeHint().height();
	m_selector->setGeometry(PAD, y, inner, drum);
	y += drum;
	/* Under the drum: the tmux picker, then the tab bar's stand-in. */
	for (QToolButton *button : { m_multiplexer, m_tabs }) {"""
replace = """
	const int drum = m_selector->sizeHint().height();
	m_selector->setGeometry(PAD, y, inner, drum);
	y += drum;
	for (QToolButton *button : { m_multiplexer, m_tabs, m_menu }) {"""
expect = "hidden_bars_are_reached_from_the_corner"

# The handle's side read wherever the pointer is, not only in its own
# pane: carried over another terminal, it lights and moves there -- the
# holder: "a tab bar shouldn't be movable to other terminals".
[[sabotage]]
name = "a bar's handle works over other terminals"
file = "src/ui/main_window.cpp"
find = "\tif (!view->rect().contains(at)) return false;\n"
replace = ""
expect = "the_tab_bar_is_dragged_to_another_side"
