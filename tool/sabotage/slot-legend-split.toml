# Sabotages for the slot/legend split and the annotated third level.
#
# Every edit is the version this would have been if written carelessly,
# and every one leaves code that reads as correct on the page.

# 1. The two keyboards stop sharing a layout.
#    This is the state the split was made to end: the compact board
#    carrying its own copy of the alphabet, right about itself, and free
#    to disagree with the full one. Nothing about the compact keyboard
#    looks wrong afterwards -- it draws ten letters in the right order --
#    and only a comparison ACROSS the two can see it.
[[sabotage]]
name = "the compact keyboard keeps its own copy of the letters"
file = "src/ui/soft_keyboard_layout.cpp"
find = "\tgroup.rows.append(slot_run(\"AD\", 1, 10, 2));"
replace = "\tgroup.rows.append(literal_row(\"qwertyuiop\"));"
expect = "both_keyboards_read_one_layout"

# 2. A slot the layout does not have.
#    slot_key() takes a string, so this cannot fail at build time. AC12
#    does not exist -- the home row ends at AC11 -- and the keyboard draws
#    a key that sends nothing where the apostrophe should be. The row
#    still adds up, so the shape test passes.
[[sabotage]]
name = "the geometry names a slot the layout does not have"
file = "src/ui/soft_keyboard_layout.cpp"
find = "\tappend_all(home, slot_run(\"AC\", 1, 11, BSSH_FULL_UNIT));"
replace = "\tappend_all(home, slot_run(\"AC\", 2, 11, BSSH_FULL_UNIT));"
expect = "every_slot_the_geometry_names_exists"

# 3. The third legend is never drawn.
#    The keys still SEND the accented characters -- the router and the
#    catalogue are untouched -- so every test about what AltGr reaches
#    goes on passing. What is gone is the only way a user could find out
#    that it does, which on an unfamiliar layout is the whole feature.
[[sabotage]]
name = "AltGr works and nothing says so"
file = "src/ui/soft_keyboard.cpp"
find = '''		m_letter_buttons.at(i)->set_hint(
		        !altgr && key.altgr_value != 0
		                ? QString(QChar(uint(key.altgr_value)))
		                : QString());'''
replace = "\t\tm_letter_buttons.at(i)->set_hint(QString());"
expect = "the_altgr_legend_is_shown_and_then_stands_aside"

# 4. The hint is drawn but never said.
#    A sighted user reads the corner of the cap; without the description
#    a screen reader user has no route to the third level at all. This is
#    the edit that turns an annotation into an accessibility regression,
#    and it is invisible on screen.
[[sabotage]]
name = "the annotation is drawn but not announced"
file = "src/ui/key_cap.cpp"
find = '''	setAccessibleDescription(m_hint.isEmpty()
	                                 ? QString()
	                                 : QStringLiteral("AltGr: %1").arg(m_hint));'''
replace = "\t/* nothing */"
expect = "the_altgr_legend_is_shown_and_then_stands_aside"

# 5. The keypad goes back to consulting the layout.
#    This is the state it shipped in: a keypad key built with the helper
#    that reads the layout table, so Shift on the keypad's 4 sends $ and
#    AltGr on its 5 sends a euro sign. Nothing looks wrong -- the keys
#    are in the right places and send the right digits unmodified.
[[sabotage]]
name = "the keypad inherits the digit row's legends"
file = "src/ui/soft_keyboard_layout.cpp"
find = "\tr2.append(keypad_key(QStringLiteral(\"4\"), U'4'));"
replace = "\tr2.append(literal('4', BSSH_FULL_UNIT));"
expect = "a_keypad_key_sends_only_its_digit"

# 6. The compact keyboard loses its AltGr key.
#    This is the state it shipped in, and it is the worst of the six:
#    every letter goes on drawing its third legend, the catalogue goes on
#    reaching the accented characters, the router goes on sending them --
#    and on a phone not one of the 78 hints can be reached, because the
#    board has no key that gets there.
[[sabotage]]
name = "the board advertises a level it has no key for"
file = "src/ui/soft_keyboard_layout.cpp"
find = "\trow.append(modifier_key(QStringLiteral(\"AltGr\"), bssh_input_router::MOD_ALTGR, 3));"
replace = "\trow.append(spacer(3));"
expect = "a_keyboard_can_reach_every_level_it_shows"
