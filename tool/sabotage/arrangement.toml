# Sabotages for sec 8.3/8.4's arrangement: splitting, dropping a tab onto
# a pane, and reordering without detaching.
#
# All three were reported from use and all three were invisible to the
# suite for one reason: the tests drove the MODEL and never the ROUTE.
# The drop tests sent their events straight at the window, bypassing the
# target Qt actually picks; the split tests checked the menu action
# existed and never triggered it.

# Split. m_current is by construction always in the layout intent, so
# split_with declines it and the enabled menu item does nothing at all.
[[sabotage]]
name = "split asks to put the current session beside itself"
file = "src/ui/main_window.cpp"
find = "\tconst QList<bssh_session *> before = m_layout->intent();"
replace = "\tconst QList<bssh_session *> before;"
expect = "split_beside_current_makes_a_second_pane"

# Drop. The pane hands a session payload up to the window instead of
# dropping it on the floor.
#
# The dragEnter ACCEPT has no entry, and the reason is a real limit
# rather than an oversight: Qt chooses a drop target before delivery,
# by walking up from the widget under the pointer to the first one with
# acceptDrops(), and a synthetic sendEvent() cannot exercise that at all
# -- it delivers wherever it is told. terminal_view_test already records
# the same limitation. So the accept is verified by the test asserting
# the event comes back accepted, and the ROUTING it enables is not
# reachable from any test in this suite; that half was found by reading
# Qt's findDnDTarget and is why every existing drop test passed while
# dropping was impossible in the app.
[[sabotage]]
name = "a session dropped on a pane goes nowhere"
file = "src/ui/terminal_view.cpp"
find = "\t\temit session_dropped(event->mimeData(), edge);"
expect = "a_tab_dropped_on_a_pane_reaches_the_window"

# Reorder. The row lays the bar out at exactly its sizeHint, so measuring
# against the BAR measures distance past the last tab -- about 40px of
# slack before a reorder silently became a tear-out.
[[sabotage]]
name = "tear-out is measured from the tabs, not the strip"
file = "src/ui/pane_bar.cpp"
find = "\t\t\tconst QPoint in_row = m_bar->mapTo(this, mouse->position().toPoint());\n\t\t\tconst int clear = qMax(qMax(-in_row.y(), in_row.y() - height()),\n\t\t\t                       qMax(-in_row.x(), in_row.x() - width()));\n"
replace = "\t\t\tconst QPoint in_row = mouse->position().toPoint();\n\t\t\tconst int clear = qMax(qMax(-in_row.y(), in_row.y() - m_bar->height()),\n\t\t\t                       qMax(-in_row.x(), in_row.x() - m_bar->width()));\n"
expect = "a_reorder_along_the_strip_is_not_a_tear_out"

# The setting is read but never applied to a window that is open.
#
# The constructor's own early call still sets it, so a window opened
# AFTER the change is right and only the one somebody changed it in is
# wrong -- which is why this needs the live case in the test rather than
# another startup one. A startup-only pair was MISSED by both halves,
# because either one alone still gives a fresh window the right shape.
#
# The comparison lives in apply_arrangement() now (sec 8.7's per-state
# rule made the arrangement change at runtime), and the edit follows it.
# The edit neuters the COMPARISON rather than the assignment, and the
# difference is not cosmetic. Deleting `set_arrangement(wanted)` leaves
# arrangement_changed permanently true, which rebuilds on every settings
# pass, re-enters this function and runs the stack out -- so the suite
# died inside the very test that covers this and the harness, reading
# only PASS and FAIL lines, called that green. Holding the flag false
# leaves a program that runs and does nothing, which is the defect a
# user would actually meet and the one the test can answer.
[[sabotage]]
name = "changing the arrangement does not rebuild the panes"
file = "src/ui/main_window.cpp"
find = "\tconst bool changed = m_layout->arrangement() != choice.arrangement;"
replace = "\tconst bool changed = false;"
expect = "a_desktop_can_be_asked_for_the_column"

# "A drop with no room collapses the split" stood here, breaking the
# no-window fallback of swap_sessions() by calling show_session() there
# instead. Removed 2026-10-30: it was MISSED, and was already at b3d79fb,
# because the two now end the same way: take_session() just before has
# already put the session into the focused pane -- the target -- as a
# tab, so place() and show_session() both leave it in front of that pane
# with the target behind it (read, 2026-10-30; the tab order may differ).
# Once show_session() replaced the whole intent, the collapse the name
# described; it no longer does. An edit with no visible effect cannot be
# caught, so it guarded nothing;
# a_drop_with_no_room_keeps_an_arrangement_it_cannot_join still asserts
# the outcome.

# And the other half: a ONE-pane window must still hand the screen over,
# or a drop onto a phone-width window changes nothing visible and reads
# as a drop that failed.
[[sabotage]]
name = "a drop onto a single pane does nothing visible"
file = "src/ui/main_window.cpp"
find = "\ttake_session(session);\n\tm_layout->place(session, target, bssh_layout_manager::EDGE_MIDDLE);"
replace = "\ttake_session(session);"
expect = "a_drop_with_no_room_keeps_an_arrangement_it_cannot_join"

# A window whose last terminal went to another BeerSSH stays, empty.
[[sabotage]]
name = "a window emptied by a hand-off stays"
file = "src/ui/main_window.cpp"
find = "\t\tif (!m_shown.contains(session) || m_shown.size() != 1) return;\n\t\tQTimer::singleShot(0, this, [this] {\n\t\t\tif (!m_shown.isEmpty()) return;\n\t\t\tclose();\n\t\t});"
replace = "\t\t(void) session;"
expect = "a_window_whose_last_session_goes_to_another_process_closes"

# A nested splitter left to show itself when polished: built into a
# splitter already on screen, it stayed hidden with every pane in it --
# terminals in the layout and nowhere on screen (the holder, 2026-10-30).
[[sabotage]]
name = "a nested split's panes stay hidden"
file = "src/ui/pane_container.cpp"
find = "\t\tinto->addWidget(nested);\n"
replace = ""
expect = "no_terminal_is_lost_however_the_panes_are_moved"
