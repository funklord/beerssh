# Sabotages for sec 6.2's keyboard resize bars and the sizes they keep.
# Each names the test that must notice.

# The top bar the wrong way round: dragging up shrinks the keyboard.
[[sabotage]]
name = "the top bar resizes the wrong way"
file = "keyboard/soft_keyboard.cpp"
find = "\t\tset_bottom_height(qMax(1, m_drag_from - distance));"
replace = "\t\tset_bottom_height(qMax(1, m_drag_from + distance));"
expect = "dragging_a_bar_resizes_the_keyboard"

# The floor gone, which is the bug the test found: a hard drag down asks
# for "not chosen" and the keyboard snaps back to full size.
[[sabotage]]
name = "a hard drag down snaps the keyboard back to full size"
file = "keyboard/soft_keyboard.cpp"
find = "\t\tset_bottom_height(qMax(1, m_drag_from - distance));"
replace = "\t\tset_bottom_height(m_drag_from - distance);"
expect = "dragging_a_bar_resizes_the_keyboard"

# The bars ignore the setting that puts them away.
[[sabotage]]
name = "the bars show whatever the setting says"
file = "keyboard/soft_keyboard.cpp"
find = "\tfor (QWidget *grip : m_half_grips) grip->setVisible(m_grips_shown);"
replace = "\tfor (QWidget *grip : m_half_grips) grip->setVisible(true);"
expect = "dragging_a_bar_resizes_the_keyboard"

# A dragged size that is never kept: the next run is the default again.
[[sabotage]]
name = "a dragged split width is not kept"
file = "src/ui/main_window.cpp"
find = "\t\t\tsettings.set_keyboard_split_width(size_dp);"
replace = "\t\t\tQ_UNUSED(size_dp);"
expect = "a_dragged_keyboard_size_is_kept"

# The default back at 30%, which left the Fold about 30 columns.
[[sabotage]]
name = "the split halves default to 30% again"
file = "src/ui/main_window.cpp"
find = ": qBound(140, width() * 22 / 100, 260));"
replace = ": qBound(140, width() * 30 / 100, 260));"
expect = "a_dragged_keyboard_size_is_kept"

# Reset that forgets the heights and keeps the split width.
[[sabotage]]
name = "reset keeps the split width"
file = "src/model/app_settings.cpp"
find = "\tset_keyboard_split_width(0);\n\tset_keyboard_height(false, 0);"
replace = "\tset_keyboard_height(false, 0);"
expect = "a_dragged_keyboard_size_is_kept"

# Holding one split bar leaves the other dim, while both halves move.
[[sabotage]]
name = "holding one split bar leaves the other dim"
file = "keyboard/soft_keyboard.cpp"
find = "\t\t\tm_drag_from = m_half_keys[0]->width();\n\t\t\tfor (sk_resize_grip *grip : m_half_grips) grip->set_lit(true);"
replace = "\t\t\tm_drag_from = m_half_keys[0]->width();"
expect = "dragging_a_bar_resizes_the_keyboard"

# The input selector stays a full row on a wide screen (sec 8.7).
[[sabotage]]
name = "the input selector keeps its own row when wide"
file = "src/ui/main_window.cpp"
find = "\tconst bool wide = width() > height()\n\t                  || width() >= SK_FULL_KEYBOARD_MIN_DP;"
replace = "\tconst bool wide = false;"
expect = "the_input_selector_joins_the_status_line_when_wide"

# On the status line, but sharing the row half and half with the text.
[[sabotage]]
name = "a compact selector keeps its wide buttons"
file = "src/ui/main_window.cpp"
find = "\t\ttarget->addWidget(m_input_selector, wide ? 0 : 1);"
replace = "\t\ttarget->addWidget(m_input_selector, 1);"
expect = "the_input_selector_joins_the_status_line_when_wide"

# sec 9.5's live font scale. Not a keyboard, but the same day's work and
# the same "default perfected" pass; moved if it grows a file of its own.

# Read once at start and never again: the Fold kept the old size until
# the app was restarted.
[[sabotage]]
name = "the font scale is not read again when the app comes back"
file = "src/ui/interface_scale.cpp"
find = "\t\tif (platform->is_application_active()) bssh_apply_interface_scale();"
replace = "\t\tQ_UNUSED(platform);"
expect = "the_interface_follows_the_system_font_size_live"

# Scaled from the current font, so each change compounds on the last.
[[sabotage]]
name = "each font scale compounds on the last"
file = "src/ui/interface_scale.cpp"
find = "\tQApplication::setFont(bssh_interface_font(base, scale));"
replace = "\tQApplication::setFont(bssh_interface_font(QApplication::font(), scale));"
expect = "the_interface_follows_the_system_font_size_live"

# The toggle waits for the next start again.
[[sabotage]]
name = "turning the font setting off waits for a restart"
file = "src/ui/main_window.cpp"
find = "\t */\n\tbssh_apply_interface_scale();\n\n\tapply_key_row_visibility();"
replace = "\t */\n\n\tapply_key_row_visibility();"
expect = "the_interface_follows_the_system_font_size_live"

# Only the application font follows: what the Fold first showed, a menu
# glyph growing while the host list kept its size.
[[sabotage]]
name = "widgets with fonts of their own are left at the old size"
file = "src/ui/interface_scale.cpp"
find = "\tcarry_widget_fonts(from, scale);"
replace = "\tQ_UNUSED(from);"
expect = "the_interface_follows_the_system_font_size_live"

# The style-sheet half alone: the host rows are styled for their
# separators and keep the font they were polished with.
[[sabotage]]
name = "a styled widget keeps the font it was polished with"
file = "src/ui/interface_scale.cpp"
find = "\t\t\twidget->style()->unpolish(widget);\n\t\t\twidget->style()->polish(widget);"
replace = ""
expect = "the_interface_follows_the_system_font_size_live"

# Carried by ratio from the current font: pixel sizes drift a step at a
# time, 23 coming back as 22.
[[sabotage]]
name = "an explicit font drifts as it is carried"
file = "src/ui/interface_scale.cpp"
find = "\t\t\tconst QFont basis = widget->property(\"bssh_font_basis\").value<QFont>();\n\t\t\tconst double factor = to / widget->property(\"bssh_font_basis_scale\").toDouble();"
replace = "\t\t\tconst QFont basis = widget->font();\n\t\t\tconst double factor = to / from;"
expect = "the_interface_follows_the_system_font_size_live"
