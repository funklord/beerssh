# Sabotage for a buffer the REMOTE decides the size of.
#
# Distinct from remote-strings.toml, which is about things bounded in
# memory and unbounded in LAYOUT. This one is the plainer failure: a
# structure with no cap at all, grown five bytes at a time from the wire
# and cleared only by a reset.
#
# The kitty keyboard stack was the last of them. Its pop is guarded so the
# stack never empties and its set writes in place -- only the push grew
# freely, which is the half nobody looks at when the other two are
# careful. Every neighbouring buffer in that file carries a cap and says
# why: "accumulating them without a bound of our own would put the cap
# back where it started: the remote decides how much memory this costs".
[[sabotage]]
name = "the kitty flags stack grows without limit"
file = "src/term/emulator_vterm.cpp"
find = "\t\t\tif (self->kitty_stack_ref().size() >= BSSH_MAX_KITTY_STACK) {\n\t\t\t\tself->kitty_stack_ref().removeAt(1);\n\t\t\t}\n\n"
replace = ""
expect = "the_kitty_flags_stack_is_bounded"

# The aggregate the id wrap does NOT bound. BSSH_MAX_LINK_CHARS caps one
# uri and the wrap caps the count at 65535; the product is about 536 MB,
# held for the life of the session because `links` was never cleared.
# Without the budget this fixture holds ~32 MB, four times the cap.
[[sabotage]]
name = "the hyperlink table has no aggregate budget"
file = "src/term/emulator_vterm.cpp"
find = "\tif (link_bytes > BSSH_MAX_LINK_BYTES) {"
replace = "\tif (false && link_bytes > BSSH_MAX_LINK_BYTES) {"
expect = "the_hyperlink_table_is_bounded_and_a_reset_empties_it"

# A reset clears every other piece of state this file owns -- the kitty
# stack, modifyOtherKeys, the sync -- and left the hyperlinks, which
# libvterm does not model either and so nothing else can drop.
[[sabotage]]
name = "a reset leaves the hyperlink table behind"
file = "src/term/emulator_vterm.cpp"
find = "\t\tself->links.clear();\n\t\tself->link_bytes = 0;\n\t\tself->open_link_id = 0;\n"
replace = ""
expect = "the_hyperlink_table_is_bounded_and_a_reset_empties_it"

# The kitty TRANSMISSION, which m=1 stitches from any number of complete,
# in-budget APC payloads. bssh_accumulate bounds one payload at 8 MB; the
# product of two bounds is not a bound. Measured without this: 50,331,648
# bytes held from about 30 KB of escape sequences.
[[sabotage]]
name = "a chunked kitty transmission accumulates without limit"
file = "src/term/graphics.cpp"
find = "\tif (qint64(transmission.data.size()) + data.size() > BSSH_MAX_TRANSMISSION_BYTES) {"
replace = "\tif (false) {"
expect = "a_chunked_transmission_cannot_grow_without_end"

# BSSH_MAX_IMAGE_PIXELS calls itself a bound "for any protocol" and
# guarded sixel alone. For kitty f=100 and iTerm2 the payload cap bounds
# the COMPRESSED bytes: a 2 KB solid PNG is 128 MB decoded, which the
# image store cannot reclaim because enforce_budget will not drop
# anything still on screen.
[[sabotage]]
name = "a small payload that decodes huge is placed anyway"
file = "src/term/graphics.cpp"
find = "\t\tif (qint64(image.width()) * qint64(image.height()) > BSSH_MAX_IMAGE_PIXELS) {\n\t\t\treturn result;\n\t\t}"
replace = "\t\tif (false) { return result; }"
expect = "a_small_payload_that_decodes_huge_is_refused"
