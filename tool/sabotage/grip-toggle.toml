# Sabotages for the Terminals list put away and brought back from a pane's
# grip with the right button (the holder, 2026-11-20).

# The right button does nothing on the grip.
[[sabotage]]
name = "the grip's right button does nothing"
file = "src/ui/pane_corner.cpp"
find = "\t\t\temit m_corner->grip_right_clicked();\n"
replace = ""
expect = "the_grips_right_button_toggles_the_terminals_list"

# The grip lets the right click through, and the terminal's menu opens
# over the list it just toggled.
[[sabotage]]
name = "the grip's right click opens the terminal menu too"
file = "src/ui/pane_corner.cpp"
find = "\tvoid contextMenuEvent(QContextMenuEvent *event) override { event->accept(); }\n"
replace = ""
expect = "the_grips_right_button_toggles_the_terminals_list"

# The window never hears of it.
[[sabotage]]
name = "a pane's grip cannot reach the Terminals list"
file = "src/ui/pane_container.cpp"
find = "\tconnect(view, &bssh_terminal_view::corner_grip_right_clicked,\n\t         this, &bssh_pane_container::terminals_panel_toggle_requested);\n"
replace = ""
expect = "the_grips_right_button_toggles_the_terminals_list"
