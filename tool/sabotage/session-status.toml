# Sabotages for what the notification and the tray say (sec 5.2): the one
# piece of UI a backgrounded app has. Seen on the Fold, 2026-11-05, with
# the server frozen: "1 session connected" for each attempt, "0" between.

# Counting a session that is only dialling.
[[sabotage]]
name = "a dialling session counts as connected"
file = "src/model/session_registry.cpp"
find = "if (session->state() == bssh_ssh_session::CONNECTED) ++connected;"
replace = "if (session->is_live()) ++connected;"
expect = "only_a_connected_session_counts_as_connected"

# Giving up or being told to stop moves the count with no state change.
[[sabotage]]
name = "the manager keeps its decision to itself"
file = "src/model/conn_manager.cpp"
find = "	emit reconnecting_changed();"
expect = "only_a_connected_session_counts_as_connected"

# The window told of a drop before the manager has decided: nothing connected
# and nothing coming, and on a phone the foreground service stopped for good.
[[sabotage]]
name = "a drop is announced before the manager has decided"
file = "src/model/session_registry.cpp"
find = "\tbssh_conn_manager *manager = new bssh_conn_manager(session, this);\n"
replace = "\tconnect(session, &bssh_session::state_changed, this, &bssh_session_registry::changed);\n\tbssh_conn_manager *manager = new bssh_conn_manager(session, this);\n"
expect = "only_a_connected_session_counts_as_connected"

# Out of attempts with the process let go: nothing is left to hear the
# network come back, and the outage ends the session.
[[sabotage]]
name = "giving up forgets the next network"
file = "src/model/conn_manager.cpp"
find = "\t\tm_waiting_for_network = true;\n"
replace = ""
expect = "giving_up_still_waits_for_the_network"

# Live is false between two attempts, so a dropped build host would let the
# computer sleep through the wait the option exists for.
[[sabotage]]
name = "keep awake lets go between two attempts"
file = "src/model/session_registry.cpp"
find = "if (session->profile().keep_awake && on_its_way(session)) return true;"
replace = "if (session->profile().keep_awake && session->is_live()) return true;"
expect = "only_a_connected_keep_awake_host_keeps_the_computer_awake"

# The retry dialling beside a connection already under way: two connections,
# two host key dialogs and two password prompts from one cold ssh:// link.
[[sabotage]]
name = "a due retry dials over a live session"
file = "src/model/conn_manager.cpp"
find = "\tif (m_session->is_live()) {\n\t\tset_reconnecting(false);\n\t\treturn;\n\t}\n"
replace = ""
expect = "a_retry_due_on_a_live_session_does_not_dial_again"

# Out of attempts, nothing dials; counted as connecting the notification said
# so for six hours on the Fold, and a laptop stayed awake for one dead server.
[[sabotage]]
name = "a session out of attempts is still on its way"
file = "src/model/session_registry.cpp"
find = "\treturn manager && manager->is_reconnecting();\n"
replace = "\treturn manager && (manager->is_reconnecting() || manager->is_waiting_for_network());\n"
expect = "a_session_out_of_attempts_is_waiting_and_not_connecting"

# Not counted at all: the service stops and nothing hears the network return.
[[sabotage]]
name = "a session out of attempts is not counted"
file = "src/model/session_registry.cpp"
find = "if (manager && manager->is_waiting_for_network() && !on_its_way(session)) ++waiting;"
replace = "Q_UNUSED(manager);"
expect = "a_session_out_of_attempts_is_waiting_and_not_connecting"

# A session being dialled by hand, still reported as waiting beside connecting.
[[sabotage]]
name = "a dialling session is also counted as waiting"
file = "src/model/session_registry.cpp"
find = "manager->is_waiting_for_network() && !on_its_way(session)"
replace = "manager->is_waiting_for_network()"
expect = "a_session_out_of_attempts_is_waiting_and_not_connecting"

# The words: a third count that never reaches the notification.
[[sabotage]]
name = "the waiting count is not said"
file = "src/platform/platform.cpp"
find = "\tif (waiting > 0) add(waiting, QStringLiteral(\"waiting to reconnect\"));\n"
replace = ""
expect = "session_status_says_what_is_connected_and_what_is_not"

# Counted but not held: on a phone the service stops, and nothing is left to
# hear the network come back.
[[sabotage]]
name = "residency forgets a session out of attempts"
file = "src/ui/main_window.cpp"
find = "\tplatform->set_keep_alive(connected + connecting + waiting > 0 || hidden);\n"
replace = "\tplatform->set_keep_alive(connected + connecting > 0 || hidden);\n"
expect = "a_session_out_of_attempts_keeps_the_process_resident"

# Asked as live: 0 between two attempts, so an upgrade's old program quits
# with the session it could not give (sec 8.4).
[[sabotage]]
name = "unfinished means live"
file = "src/model/session_registry.cpp"
find = "\treturn connected_count() + connecting_count() + waiting_count() > 0;\n"
replace = "\treturn live_count() > 0;\n"
expect = "only_a_connected_session_counts_as_connected"
