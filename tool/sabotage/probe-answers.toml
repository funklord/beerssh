# Sabotages for the two probes a client cannot get any other way.
#
# Both were found by reading the CONSUMER rather than this tree: the
# sibling qtty TUI probes for kitty graphics and reads DECRQM, and both
# answers were wrong in the same direction -- a feature this terminal
# has, reported as absent. Sec 7.1 calls that worse than silence,
# because a client takes the terminal at its word and falls back.

# kitty graphics has no terminfo capability and no DA parameter, so a=q
# is the ONLY way a client can learn the protocol is there. Unanswered,
# the query fell through to the transmit path and placed a 1x1 image.
[[sabotage]]
name = "the kitty graphics query goes unanswered"
file = "src/term/graphics.cpp"
find = "\tif (action == QStringLiteral(\"q\")) {\n\t\tresult.action = bssh_graphics_result_t::ACKNOWLEDGE;\n\t\tresult.id = controls.value(QStringLiteral(\"i\")).toInt();\n\t\treturn result;\n\t}"
replace = "\t(void)0;"
expect = "the_kitty_graphics_query_is_answered"

# And the answer itself, which is a separate line and a separate way to
# be wrong: recognising the query and replying nothing looks identical
# from inside this tree and identical to "unsupported" from outside it.
[[sabotage]]
name = "the query is recognised and not replied to"
file = "src/term/emulator_vterm.cpp"
find = "\t\treply(QByteArrayLiteral(\"\\x1b_Gi=\") + QByteArray::number(result.id)\n\t\t  + QByteArrayLiteral(\";OK\\x1b\\\\\"));"
replace = "\t\t(void)0;"
expect = "the_kitty_graphics_query_is_answered"

# 1049 is what a full-screen program uses to avoid destroying the user's
# scrollback. libvterm implements it and its DECRQM table stops at 1047,
# so the query answered "not recognised" while the mode worked.
[[sabotage]]
name = "DECRQM disowns the alternate screen"
file = "src/term/emulator_vterm.cpp"
find = "\t\treturn self->alt_screen ? 1 : 2;"
replace = "\t\treturn -1;"
expect = "decrqm_answers_for_the_alternate_screen"

# DA1 is the conventional place to advertise sixel, as parameter 4, and
# libvterm answers "?1;2c" and cannot say more -- so a client probing for
# sixel the standard way was told there was none. qtty reads DA1 for
# exactly that parameter and was compositing in half-blocks against a
# terminal that can draw pixels.
[[sabotage]]
name = "DA1 does not advertise sixel"
file = "src/term/emulator_vterm.cpp"
find = "\t\tself->reply(QByteArrayLiteral(\"\\x1b[?1;2;4c\"));"
replace = "\t\treturn 0;"
expect = "the_terminal_answers_for_itself_not_for_libvterm"

# And the pair sec 7.1 insists on: the claim goes away when the feature
# does. DA1 is the one advertisement here that is a positive claim rather
# than an answer to a direct question, so it is the one most able to
# outlive what it claims.
[[sabotage]]
name = "DA1 claims sixel after sixel is switched off"
file = "src/term/emulator_vterm.cpp"
find = "\t\tif (!self->features.enabled(bssh_term_features_t::SIXEL)) return 0;"
replace = "\t\t(void)0;"
expect = "the_terminal_answers_for_itself_not_for_libvterm"

# XTVERSION named the library rather than the program the user ran, which
# is precisely what XTVERSION exists to prevent.
[[sabotage]]
name = "XTVERSION answers for libvterm"
file = "src/term/emulator_vterm.cpp"
find = "\tif (command == 'q' && lead == \">\") {"
replace = "\tif (false) {"
expect = "the_terminal_answers_for_itself_not_for_libvterm"

# The opposite direction: a feature this terminal LACKS reported as in
# force. The kitty keyboard query echoed whatever flags had been pushed,
# so a program that asked for all five was told it had key-release
# events and every key as an escape code.
[[sabotage]]
name = "a kitty push keeps flags this terminal does not implement"
file = "src/term/emulator_vterm.cpp"
find = "\t\t\tconst int flags = (argcount > 0 ? int(args[0]) : 0) & BSSH_KITTY_SUPPORTED_FLAGS;\n\n\t\t\t/*"
replace = "\t\t\tconst int flags = argcount > 0 ? int(args[0]) : 0;\n\n\t\t\t/*"
expect = "the_kitty_query_reports_only_the_flags_in_force"

[[sabotage]]
name = "a kitty set keeps flags this terminal does not implement"
file = "src/term/emulator_vterm.cpp"
find = "\t\t\tconst int flags = (argcount > 0 ? int(args[0]) : 0) & BSSH_KITTY_SUPPORTED_FLAGS;\n\t\t\tconst int mode"
replace = "\t\t\tconst int flags = argcount > 0 ? int(args[0]) : 0;\n\t\t\tconst int mode"
expect = "the_kitty_query_reports_only_the_flags_in_force"
