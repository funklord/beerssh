# Kinetic touch scrolling in the terminal (sec 6.4).
#
# The table there gives touch "kinetic touch scroll (QScroller)" and the
# widget had none. A phone has no wheel and no Shift+PageUp, so the only
# way into the scrollback was dragging a scrollbar a few pixels wide, on
# the one platform where a few-pixel target is unusable -- and reviewing
# output that has gone past is most of what a terminal is for.
#
# The wheel handler's own comment promised this in the future tense:
# "Touch (QScroller, sec 6.4) WILL drive the same set_scroll_offset
# rather than growing a second scrolling path." Nothing did.

# The gesture. Without it nothing ever sends the widget a scroll event,
# and every assertion about the conversion below is about code no finger
# can reach -- a working engine with nothing connected to the pedal.
[[sabotage]]
name = "no gesture is grabbed, so nothing scrolls"
file = "src/ui/terminal_view.cpp"
find = "\tQScroller::grabGesture(this, QScroller::TouchGesture);"
replace = "\t(void)0;"
expect = "a_finger_can_reach_the_scrollback"

# The half a scroller cannot work without: a plain widget has to say how
# far the content goes. Report no range and the scroller has nowhere to
# travel, so a flick moves nothing while every other part still looks
# correct.
[[sabotage]]
name = "the widget reports no scrollable range"
file = "src/ui/terminal_view.cpp"
find = "\t\tprepare->setContentPosRange(QRectF(0, 0, 0, qreal(history) * cell));"
replace = "\t\tprepare->setContentPosRange(QRectF(0, 0, 0, 0));"
expect = "a_finger_can_reach_the_scrollback"

# The axis. The offset counts lines BACK from the live screen while the
# scroller counts pixels DOWN from the top of the history, so the two run
# opposite ways. Getting this backwards is the plausible mistake, and it
# swaps the two endpoints while leaving everything compiling.
[[sabotage]]
name = "the scroll axis is inverted"
file = "src/ui/terminal_view.cpp"
find = "\t\tset_scroll_offset(history - from_top);"
replace = "\t\tset_scroll_offset(from_top);"
expect = "a_finger_can_reach_the_scrollback"

# And the scale, which neither endpoint can catch: a conversion off by a
# factor still lands on live and on the far end correctly, and puts every
# flick in between somewhere wrong. This is what the midpoint assertion
# is for.
[[sabotage]]
name = "the pixel to line scale is wrong in the middle"
file = "src/ui/terminal_view.cpp"
find = "\t\tconst int from_top = qRound(scroll->contentPos().y() / cell);"
replace = "\t\tconst int from_top = qRound(scroll->contentPos().y() / (cell * 2));"
expect = "a_finger_can_reach_the_scrollback"
