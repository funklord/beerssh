# Sabotages for sec 8.4's drop plan: what a pane draws during a drag is
# what the release does. Each names the test that must notice.

# The fold gone: an arrival into a window at its pane cap is drawn as a
# split, and the drop cannot make a pane there is no room for.
[[sabotage]]
name = "a side into a full window is drawn as a split"
file = "src/ui/main_window.cpp"
find = "\tif (new_pane && !m_layout->room_to_split(target, edge)) return folded;\n"
replace = ""
expect = "the_zone_drawn_is_what_the_drop_does"

# The column's fold gone: left and right drawn as halves in a column that
# stacks its panes whatever the tree says.
[[sabotage]]
name = "left and right in the column are drawn as halves"
file = "src/ui/main_window.cpp"
find = "\tif (m_layout->arrangement() == layout::COLUMN\n\t    && (edge == layout::EDGE_LEFT || edge == layout::EDGE_RIGHT))\n\t\treturn folded;\n"
replace = ""
expect = "the_zone_drawn_is_what_the_drop_does"

# The pane being carried lights zones it will not honour.
[[sabotage]]
name = "the pane being carried lights its zones"
file = "src/ui/main_window.cpp"
find = "\tif (own && m_layout->tabs(session).size() < 2) return BSSH_DROP_CANCEL;\n"
replace = ""
expect = "the_zone_drawn_is_what_the_drop_does"

# The pane draws the zone under the pointer rather than the window's plan.
[[sabotage]]
name = "the pane draws the geometry, not the plan"
file = "src/ui/terminal_view.cpp"
find = "\tconst int plan = m_drop_planner ? m_drop_planner(event->mimeData(), edge) : edge;"
replace = "\tconst int plan = edge;"
expect = "the_zone_drawn_is_what_the_drop_does"

# A swap across windows only half happens: the arrival takes the slot and
# the target stays in the window it was in, as a tab.
[[sabotage]]
name = "a swap across windows leaves the target behind"
file = "src/ui/main_window.cpp"
find = '''
		source->exchange_session(session, target);
		exchange_session(target, session);'''
replace = '''
		exchange_session(target, session);'''
expect = "the_zone_drawn_is_what_the_drop_does"

# Detaching before placing: the forget takes the outgoing leaf, and the
# arrival lands in the list with no pane -- the fault this order fixed.
[[sabotage]]
name = "the exchange detaches before it places"
file = "src/ui/main_window.cpp"
find = '''
	wire_session(in);
	if (m_layout->intent().contains(out))'''
replace = '''
	wire_session(in);
	if (m_current == out) detach_session();
	if (m_layout->intent().contains(out))'''
expect = "the_zone_drawn_is_what_the_drop_does"

# A drop on a window off the tab row refused rather than accepted doing
# nothing: under QDrag the source then tears a window out over this one.
[[sabotage]]
name = "a drop off the tab row is refused"
file = "src/ui/main_window.cpp"
find = "\tif (bssh_session *front = tab_row_at(event->position().toPoint()))\n\t\tdrop_session_as_tab(session, front, -1);\n\tevent->acceptProposedAction();\n"
replace = "\tif (bssh_session *front = tab_row_at(event->position().toPoint())) {\n\t\tdrop_session_as_tab(session, front, -1);\n\t\tevent->acceptProposedAction();\n\t}\n"
expect = "a_dragged_tab_lands_where_it_is_dropped"

# The slot ignored: every tab-row drop goes to the end, whatever was marked.
[[sabotage]]
name = "a tab-row drop ignores the slot it marked"
file = "src/ui/main_window.cpp"
find = "\tm_layout->add_tab(session, front, slot < 0 ? INT_MAX : slot);\n"
replace = "\tm_layout->add_tab(session, front, INT_MAX);\n"
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# No strip where the bar would be: with no bar, nothing can make a tab.
[[sabotage]]
name = "a window with no bar shows no strip to drop on"
file = "src/ui/main_window.cpp"
find = "\t\tconst bool strip = !bar || bar->isHidden();\n"
replace = "\t\tconst bool strip = !bar || bar->isHidden();\n\t\tif (strip) continue;\n"
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# The window's only pane offered a slot on its own row: a mark drawn for a
# drop that does nothing.
[[sabotage]]
name = "the only pane is offered a tab slot"
file = "src/ui/main_window.cpp"
find = "\tif (session && tabs == QList<bssh_session *>{ session }) return -1;\n"
replace = ""
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# A tab-row drop SHOWN rather than made a tab: the old single-pane path,
# which put the arrival in the panes and the pane in the bar.
[[sabotage]]
name = "a drop on the tab row is shown instead of tabbed"
file = "src/ui/main_window.cpp"
find = "\tif (!front || !m_layout->sessions().contains(front) || front == session) {\n"
replace = "\tif (true) {\n"
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# A tab-row drop that does nothing, refused: the source tears out a window.
[[sabotage]]
name = "a do-nothing drop on the tab row is refused"
file = "src/ui/main_window.cpp"
find = '''
		hover(-1, -1);
		event->acceptProposedAction();
		if (slot >= 0 && dropped) dropped(event->mimeData(), slot);'''
replace = '''
		hover(-1, -1);
		if (slot >= 0) event->acceptProposedAction();
		if (slot >= 0 && dropped) dropped(event->mimeData(), slot);'''
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# The mark mapped with mapFrom() between widgets neither of which is the
# other's ancestor: the slot is right and its mark is drawn nowhere.
[[sabotage]]
name = "the tab slot's mark is mapped by the wrong ancestry"
file = "src/ui/main_window.cpp"
find = "\t\tconst QPoint in_overlay = overlay->mapFromGlobal(bar->mapToGlobal(edge));\n"
replace = "\t\tconst QPoint in_overlay = overlay->mapFrom(bar, edge);\n"
expect = "the_tab_row_takes_a_drop_at_the_slot_it_marks"

# The process no longer checked: another BeerSSH's index is resolved here,
# and moves one of this process's sessions -- defect 1.
[[sabotage]]
name = "a payload from another process is resolved here"
file = "src/ui/terminal_view.cpp"
find = "\tif (!pid_ok || !index_ok || pid != QCoreApplication::applicationPid()) {"
replace = "\tif (!index_ok) {"
expect = "a_drop_from_another_process_is_refused"

# A foreign drop ignored rather than answered with a link: the source reads
# it as a release over nothing and tears a window out over this one. The
# window is the one place that answers -- panes and the tab row ignore it
# and Qt hands it up -- so this is the answer to break.
[[sabotage]]
name = "a window ignores a foreign drop instead of linking it"
file = "src/ui/main_window.cpp"
find = """
	if (!foreign || !(event->possibleActions() & Qt::LinkAction)) return foreign;
	event->setDropAction(Qt::LinkAction);
	event->accept();
	return true;"""
replace = """
	if (!foreign || !(event->possibleActions() & Qt::LinkAction)) return foreign;
	event->ignore();
	return true;"""
expect = "a_drop_from_another_process_is_refused"
