# Sabotages for the chain from a key event to the wire.
#
# The most fundamental thing a terminal does, and nothing asserted it end
# to end. The input router had thirty-two tests -- keys in, bytes out,
# every modifier and both keyboard protocols -- and the transport had a
# test calling send() on the fake and checking the fake recorded it,
# whose comment called itself "the seam the input router gets tested
# through" while containing no router, no view and no key event.
#
# Found with the search key the sibling qtty derived from three of its
# own faults: the parse being right is what hides the delivery being
# wrong, because the parse is the half that is easy to assert. Find the
# exhaustively-tested translator, then ask what carries its output and
# whether anything asserts the carrying.

# The view's end: no router attached, so nothing translates.
[[sabotage]]
name = "the pane is never given a router"
file = "src/ui/pane_container.cpp"
find = "\tview->attach_input_router(session->input_router());"
replace = "\t(void)0;"
expect = "a_keystroke_in_a_pane_reaches_the_wire"

# The session's end: the bytes are produced and never handed to the
# transport. This is the half that a test reading the emulator's own
# output buffer would miss entirely -- and every mouse-report test in
# this tree reads exactly that.
[[sabotage]]
name = "what the emulator produced never reaches the transport"
file = "src/model/session.cpp"
find = "\t\tif (!reply.isEmpty()) send_out(reply);"
replace = "\t\t(void)reply;"
expect = "a_keystroke_in_a_pane_reaches_the_wire"

# The mouse takes a different route to the same wire: a key goes view,
# router, emulator, while a click goes view, emulator directly. Only the
# tail is shared, so breaking the click's own leg leaves the keystroke
# case green.
#
# Added BESIDE the existing mouse tests rather than by widening them.
# Those read the emulator's own output buffer, so they pass whether or
# not anything carries the bytes -- and they are a measurement of where
# this suite's attention was. Widen them and nobody can tell they never
# asserted delivery; the record is worth more than the coverage, and the
# coverage can be added without losing it.
[[sabotage]]
name = "a click is encoded and never sent"
file = "src/ui/terminal_view.cpp"
find = "\t\t\tm_emulator->send_mouse_move(screen_row_for_line(line), col, 0);\n\t\t\tm_emulator->send_mouse_button(button, true, 0);"
replace = "\t\t\tm_emulator->send_mouse_move(screen_row_for_line(line), col, 0);"
expect = "a_mouse_report_reaches_the_wire"

# The legacy fallback emits CSI u again.
#
# Restores the state measured on 2026-09-21: a character with no control
# byte -- a comma, a digit -- reaching a shell that never enabled a
# keyboard protocol as ESC [ 44 ; 5 u, which is text on its command line.
# Nothing else changes, which is what made it live this long: every
# modern-protocol test still passes, because the modern path is not the
# one at fault.
[[sabotage]]
name = "ctrl on a key with no control byte goes back to CSI u"
file = "src/term/emulator_vterm.cpp"
find = "\tif (modifiers & MOD_CTRL) {\n\t\tconst quint8 without_ctrl = quint8(modifiers & ~MOD_CTRL);"
replace = "\tif (false) {\n\t\tconst quint8 without_ctrl = quint8(modifiers & ~MOD_CTRL);"
expect = "ctrl_punctuation_reaches_a_legacy_shell_as_a_vt100_would"

# Connection Details (sec 5.3) counts what the link carried, so it can
# tell a silent server from keys that never left. A count that stays at
# zero says "nothing was sent" about a session that sent everything.
[[sabotage]]
name = "what goes out is sent and not counted"
file = "src/model/session.cpp"
find = "\tm_bytes_out += bytes.size();\n"
replace = ""
expect = "connection_details_say_what_the_link_carried"

[[sabotage]]
name = "a locked Ctrl is not reported"
file = "src/model/session.cpp"
find = "\t\t\telse if (state == bssh_input_router::MODIFIER_LOCKED)\n"
replace = "\t\t\telse if (false)\n"
expect = "connection_details_say_what_the_link_carried"
