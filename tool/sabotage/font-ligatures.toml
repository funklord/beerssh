# Font ligatures in the terminal (project.md sec 9.2): off by default,
# because a ligature draws two characters as one shape while the grid
# counts two columns, and on for the user who wants them. None of these
# failures is an error -- a grid that cannot turn ligatures off, a setting
# that never reaches the grid, or a default that ships them on.
#
# All three seen to fail 2026-09-18 against a 572-passing baseline. The
# feature and its tests need Qt 6.7's per-font feature control; on the
# older CI Qt they QSKIP, and the sabotages are no-ops there rather than
# false passes, because make_font sets no features at all below 6.7.

# make_font ignores the ligatures argument and always disables them.
#
# The escape for a user who wants ligatures stops working: the grid pins
# the features off whatever it is asked for.
[[sabotage]]
name = "make_font ignores the ligatures argument"
file = "src/term/font_catalog.cpp"
find = "\tif (!ligatures) {"
replace = "\tif (false && !ligatures) {"
expect = "ligatures_are_off_by_default_and_optional"

# The view stops passing the device default to make_font.
#
# make_font still honours its argument, but the view hands it a constant,
# so the setting reaches the store and not the grid -- the setting-applied-
# to-nothing shape this tree keeps re-finding, which only the wiring test
# sees.
[[sabotage]]
name = "a view stops reading the ligature default"
file = "src/ui/terminal_view.cpp"
find = "\t        bssh_font_catalog::instance().family_for(m_font_id), font_point_size(),\n\t        default_font_ligatures());"
replace = "\t        bssh_font_catalog::instance().family_for(m_font_id), font_point_size(),\n\t        false);"
expect = "a_view_builds_its_font_with_the_ligature_default"

# Ligatures ship on by default.
#
# Sec 9.2 argues the default off: a selection that lands mid-glyph and a
# search that highlights half of "!=". Flip it and every grid draws them
# until the user finds the setting.
[[sabotage]]
name = "ligatures are on by default"
file = "src/model/app_settings.cpp"
find = "value(QStringLiteral(\"appearance/font_ligatures\"), false)"
replace = "value(QStringLiteral(\"appearance/font_ligatures\"), true)"
expect = "the_ligatures_setting_survives_a_restart"

# The substitution goes back to being silent.
#
# Restores the state found on 2026-09-21: the note is written, the view
# hands it on, and no window reads it -- so a host whose font is not on
# this device renders in a substitute with no explanation. Everything
# about the FONT still works, which is what kept it invisible: the
# fallback chain is correct, the picker marks unavailable families, and
# only the sentence explaining what happened goes unread.
[[sabotage]]
name = "a substituted font says nothing"
file = "src/ui/main_window.cpp"
find = "\tif (!m_font_note.isEmpty()) session_text += QStringLiteral(\" -- \") + m_font_note;"
replace = ""
expect = "a_substituted_font_says_so_somewhere_a_user_looks"

# The note is computed once and never refreshed.
#
# The id comparison is what makes asking in update_status affordable;
# pinning it to the first answer means a session that changes font keeps
# the note it had -- including keeping an empty one forever, which is
# the silent case again by a subtler route.
[[sabotage]]
name = "the note is never recomputed after the first font"
file = "src/ui/main_window.cpp"
find = "\tif (font_id != m_font_note_id) {"
replace = "\tif (m_font_note_id.isEmpty() && !font_id.isEmpty()) {"
expect = "a_substituted_font_says_so_somewhere_a_user_looks"
