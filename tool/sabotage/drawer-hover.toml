# Sabotages for the tmux handle and the pane grip on the desktop
# (project.md sec 10.2a, sec 12.3x): the handle shows under the pointer,
# as the grip does, and the grip sits clear of the scrollbar.

# The closed handle on every terminal, all the time.
[[sabotage]]
name = "the handle shows with nothing pointing at it"
file = "src/ui/terminal_view.cpp"
find = "\tm_mux_drawer->setVisible(m_mux_drawer->is_open() || m_pointer_inside || touch);\n"
replace = "\tm_mux_drawer->setVisible(true);\n"
expect = "the_tmux_handle_shows_under_the_pointer_and_the_grip_clears_the_scrollbar"

# The grip against the view's edge again, under the scrollbar.
[[sabotage]]
name = "the grip sits under the scrollbar"
file = "src/ui/terminal_view.cpp"
find = "\tconst int right = width() - (m_scrollbar && m_scrollbar->isVisible() ? m_scrollbar->width() : 0);\n\treturn QRect(right - side - 3, 3, side, side);\n"
replace = "\tconst int right = width();\n\treturn QRect(right - side - 3, 3, side, side);\n"
expect = "the_tmux_handle_shows_under_the_pointer_and_the_grip_clears_the_scrollbar"
