# Sabotages for sec 6.4's dropped files: copied to where the shell is, by
# SFTP or locally, never over what is there, and never to the wrong host.
#
# The view's own branch -- local files go to the window as files, not as a
# paste -- has no entry: Qt swallows a synthetic QDropEvent, so no test
# reaches dropEvent (terminal_view_test records the measurement), and the
# window is driven from the signal instead.

# A taken name used as it is: the copy replaces what was there.
[[sabotage]]
name = "a dropped file replaces one of the same name"
file = "src/ssh/working_directory.cpp"
find = "\tif (!taken(name)) return name;\n"
replace = "\treturn name;\n"
expect = "a_local_copy_keeps_both_when_a_name_is_taken"

# A shell connected onward is offered the copy anyway, to the wrong host.
[[sabotage]]
name = "a copy is offered from a tab running ssh onward"
file = "src/ui/main_window.cpp"
find = "\tif (found.elsewhere) {\n\t\tcopy = menu->addAction("
replace = "\tif (false) {\n\t\tcopy = menu->addAction("
expect = "dropped_files_are_copied_where_the_shell_is"

# OSC 7 ignored: a remote with no /proc always gets the home directory.
[[sabotage]]
name = "the shell's own report of its directory is ignored"
file = "src/model/session.cpp"
find = "\t\tif (found.path.isEmpty() && !found.elsewhere && m_emulator)\n"
replace = "\t\tif (false)\n"
expect = "dropped_files_are_copied_where_the_shell_is"

# The local copy never checks whether it was asked to stop.
[[sabotage]]
name = "a local copy cannot be stopped"
file = "src/ssh/working_directory.cpp"
find = "\t\t\tif (stopped && stopped()) {\n"
replace = "\t\t\tif (false) {\n"
expect = "a_local_copy_can_be_stopped"

# No way to stop a copy under way from the terminal menu.
[[sabotage]]
name = "the terminal menu offers no way to stop a copy"
file = "src/ui/main_window.cpp"
find = "\tif (m_current && m_current->upload_in_progress()) {\n"
replace = "\tif (false) {\n"
expect = "dropped_files_are_copied_where_the_shell_is"

# A session moved to another process with a copy still running on its
# connection: the copy's next piece goes into a stream it no longer owns.
# Its test is live, so run this one with check-ssh as the suite.
[[sabotage]]
name = "a session is moved with a copy running"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\tif (m_upload) {\n\t\twhy = QStringLiteral(\"a copy is still running"
replace = "\tif (false) {\n\t\twhy = QStringLiteral(\"a copy is still running"
expect = "a_session_copying_a_file_is_not_moved_to_another_process"

# The local shell moved with its copy still running on a thread of this
# process, which may end once it has given the session away.
[[sabotage]]
name = "a local session is moved with a copy running"
file = "src/ssh/pty_session.cpp"
find = "\tif (m_copying) {\n"
replace = "\tif (false) {\n"
expect = "a_local_session_copying_a_file_is_not_moved"

# A local session closed mid-copy returns at once, leaving the copy to
# run on unwatched -- and a quit kills it with half a file written.
[[sabotage]]
name = "a closed local session does not wait for its copy"
file = "src/ssh/pty_session.cpp"
find = "\t\tm_copier->wait();\n"
replace = ""
expect = "a_closed_local_session_leaves_no_half_copied_file"

# A disconnect asked for mid-copy leaves the half-written file on the
# remote, though the connection was still there to remove it over.
# Its test is live, so run this one with check-ssh as the suite.
[[sabotage]]
name = "a disconnect leaves the half-written remote file"
file = "src/ssh/ssh_session_libssh.cpp"
find = "\t\tif (m_session && ssh_is_connected(m_session)) drop_partial_upload();\n"
replace = ""
expect = "a_copy_cut_off_by_a_disconnect_says_so"
