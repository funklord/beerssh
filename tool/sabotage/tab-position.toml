# The tab bar on the side it is set to (project.md sec 8.7: the holder
# asked for tabs top, bottom, left or right).

# Set to the left, and it goes back above the panes.
[[sabotage]]
name = "a bar set to the left stays above the panes"
file = "src/ui/pane_container.cpp"
find = "\tcase Qt::LeftEdge:   direction = QBoxLayout::LeftToRight; break;\n"
replace = ""
expect = "the_tab_bar_goes_where_it_is_set"

# Beside the panes, but still drawn facing up.
[[sabotage]]
name = "a bar on the left keeps its horizontal shape"
file = "src/ui/pane_bar.cpp"
find = "\tcase Qt::LeftEdge:   m_bar->setShape(QTabBar::RoundedWest); break;\n"
replace = ""
expect = "the_tab_bar_goes_where_it_is_set"

# A drop aimed down the side misses a bar that is there.
[[sabotage]]
name = "a drop down a side bar is not on the bar"
file = "src/ui/main_window.cpp"
find = "\t\tif (bar->rect().contains(bar->mapFrom(this, at))) return bar->front();\n"
replace = "\t\tif (bar->tab_bar()->rect().contains(bar->tab_bar()->mapFrom(this, at))) return bar->front();\n"
expect = "the_tab_bar_goes_where_it_is_set"

# Down the side, the tabs straight in the bar again, not in the scroll
# area: thirty tabs make the pane, and so the window, taller than itself.
[[sabotage]]
name = "tabs down the side stretch the window"
file = "src/ui/pane_bar.cpp"
find = "\t\trow->addWidget(m_scroll, 1);\n"
replace = "\t\trow->addWidget(m_bar, 0);\n"
expect = "tabs_down_the_side_scroll_and_read_across"

# The label laid out on its side again, as QTabBar's West draws it.
[[sabotage]]
name = "tabs down the side are written on their side"
file = "src/ui/pane_bar.cpp"
find = "\t\tout.transpose();\n"
replace = ""
expect = "tabs_down_the_side_scroll_and_read_across"

# The wheel left to QTabBar, which switches tabs with it.
[[sabotage]]
name = "the wheel switches side tabs instead of scrolling them"
file = "src/ui/pane_bar.cpp"
find = "\tif (type == QEvent::Wheel && m_scroll) {"
replace = "\tif (false) {"
expect = "tabs_down_the_side_scroll_and_read_across"

# No scroller on touch: the side tabs past the pane's height cannot be
# reached by a thumb.
[[sabotage]]
name = "a thumb cannot scroll the side tabs"
file = "src/ui/pane_bar.cpp"
find = "\t\tif (m_dragging) m_scroll->verticalScrollBar()->setValue(m_drag_value - along);\n"
replace = ""
expect = "side_tabs_take_a_tap_and_a_swipe_on_touch"

# Side tabs at the style's own height on touch: about 27dp, short of the
# 48dp a thumb needs (sec 6.2).
[[sabotage]]
name = "side tabs are short on touch"
file = "src/ui/pane_bar.cpp"
find = "new pane_tab_style(true, pointer ? 0 : BSSH_TOUCH_TARGET_DP)"
replace = "new pane_tab_style(true, 0)"
expect = "side_tabs_take_a_tap_and_a_swipe_on_touch"

# The same along the top.
[[sabotage]]
name = "top tabs are short on touch"
file = "src/ui/pane_bar.cpp"
find = "new pane_tab_style(false, BSSH_TOUCH_TARGET_DP)"
replace = "new pane_tab_style(false, 0)"
expect = "side_tabs_take_a_tap_and_a_swipe_on_touch"

# A rebuilt side list left at its top: a tab picked far down comes back
# scrolled out of sight.
[[sabotage]]
name = "a side list opens away from its front tab"
file = "src/ui/pane_bar.cpp"
find = "\t\t\tm_scroll->ensureVisible(centre.x(), centre.y(), 0, front.height() / 2 + 1);\n"
replace = "\t\t\t(void) centre;\n"
expect = "tabs_down_the_side_scroll_and_read_across"

# A swipe that starts on a tab leaves the bar marking it: the press's pick is not
# undone when the finger turns out to be scrolling.
[[sabotage]]
name = "a swipe from a side tab marks it"
file = "src/ui/pane_bar.cpp"
find = "\t\t\tif (m_bar->currentIndex() != m_drag_front) m_bar->setCurrentIndex(m_drag_front);\n\t\t\tm_pending.clear();\n"
replace = ""
expect = "side_tabs_take_a_tap_and_a_swipe_on_touch"

# The front tab brought into view only once, at the list's first size: a
# list that shrinks later -- the keyboard coming up -- loses it.
[[sabotage]]
name = "a side list keeps its front tab in view only once"
file = "src/ui/pane_bar.cpp"
find = "\t    && !m_scrolled_by_hand) {\n"
replace = "\t    && !m_scrolled_by_hand) {\n\t\tm_scrolled_by_hand = true;\n"
expect = "tabs_down_the_side_scroll_and_read_across"

# The corner's tmux, tabs and menus buttons at their own height on touch:
# 24dp, short of a thumb.
[[sabotage]]
name = "the corner's buttons are short on touch"
file = "src/ui/pane_corner.cpp"
find = "\t\t\tbutton->setMinimumHeight(BSSH_TOUCH_TARGET_DP);\n"
replace = "\t\t\t(void) button;\n"
expect = "a_touch_windows_pane_controls_reach_the_floor"

# A tab's close button at the style's own 20dp on touch.
[[sabotage]]
name = "a tab's close button is short on touch"
file = "src/ui/pane_bar.cpp"
find = "\t\t\treturn m_least_height;\n"
replace = "\t\t\treturn QProxyStyle::pixelMetric(metric, option, widget);\n"
expect = "a_touch_windows_pane_controls_reach_the_floor"

# The style on the bar only: the close buttons Qt made keep the app's.
[[sabotage]]
name = "the close buttons miss the tab style"
file = "src/ui/pane_bar.cpp"
find = "\t\t\t\tbutton->setStyle(m_tab_style);\n"
replace = ""
expect = "a_touch_windows_pane_controls_reach_the_floor"

# The bar's handle at its own size on touch: about 22dp across.
[[sabotage]]
name = "the bar's handle is small on touch"
file = "src/ui/pane_bar.cpp"
find = "new bar_handle(this, vertical, pointer ? 0 : BSSH_TOUCH_TARGET_DP)"
replace = "new bar_handle(this, vertical, 0)"
expect = "a_touch_windows_pane_controls_reach_the_floor"
