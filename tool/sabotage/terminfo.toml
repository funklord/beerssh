# The terminfo database a platform ships reaching the child that needs it
# (project.md sec 12.3p). Android has no terminfo at all, so a local
# shell there is handed TERM=xterm-256color naming an entry nothing on
# the device can look up.
#
# Two edits, because the mechanism has two halves and either alone is
# silent: the environment variable the child is given, and the platform
# answer the factory asks for. Neither failure produces an error -- the
# shell simply goes on not finding a terminfo, exactly as it did before
# any of this existed, which is the shape sec 12.3p was written about.

# The setenv between fork and exec. One line, and the whole feature.
#
# It sets the WRONG NAME rather than being switched off, which models
# the failure that actually happens -- wiring that exists and reaches
# the wrong place -- and keeps `terminfo` used, so the edit compiles
# rather than being refused for an unused local.
#
# Seen to fail: 544 passed, 1 failed, and the one is the test named
# below.
[[sabotage]]
name = "the child is never told where the terminfo database is"
file = "src/ssh/pty_session.cpp"
find = "\t\tif (!terminfo.isEmpty()) setenv(\"TERMINFO\", terminfo.constData(), 1);"
replace = "\t\tif (!terminfo.isEmpty()) setenv(\"TERMINFO_X\", terminfo.constData(), 1);"
expect = "a_shipped_terminfo_reaches_the_shell"

# THE FACTORY HALF IS GUARDED SINCE 2026-09-22, and the paragraph this
# replaces is worth keeping in the commit that removed it: it said the
# half was untestable, because create_local() asks the platform for the
# directory and the desktop platform returns empty BY DESIGN -- so a
# factory that asks correctly and one that never asks produce the same
# empty answer. It ended "what would close it is a platform test double,
# which this tree does not have".
#
# It needed one ANSWER forced rather than a whole double.
# bssh_platform::force_terminfo_directory() is the same seam
# force_touch_primary() has been since sec 6.2, and with it a test can
# watch the factory carry a directory the platform was told to give.
#
# Which is this file's own lesson about an untestable condition: the
# differences are usually smaller than the label, and a recorded
# impossibility is worth re-reading whenever the fixture grows.

# The factory stops asking the platform.
#
# The setter still works and the environment half above still passes, so
# everything a desktop could previously see is unchanged; what goes is
# the one call that puts the shipped database in front of a local shell
# on a device that has no other one.
[[sabotage]]
name = "the local factory never asks for the terminfo directory"
file = "src/ssh/pty_session.cpp"
find = "\t\tsession->set_terminfo_directory(platform->terminfo_directory());"
replace = ""
expect = "the_factory_asks_the_platform_for_the_terminfo_directory"

# THE SENTINEL IS NOT GUARDED EITHER, and this is the same shape as the
# paragraph above one level in, which is why it is written down rather
# than left as a spec that reports MISSED.
#
# force_terminfo_directory() tests isNull rather than isEmpty, because
# EMPTY is a real answer -- the desktop's own, meaning "say nothing".
# Swap isNull for isEmpty and forcing the empty answer silently stops
# working: the call falls through to the platform, which on a DESKTOP
# answers empty as well. The two paths produce the same value here, so
# the sabotage was written, run, and came back MISSED for the reason the
# whole entry is about.
#
# It is observable where the platform's own answer is NOT empty, which
# is Android -- the one platform this suite cannot run on. Recorded
# rather than shipped, per this file's own rule.
