# beersshd's protections (project.md sec 19), each broken the way it
# would plausibly break, and each caught by a test that drives the
# server with OpenSSH's own clients or asks the root directly.

# The containment check accepts everything: what is left is the lexical
# clamp, which "/../.." cannot get past and a symlink walks straight
# through.
[[sabotage]]
name = "a resolved path outside the root is accepted"
file = "src/sshd/root_path.cpp"
find = "\treturn real == m_root || real.startsWith(m_root + '/');"
replace = "\treturn true;"
expect = "nothing_outside_the_root_is_reachable_over_the_wire"

# A leaf that is a symlink is not followed to see where it lands, so
# creating at a dangling link would make a file wherever it points.
[[sabotage]]
name = "a symlink leaf is used without checking its target"
file = "src/sshd/root_path.cpp"
find = "\t\tif (target.isEmpty() || !contains(target)) {"
replace = "\t\tif (false) {"
expect = "a_symlink_out_of_the_root_is_not_followed"

# Any key that signs logs in -- the list is never consulted.
[[sabotage]]
name = "a key is accepted without looking it up"
file = "src/sshd/sshd.cpp"
find = "\tif (!authorized(connection->owner->config().authorized_keys_path, key)) return SSH_AUTH_DENIED;"
replace = ""
expect = "only_a_listed_key_logs_in"

# The subsystem ends with no exit status. scp counts a session that ends
# without one as a failed remote side, and exits 1 after delivering the
# file intact.
[[sabotage]]
name = "a finished subsystem sends no exit status"
file = "src/sshd/sshd.cpp"
find = "\t\t\tssh_channel_request_send_exit_status(connection->channel, 0);"
replace = ""
expect = "scp_finishes_with_a_clean_exit"

# The connection is dropped the moment the channel ends, before the
# client can hang up itself.
[[sabotage]]
name = "a finished connection disconnects without waiting for the client"
file = "src/sshd/sshd.cpp"
find = "\t\tconst auto deadline = std::chrono::steady_clock::now() + HANGUP_GRACE;"
replace = "\t\tconst auto deadline = std::chrono::steady_clock::now();"
expect = "scp_finishes_with_a_clean_exit"

# The Android window (sec 19), over the platform the test controls.

# Start no longer asks whether storage may be reached; a disabled
# button is not the only way in.
[[sabotage]]
name = "the window starts without storage access"
file = "src/sshd/sshd_keeper.cpp"
find = "\tif (!m_platform->has_storage_access() || address.isNull()) {"
replace = "\tif (address.isNull()) {"
expect = "without_access_it_asks_and_does_not_start"

# Losing Wi-Fi stops a server the user switched on, which is to be reachable
# again when the phone is back (sec 19.6).
[[sabotage]]
name = "losing Wi-Fi stops the server"
file = "src/sshd/sshd_keeper.cpp"
find = "\tif (now.isNull()) return;\n"
replace = ""
expect = "losing_wifi_waits_and_a_new_address_restarts"

# Android's time limit arrives and nothing stops.
[[sabotage]]
name = "the time limit is ignored"
file = "src/sshd/sshd_keeper.cpp"
find = "\t\tm_held_by_system = true;\n\t\tstop();\n"
replace = "\t\tm_held_by_system = true;\n"
expect = "the_time_limit_stops_the_server_and_says_why"

# Start no longer asks to show the notification, so on Android 13+ the
# one sign that the phone is serving files stays hidden.
[[sabotage]]
name = "Start does not ask to show the notification"
file = "src/sshd/sshd_keeper.cpp"
find = "\tm_platform->request_notifications();"
replace = ""
expect = "it_serves_the_platform_root_on_the_platform_address"

# The file overwrites keys the user has typed and not saved.
[[sabotage]]
name = "reloading the keys discards unsaved edits"
file = "src/sshd/sshd_window.cpp"
find = "\tif (m_keys->document()->isModified()) return;"
replace = ""
expect = "the_keys_box_follows_the_file_but_not_over_edits"

# The fingerprint sets the page's minimum width again, as the label did:
# on a Fold's cover screen that pushed the Stop button past the edge.
[[sabotage]]
name = "the fingerprint demands its full width again"
file = "src/sshd/sshd_window.cpp"
find = "\tm_fingerprint->setCursorPosition(0);"
replace = "\tm_fingerprint->setMinimumWidth(m_fingerprint->fontMetrics().horizontalAdvance(m_fingerprint->text()) + 40);"
expect = "it_serves_the_platform_root_on_the_platform_address"

# The time limit only queues the stop to Qt's thread -- the measured
# failure on the Fold, where that thread did not run it and the frozen
# process kept its socket in LISTEN.
[[sabotage]]
name = "the time limit stops the server only when Qt next runs"
file = "src/sshd/sshd_keeper.cpp"
find = "\tm_platform->set_stop_hook([this] { m_server.stop(); });"
replace = "\tm_platform->set_stop_hook([] {});"
expect = "the_time_limit_stops_the_server_and_says_why"

# A password set on the phone (sec 19, 2026-10-09): any password at all
# logs in -- the comparison that makes it a password gone.
[[sabotage]]
name = "any password logs in"
file = "src/sshd/sshd.cpp"
find = "\treturn hash.size() == stored.hash.size()\n\t       && CRYPTO_memcmp(hash.constData(), stored.hash.constData(), size_t(hash.size())) == 0;"
replace = "\treturn !hash.isEmpty();"
expect = "a_password_logs_in_once_it_is_set"

# Password login never offered: set on the phone, refused at the door.
[[sabotage]]
name = "a set password is never offered"
file = "src/sshd/sshd.cpp"
find = "\t                              | (passwords ? SSH_AUTH_METHOD_PASSWORD : 0));"
replace = "\t                              | 0);"
expect = "a_password_logs_in_once_it_is_set"

# The password itself written to disk rather than its salted hash.
[[sabotage]]
name = "the password is stored as it was typed"
file = "src/sshd/sshd.cpp"
find = "\t        + ':' + salt.toHex() + ':' + hash.toHex() + '\\n';"
replace = "\t        + ':' + salt.toHex() + ':' + hash.toHex() + ':' + password.toUtf8() + '\\n';"
expect = "a_password_is_stored_as_a_salted_hash"

# Wrong passwords counted per connection only: twelve guesses a second, for
# as long as the server is up.
[[sabotage]]
name = "a wait does not stop a password"
file = "src/sshd/sshd.cpp"
find = "\tif (!throttle.allowed(connection->peer, now)) {\n"
replace = "\tif (false) {\n"
expect = "guessing_across_connections_stops_a_right_password_too"

# The wait stops doubling.
[[sabotage]]
name = "wrong passwords never wait longer"
file = "src/sshd/login_throttle.h"
find = "\t\tconst std::chrono::seconds wait(1LL << std::min(over, 12));\n"
replace = "\t\tconst std::chrono::seconds wait(2);\n"
expect = "wrong_passwords_wait_longer_and_longer"

# Any number of addresses is remembered.
[[sabotage]]
name = "the table of addresses grows without bound"
file = "src/sshd/login_throttle.h"
find = "\t\tif (m_addresses.size() < max_addresses) return;\n"
replace = "\t\treturn;\n"
expect = "wrong_passwords_wait_longer_and_longer"

# A pipe blocks in open(), where Stop cannot reach it.
[[sabotage]]
name = "a named pipe is opened and waited on"
file = "src/sshd/sftp_handler.cpp"
find = "mode | O_CLOEXEC | O_NONBLOCK, permissions);"
replace = "mode | O_CLOEXEC, permissions);"
expect = "a_named_pipe_is_refused_and_holds_nothing_up"
