# Sabotages for sec 11's file store when the write fails.
#
# store() and erase() change memory and then flush. Returning the flush's
# answer while keeping the change leaves the caller told it failed and the
# process behaving as though it had not -- and a later successful write for
# any other id persists it.
#
# Each names the test that must notice. A sabotage caught by some OTHER
# test is reported as "WRONG TEST" rather than as a pass.

# The erase, which is the direction that costs: a password the user asked
# to forget, reported as still there, and gone.
[[sabotage]]
name = "a failed erase forgets the secret anyway"
file = "src/platform/secret_store_file.cpp"
find = '''
		const QJsonObject before = m_secrets;
		m_secrets.remove(id);
		if (flush()) return true;

		m_secrets = before;
		return false;'''
replace = '''
		m_secrets.remove(id);
		return flush();'''
expect = "an_erase_that_cannot_be_written_keeps_the_secret_readable"

# And the save, where a secret the user was told was not kept is readable
# for the rest of the session and lands on disk at the next write.
[[sabotage]]
name = "a failed save keeps the secret in memory anyway"
file = "src/platform/secret_store_file.cpp"
find = '''
		const QJsonObject before = m_secrets;
		m_secrets.insert(id, secret);
		if (flush()) return true;

		m_secrets = before;
		return false;'''
replace = '''
		m_secrets.insert(id, secret);
		return flush();'''
expect = "an_erase_that_cannot_be_written_keeps_the_secret_readable"
