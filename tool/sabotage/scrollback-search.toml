# Find in the scrollback (project.md sec 6.4): Ctrl+Shift+F opens a bar, a
# query searches the focused pane's scrollback and screen, and the matches
# are stepped through and highlighted. The search lives in the view, which
# owns the buffers; the window routes the bar to the focused pane. Five
# seams: the match-finding, the stepping, the scroll-to-match, the chord
# that opens the bar, and the bar reaching the view.
#
# All five seen to fail 2026-09-18 against the passing baseline.

# The search stops being case-insensitive.
#
# find_text is meant to ignore case -- a search for "needle" finds
# "NEEDLE". Make it case-sensitive and the uppercase matches vanish, so a
# mixed-case history reports fewer hits than it has.
[[sabotage]]
name = "find is case-sensitive"
file = "src/ui/terminal_view.cpp"
find = "\t\t\tconst int idx = text.indexOf(query, from, Qt::CaseInsensitive);"
replace = "\t\t\tconst int idx = text.indexOf(query, from, Qt::CaseSensitive);"
expect = "find_locates_matches_navigates_and_scrolls"

# Stepping ignores its direction.
#
# find_step(-1) should walk back up the matches; pin the step to +1 and
# previous does the same as next, so a user can never reach an earlier
# match except by wrapping all the way round.
[[sabotage]]
name = "find stepping ignores direction"
file = "src/ui/terminal_view.cpp"
find = "\tconst int step = direction < 0 ? -1 : 1;"
replace = "\tconst int step = 1;"
expect = "find_locates_matches_navigates_and_scrolls"

# A match off screen is not scrolled to.
#
# The whole point of find is to bring a match in the history onto the
# screen. Drop the scroll and the current match can sit above the viewport
# with nothing to show the user where it is.
[[sabotage]]
name = "find does not scroll to the match"
file = "src/ui/terminal_view.cpp"
find = "\tset_scroll_offset(int(qBound(qint64(0), offset, qint64(available_history()))));"
replace = "\tset_scroll_offset(0);"
expect = "find_locates_matches_navigates_and_scrolls"

# The find chord does not open the bar.
#
# Ctrl+Shift+F reaches handle_shortcut but goes nowhere, so the one way in
# to search is gone.
[[sabotage]]
name = "the find chord opens nothing"
file = "src/ui/main_window.cpp"
find = "\tif (shortcut == bssh_input_router::SHORTCUT_FIND) open_find();"
replace = "\tif (shortcut == bssh_input_router::SHORTCUT_FIND) {}"
expect = "the_find_chord_opens_a_bar_that_searches_the_pane"

# A wrapped line is searched a row at a time.
#
# find joins a row with the continuation rows below it, so a match that
# straddles the wrap is found. Stop the joining and each physical row is
# searched alone, and the word split across the wrap disappears.
[[sabotage]]
name = "find does not join wrapped rows"
file = "src/ui/terminal_view.cpp"
find = "\t\t} while (phys < end && line_is_continuation(phys));"
replace = "\t\t} while (false);"
expect = "find_matches_across_a_wrapped_line"

# The bar's query never reaches the view.
#
# run_find is where the bar's text becomes a search of the focused pane.
# Hand the view an empty query instead and the bar looks alive but finds
# nothing whatever is typed.
[[sabotage]]
name = "the find bar searches for nothing"
file = "src/ui/main_window.cpp"
find = "\t\tview->find_text(query);"
replace = "\t\tview->find_text(QString());"
expect = "the_find_chord_opens_a_bar_that_searches_the_pane"

# The touch route to the search goes away again.
#
# Restores the state found on 2026-09-21: the chord is the only way in,
# so a device with no keyboard cannot search its scrollback at all. The
# find bar is still built, still wired and still correct -- which is what
# made this invisible to every test that drives it directly.
[[sabotage]]
name = "the terminal menu stops offering find"
file = "src/ui/main_window.cpp"
find = "\tfind->setObjectName(QStringLiteral(\"terminal_find\"));"
replace = "\tfind->setObjectName(QStringLiteral(\"terminal_find_disabled\"));"
expect = "the_scrollback_search_is_reachable_without_a_keyboard"

# And the desktop's discoverable route.
#
# Ctrl+Shift+F still works, so this costs nobody who already knew; it
# costs everybody who did not.
[[sabotage]]
name = "the menu bar stops offering find"
file = "src/ui/main_window.cpp"
find = "\tfind->setObjectName(QStringLiteral(\"menu_find\"));"
replace = "\tfind->setObjectName(QStringLiteral(\"menu_find_disabled\"));"
expect = "the_scrollback_search_is_reachable_without_a_keyboard"

# The local route to dropping the history goes away.
#
# ED 3 still works, so a shell running `clear` is unaffected -- which is
# what would make this look fine: the remote's route is the one every
# emulator test drives. What goes is the user's own, and a disconnected
# session has no remote to ask.
[[sabotage]]
name = "the terminal menu stops offering clear scrollback"
file = "src/ui/main_window.cpp"
find = "\tclear_history->setObjectName(QStringLiteral(\"terminal_clear_scrollback\"));"
replace = "\tclear_history->setObjectName(QStringLiteral(\"terminal_clear_disabled\"));"
expect = "the_history_can_be_dropped_without_the_remote"

# The clear stops announcing itself.
#
# The history goes and nothing is told, so a view stays scrolled into
# lines that no longer exist and the accessibility layer keeps a
# flattened copy of them. This is the half a second implementation
# forgets, which is why the remote's route now calls this one.
[[sabotage]]
name = "dropping the history says nothing"
file = "src/term/emulator_vterm.cpp"
find = "\tm_private->scrollback.clear();\n\n\t/*\n\t * Announced, for the reason on_sb_clear gives"
replace = "\tm_private->scrollback.clear();\n\treturn;\n\n\t/*\n\t * Announced, for the reason on_sb_clear gives"
expect = "the_history_can_be_dropped_without_the_remote"

# The wedged-terminal cure goes away on the surface touch has.
#
# `reset` in the shell still works, which is what would make this look
# fine -- and it is exactly what a wedged terminal makes hard to type,
# and what a DROPPED session offers no shell for at all.
[[sabotage]]
name = "the terminal menu stops offering reset"
file = "src/ui/main_window.cpp"
find = "\treset_terminal->setObjectName(QStringLiteral(\"terminal_reset\"));"
replace = "\treset_terminal->setObjectName(QStringLiteral(\"terminal_reset_disabled\"));"
expect = "the_history_can_be_dropped_without_the_remote"

# And on the desktop's own.
[[sabotage]]
name = "the menu bar stops offering reset"
file = "src/ui/main_window.cpp"
find = "\treset_terminal->setObjectName(QStringLiteral(\"menu_reset_terminal\"));"
replace = "\treset_terminal->setObjectName(QStringLiteral(\"menu_reset_disabled\"));"
expect = "the_history_can_be_dropped_without_the_remote"

# A selection outlives the history it named.
#
# bssh_scrollback::clear advances the base so a cleared line fails to be
# found rather than being found as a different line -- and the view held
# exactly such a name in its selection and was never told. It went on
# reporting a selection over lines that were gone, so Copy stayed offered
# and answered with the blanks they resolve to.
[[sabotage]]
name = "a selection survives the history it pointed into"
file = "src/ui/terminal_view.cpp"
find = "\t\t\tdrop_evicted_selection();"
replace = ""
expect = "dropping_the_history_takes_the_selection_with_it"

# And the other way, which is the half that costs more if it is wrong: a
# ring evicting its oldest line under a selection reaching down into the
# live screen has taken PART of it, and dropping the whole thing there
# would lose a selection because output arrived.
[[sabotage]]
name = "an evicted line takes a selection that is still mostly there"
file = "src/ui/terminal_view.cpp"
find = "\tif (m_selection_anchor_line >= base || m_selection_focus_line >= base) return;"
replace = "\t(void) base;"
expect = "a_selection_stays_on_its_text_when_the_scrollback_evicts"

# The find matches outlive the history they named, which is the same
# fault as the selection's one entry up, in the feature on the same menu
# -- and worse to look at, because the count is a NUMBER: the bar goes on
# saying three matches with none of them anywhere.
[[sabotage]]
name = "find matches survive the history they pointed into"
file = "src/ui/terminal_view.cpp"
find = "\t\t\tdrop_evicted_find_matches();"
replace = ""
expect = "dropping_the_history_takes_the_find_matches_too"

# And the route to the bar. The view can drop them perfectly and the
# count on screen still be the old one: it is PULLED, by the window, when
# a query changes or a step is taken. Nothing else asks.
[[sabotage]]
name = "the bar is never told the matches went"
file = "src/ui/main_window.cpp"
find = "\tconnect(m_panes, &bssh_pane_container::find_matches_changed,\n\t         this, &bssh_main_window::update_find_status);"
replace = ""
expect = "the_find_bars_count_is_told_when_the_matches_go"
