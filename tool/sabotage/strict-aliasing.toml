# Sabotage for -fno-strict-aliasing (beerssh.pro, test/tests.pro), which
# Qt's headers need before its 2026 fix: QArrayDataPointer downcasts itself
# to QArrayDataOps, and GCC's alias analysis then emptied a list of cells
# joined from rows. Against a fixed Qt this passes either way, so it is
# caught only where the fault is.

# Strict aliasing back on: the join in emulator_test comes out empty.
[[sabotage]]
name = "the tests build with strict aliasing on"
file = "test/tests.pro"
find = "QMAKE_CXXFLAGS_RELEASE += -fno-strict-aliasing\n"
replace = ""
expect = "joining_lists_of_cells_keeps_every_cell"
