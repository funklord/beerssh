[project]
# The version qmake passes as BSSH_VERSION_STRING, read from the file it
# and debian/changelog already agree about rather than written a third time.
#
# BSSH_TEST_FONT_DIR is what test/tests.pro:36 passes as `$$PWD/../fonts`,
# and it is project-wide rather than per-target on purpose: the test
# program is one binary rooted by test/main.cpp, so a per-target define
# reaches that root and not test/font_catalog_test.cpp, which is where the
# macro is actually used. Without it `--eject make` -- which compiles the
# test program to write its rules -- stops inside Qt's qstringliteral.h
# with `expected primary-expression before '(' token', the same shape
# BSSH_VERSION_STRING had before the line above carried it.
defines = ['BSSH_VERSION_STRING="$file(VERSION)"',
           'BSSH_TEST_FONT_DIR="$root/fonts"']

# What the Makefile's test target already sets. Without it the test program
# builds and then aborts for want of a display, which reads as a broken
# build rather than a missing variable.
test-env = ["QT_QPA_PLATFORM=offscreen"]

# The vendored libvterm's public header. qmake carries the same path as
# INCLUDEPATH; without it src/term/emulator_vterm.cpp does not compile and
# every bssh_emulator method is missing at the link. softkeys/include for
# the same reason: the keyboard's headers are "softkeys/keyboard.h".
include-dirs = ["vterm/include", "softkeys/include"]

# Android-only translation units. qmake scopes them out with `android { }`;
# on a desktop build they reach for QJniEnvironment, which is not there.
exclude = [
  # softkeys' own test program, a second main() that is not BeerSSH's.
  "softkeys/test",
  "src/platform/secret_store_keystore.cpp",
  "src/platform/platform_android.cpp",
  # Android's own HTTPS for font downloads, over JNI (project.md sec 5.2).
  "src/platform/range_source_android.cpp",
  # beersshd's Android half (sec 19): its JNI platform, and the main()
  # that opens its window -- on the desktop beersshd is src/sshd/main.cpp.
  "src/sshd/sshd_platform_android.cpp",
  "src/sshd/main_android.cpp",
  # The Android dependency trees: two prebuilt libcrypto.a for the same
  # ABI, plus OpenSSL's own source and test programs beside them. Nothing
  # tracked lives under either, and on a desktop build they are two
  # definitions of every OpenSSL symbol and a few hundred targets nobody
  # asked for.
  "deps",
  "build-deps-android",
  # qmake's own output, which holds a moc_*.cpp for every class fmake also
  # mocs. `build-*` rather than naming each: qmake writes one directory per
  # configuration and a list of them goes stale the next time somebody
  # builds for a new target. Nothing tracked lives under any of them.
  "build-*",
]

# beersshd's main() lives in src/sshd/, and a program rooted at main.cpp
# is named after its directory -- which would install a second `sshd`
# beside OpenSSH's. The name the Makefile and the package use instead.
[target.sshd]
name = "beersshd"
